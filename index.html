  // ---------- el sistema de batallas ----------
  const BASE_POWER = {0:0,1:4,2:7,3:14,4:19,5:24};
  const BEATS = {Ataque:'Especial', Especial:'Defensa', Defensa:'Ataque'};

  function powerOf(p){
    const statBonus = p.stats ? Math.round((p.stats.atq + p.stats.mag)/6) : 0;
    return BASE_POWER[p.stage] + (p.path?2:0) + statBonus + Math.round((p.health!==undefined?p.health:100)/100*4);
  }
  function mySnapshot(){
    return { name:pet.name, species:speciesDisplay(pet), stage:pet.stage, path:pet.path, power:powerOf(pet),
      temperament:pet.temperament, hue:pet.hue, bodyShape:pet.bodyShape, featureType:pet.featureType,
      eyeStyle:pet.eyeStyle, pattern:pet.pattern, bgSeed:pet.bgSeed };
  }
  function resolveMoves(moveA, moveB, powA, powB, pathA, pathB){
    let dmgToA=0, dmgToB=0, text='';
    if(moveA===moveB){
      dmgToA = 9+Math.round(powB*0.6); dmgToB = 9+Math.round(powA*0.6);
      text = 'Ambos usan '+moveA+' — chocan de igual a igual.';
    } else if(BEATS[moveA]===moveB){
      dmgToB = 17+powA; dmgToA = 5+Math.round(powB*0.4);
      text = moveA+' vence a '+moveB+'.';
    } else {
      dmgToA = 17+powB; dmgToB = 5+Math.round(powA*0.4);
      text = moveB+' vence a '+moveA+'.';
    }

    let healA=0, healB=0;
    const extra=[];
    if(moveA==='Especial'){
      if(pathA==='luz'){ healA+=8; extra.push('la Senda Luz cura un poco de vida.'); }
      else if(pathA==='sombra'){ dmgToB+=5; dmgToA+=3; extra.push('la Senda Sombra añade daño extra con retroceso.'); }
      else if(pathA==='equilibrio'){ dmgToA=Math.max(0,dmgToA-5); extra.push('la Senda Equilibrio amortigua el golpe recibido.'); }
    }
    if(moveB==='Especial'){
      if(pathB==='luz'){ healB+=8; extra.push('la Senda Luz rival cura algo de vida.'); }
      else if(pathB==='sombra'){ dmgToA+=5; dmgToB+=3; extra.push('la Senda Sombra rival añade daño extra con retroceso.'); }
      else if(pathB==='equilibrio'){ dmgToB=Math.max(0,dmgToB-5); extra.push('la Senda Equilibrio rival amortigua el golpe.'); }
    }
    if(extra.length) text += ' Además, '+extra.join(' Y ');
    return {dmgToA, dmgToB, healA, healB, text};
  }

  let battleTimer = null;
  function stopBattlePoll(){ if(battleTimer){ clearInterval(battleTimer); battleTimer=null; } }

  function openBattleModal(){
    if(pet.stage===0 || !pet.alive){ showToast('Tu mascota necesita nacer primero 🥚'); return; }
    const el = document.createElement('div');
    el.className='modal-backdrop'; el.id='battleModal';
    el.innerHTML = `<div class="modal">
      <button class="close-x" id="closeBattle">✕</button>
      <h3>ARENA</h3>
      <div class="tabrow">
        <button id="tabLocal" class="active">Local</button>
        <button id="tabOnline">Online</button>
        <button id="tabDungeon">Mazmorra</button>
      </div>
      <div id="battleContent"></div>
    </div>`;
    document.getElementById('modalRoot').appendChild(el);
    refreshScrollLock();
    document.getElementById('closeBattle').onclick=()=>{ stopBattlePoll(); el.remove(); refreshScrollLock(); };
    el.addEventListener('click',(e)=>{ if(e.target===el){ stopBattlePoll(); el.remove(); refreshScrollLock(); } });
    function setTab(t){
      stopBattlePoll();
      document.getElementById('tabLocal').classList.toggle('active', t==='local');
      document.getElementById('tabOnline').classList.toggle('active', t==='online');
      document.getElementById('tabDungeon').classList.toggle('active', t==='dungeon');
      if(t==='local') renderLocalSetup(); else if(t==='online') renderOnlineHome(); else renderDungeonHome();
    }
    document.getElementById('tabLocal').onclick=()=>setTab('local');
    document.getElementById('tabOnline').onclick=()=>setTab('online');
    document.getElementById('tabDungeon').onclick=()=>setTab('dungeon');
    setTab('local');
  }

  function renderLocalSetup(){
    const c = document.getElementById('battleContent');
    c.innerHTML = `
      <p class="small-note">Combate local — pasad el mismo móvil entre los dos jugadores, sin conexión.</p>
      <input type="text" id="p2name" placeholder="Nombre del rival" maxlength="12">
      <select id="p2stage" style="width:100%;margin-top:8px;padding:9px;border-radius:8px;background:#11141c;color:var(--ink);border:1px solid #000;">
        <option value="1">Cría</option><option value="2">Pequeño</option>
        <option value="3" selected>Joven</option><option value="4">Perfecto</option><option value="5">Supremo</option>
      </select>
      <select id="p2path" style="width:100%;margin-top:8px;padding:9px;border-radius:8px;background:#11141c;color:var(--ink);border:1px solid #000;">
        <option value="luz">Senda Luz</option><option value="sombra">Senda Sombra</option><option value="equilibrio">Senda Equilibrio</option>
      </select>
      <div class="modal-actions"><button id="startLocal">⚔️ Empezar combate</button></div>
    `;
    document.getElementById('startLocal').onclick=()=>{
      const name = document.getElementById('p2name').value.trim() || 'Rival';
      const stage = parseInt(document.getElementById('p2stage').value,10);
      const path = document.getElementById('p2path').value;
      const guestAff = STAT_KEYS[Math.floor(Math.random()*STAT_KEYS.length)];
      const guestTemp = Math.random()<0.5?'Activo':'Tranquilo';
      const visual = previewSnapshot(path, guestAff, guestTemp);
      const p2 = { name, species:'Invitado', stage, path, power: BASE_POWER[stage]+2, ...visual, stage };
      startLocalBattle(mySnapshot(), p2);
    };
  }

  let localState = null;
  function startLocalBattle(p1, p2){
    localState = { p1:{...p1,hp:100,move:null}, p2:{...p2,hp:100,move:null}, log:[], turnOf:1 };
    renderLocalBattle();
  }
  function renderLocalBattle(){
    const c = document.getElementById('battleContent');
    const s = localState;
    if(!s) return;
    const active = s.turnOf===1?s.p1:s.p2;
    const finished = s.p1.hp<=0 || s.p2.hp<=0;
    c.innerHTML = `
      <div class="vs">
        <div class="arena-hpbar left"><div class="arena-hpfill" style="width:${Math.max(0,s.p1.hp)}%"></div></div>
        <div class="arena-hpbar right"><div class="arena-hpfill" style="width:${Math.max(0,s.p2.hp)}%"></div></div>
        <div class="vs-badge">VS</div>
        <div class="fighter" id="lbFighter1"><div class="battle-sprite-box"><canvas id="lbCanvas1" width="200" height="200"></canvas><div class="name-tag">${s.p1.name}</div></div><small>${s.p1.species}</small></div>
        <div class="fighter" id="lbFighter2"><div class="battle-sprite-box"><canvas id="lbCanvas2" width="200" height="200"></canvas><div class="name-tag">${s.p2.name}</div></div><small>${s.p2.species}</small></div>
      </div>
      ${finished ? `<p style="text-align:center;font-weight:800;">${s.p1.hp<=0?s.p2.name:s.p1.name} gana la batalla 🏆</p>
        <div class="modal-actions"><button id="againLocal">Volver a jugar</button></div>`
      : `<p class="small-note" style="text-align:center;">Turno de <b>${active.name}</b> — elige movimiento:</p>
        <div class="movegrid">
          <button data-mv="Ataque">⚔️<br>Ataque</button>
          <button data-mv="Especial">✨<br>Especial</button>
          <button data-mv="Defensa">🛡️<br>Defensa</button>
        </div>`}
      <div class="battlelog">${s.log.slice().reverse().map(l=>'<div>'+l+'</div>').join('') || 'El combate comienza...'}</div>
    `;
    const cv1 = document.getElementById('lbCanvas1'), cv2 = document.getElementById('lbCanvas2');
    if(cv1){ useCanvas(cv1); drawCreature({...s.p1, stage:s.p1.stage||3, frame:0, sick:false, sleeping:false}); }
    if(cv2){ useCanvas(cv2); drawCreature({...s.p2, stage:s.p2.stage||3, frame:0, sick:false, sleeping:false}); }
    useScreenCanvas();
    if(!finished){
      c.querySelectorAll('[data-mv]').forEach(btn=>{
        btn.onclick=async ()=>{
          sfx('tap');
          const mv = btn.getAttribute('data-mv');
          if(s.turnOf===1){ s.p1.move=mv; s.turnOf=2; renderLocalBattle(); }
          else {
            s.p2.move=mv;
            const r = resolveMoves(s.p1.move, s.p2.move, s.p1.power, s.p2.power, s.p1.path, s.p2.path);
            sfx('hit');
            await playBattleClash('lbFighter1','lbFighter2', Math.max(0,Math.round(r.dmgToA-r.healA)), Math.max(0,Math.round(r.dmgToB-r.healB)), s.p1.move, s.p2.move);
            s.p1.hp = Math.min(100, Math.max(0, s.p1.hp - r.dmgToA + r.healA));
            s.p2.hp = Math.min(100, Math.max(0, s.p2.hp - r.dmgToB + r.healB));
            s.log.push(s.p1.name+' usó '+s.p1.move+' · '+s.p2.name+' usó '+s.p2.move+' — '+r.text);
            s.p1.move=null; s.p2.move=null; s.turnOf=1;
            if(s.p1.hp<=0 || s.p2.hp<=0){ sfx('win'); if(s.p2.hp<=0){ gainXp(6); savePet(); } }
            renderLocalBattle();
          }
        };
      });
    } else {
      document.getElementById('againLocal').onclick=()=>{ sfx('tap'); renderLocalSetup(); };
    }
  }

  // ---- la mazmorra (PvE contra monstruos, sube de nivel de verdad) ----
  const MONSTER_ICONS = ['👹','👺','💀','🐉','🦂','🕷️','👻','🦖','🐺','🧟'];
  const MONSTER_SYLL = ['Grum','Vak','Thex','Mor','Skree','Bhal','Nex','Gorr','Drek','Vhal'];
  const MONSTER_TYPES = ['atq','def','mag','res','vel','salvaje'];
  const MONSTER_TYPE_LABEL = {atq:'Guerrero (Ataque)', def:'Tanque (Defensa)', mag:'Místico (Magia)', res:'Guardián (Resistencia)', vel:'Veloz (Velocidad)', salvaje:'Salvaje (mixto)'};
  function proceduralMonsterName(seed){
    const rand = mulberry32(seed);
    let parts=[], last=null;
    for(let i=0;i<2;i++){
      let s; do{ s = MONSTER_SYLL[Math.floor(rand()*MONSTER_SYLL.length)]; }while(s===last);
      parts.push(s); last=s;
    }
    return parts.join('');
  }
  function generateMonster(floor){
    const seed = floor*7919 + 13;
    const rand = mulberry32(seed);
    const type = MONSTER_TYPES[Math.floor(rand()*MONSTER_TYPES.length)];
    const w = AFFINITY_WEIGHTS[type] || AFFINITY_WEIGHTS.equilibrado;
    const mStage = Math.min(5, 3+Math.floor(floor/4));
    return {
      name: proceduralMonsterName(seed+1),
      type: type,
      floor: floor,
      hp: 55 + floor*13,
      power: 6 + Math.floor(floor*2.4),
      sprite: {
        stage: mStage, frame:0, sick:false, sleeping:false,
        temperament: rand()<0.5?'Activo':'Tranquilo',
        path: ['luz','sombra','equilibrio'][Math.floor(rand()*3)],
        hue: Math.floor(rand()*360),
        bodyShape: weightedPick(rand, EVO_SHAPE_OPTS, w.shape),
        featureType: weightedPick(rand, EVO_FEAT_OPTS, w.feat),
        eyeStyle: ['rasgados','ciclope','trio'][Math.floor(rand()*3)],
        pattern: ['manchas','rayas','estrellado'][Math.floor(rand()*3)],
        bgSeed: seed+999
      }
    };
  }
  function dungeonRewards(monster){
    const levelFactor = 1 / (1 + pet.level*0.12);
    const xp = Math.max(2, Math.round((8 + monster.floor*2) * levelFactor));
    const statPts = Math.max(1, Math.round((4 + monster.floor*1.5) * levelFactor));
    return {xp, statPts};
  }
  function applyMonsterTypeReward(type, pts){
    if(type==='salvaje'){
      STAT_KEYS.forEach(k=>{ pet.stats[k] += Math.max(1, Math.round(pts/STAT_KEYS.length)); });
    } else {
      pet.stats[type] += pts;
    }
  }

  let dungeonState = null;
  function renderDungeonHome(){
    const c = document.getElementById('battleContent');
    const monster = generateMonster(pet.dungeonFloor);
    const defeated = (pet.dungeonDefeated||[]).filter(f=>f!==pet.dungeonFloor);
    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Gana combates para subir de piso, ganar XP y puntos de stats según el tipo de enemigo. Cuanto más nivel tengas, menos te dará cada combate.</p>
      <div class="vs">
        <div class="vs-badge">VS</div>
        <div class="fighter"><div class="battle-sprite-box"><canvas id="dungeonPreviewMe" width="200" height="200"></canvas><div class="name-tag">${pet.name}</div></div><small>Nv.${pet.level}</small></div>
        <div class="fighter"><div class="battle-sprite-box"><canvas id="dungeonPreviewMon" width="200" height="200"></canvas><div class="name-tag">${monster.name}</div></div><small>Piso ${monster.floor}</small><div class="type-badge">${MONSTER_TYPE_LABEL[monster.type]}</div></div>
      </div>
      <div class="modal-actions"><button class="status-btn action-btn" id="startDungeon">⚔️ Enfrentarse</button></div>
      ${defeated.length ? `<h3 style="font-size:11px;margin-top:16px;">ENEMIGOS YA DERROTADOS</h3>
        <p class="small-note">Puedes volver a enfrentarte a ellos, aunque den menos recompensa que un piso nuevo.</p>
        <div class="defeated-list">${defeated.map(f=>`<span class="defeated-chip" data-floor="${f}">Piso ${f}</span>`).join('')}</div>` : ''}
    `;
    document.getElementById('startDungeon').onclick = ()=>{ sfx('tap'); startDungeonBattle(monster); };
    const meCv = document.getElementById('dungeonPreviewMe');
    if(pet.stage>0){ useCanvas(meCv); if(pet.stage===0) drawEgg(0, pet.bgSeed); else drawCreature(snapshotVisual(pet)); useScreenCanvas(); }
    const monCv = document.getElementById('dungeonPreviewMon');
    if(monCv){ useCanvas(monCv); drawCreature(monster.sprite); useScreenCanvas(); }
    c.querySelectorAll('[data-floor]').forEach(chip=>{
      chip.onclick=()=>{ sfx('tap'); startDungeonBattle(generateMonster(parseInt(chip.getAttribute('data-floor'),10))); };
    });
  }

  function startDungeonBattle(monster){
    dungeonState = {
      p1:{ name:pet.name, species:speciesDisplay(pet), power:powerOf(pet), path:pet.path, hp:100, move:null },
      m:{ name:monster.name, sprite:monster.sprite, type:monster.type, floor:monster.floor, power:monster.power, hp:100, move:null },
      log:[], turnOf:1
    };
    renderDungeonBattle();
  }

  function renderDungeonBattle(){
    const c = document.getElementById('battleContent');
    const s = dungeonState;
    if(!s) return;
    const finished = s.p1.hp<=0 || s.m.hp<=0;
    c.innerHTML = `
      <div class="vs">
        <div class="arena-hpbar left"><div class="arena-hpfill" style="width:${Math.max(0,s.p1.hp)}%"></div></div>
        <div class="arena-hpbar right"><div class="arena-hpfill" style="width:${Math.max(0,s.m.hp)}%"></div></div>
        <div class="vs-badge">VS</div>
        <div class="fighter" id="dgFighterMe"><div class="battle-sprite-box"><canvas id="dungeonBattleMe" width="200" height="200"></canvas><div class="name-tag">${s.p1.name}</div></div><small>${s.p1.species}</small></div>
        <div class="fighter" id="dgFighterMon"><div class="battle-sprite-box"><canvas id="dungeonBattleMon" width="200" height="200"></canvas><div class="name-tag">${s.m.name}</div></div><small>${MONSTER_TYPE_LABEL[s.m.type]}</small></div>
      </div>
      ${finished ? (s.m.hp<=0
          ? `<p style="text-align:center;font-weight:800;">¡Victoria! 🏆</p>
             <div class="modal-actions"><button class="status-btn action-btn" id="nextFloor">${s.m.floor===pet.dungeonFloor?'Siguiente piso':'Volver a la mazmorra'}</button></div>`
          : `<p style="text-align:center;font-weight:800;">${s.m.name} te ha derrotado 💥</p>
             <div class="modal-actions"><button class="status-btn action-btn" id="retryFloor">Reintentar</button></div>`)
      : `<p class="small-note" style="text-align:center;">Elige tu movimiento:</p>
        <div class="movegrid">
          <button data-mv="Ataque">⚔️<br>Ataque</button>
          <button data-mv="Especial">✨<br>Especial</button>
          <button data-mv="Defensa">🛡️<br>Defensa</button>
        </div>`}
      <div class="battlelog">${s.log.slice().reverse().map(l=>'<div>'+l+'</div>').join('') || 'El combate comienza...'}</div>
    `;
    const meCv = document.getElementById('dungeonBattleMe');
    if(meCv){ useCanvas(meCv); if(pet.stage===0) drawEgg(0, pet.bgSeed); else drawCreature(snapshotVisual(pet)); useScreenCanvas(); }
    const monCv = document.getElementById('dungeonBattleMon');
    if(monCv){ useCanvas(monCv); drawCreature(s.m.sprite); useScreenCanvas(); }
    if(!finished){
      c.querySelectorAll('[data-mv]').forEach(btn=>{
        btn.onclick=async ()=>{
          sfx('tap');
          const mv = btn.getAttribute('data-mv');
          const MOVES3 = ['Ataque','Especial','Defensa'];
          const mmv = MOVES3[Math.floor(Math.random()*3)];
          const r = resolveMoves(mv, mmv, s.p1.power, s.m.power, s.p1.path, null);
          sfx('hit');
          await playBattleClash('dgFighterMe','dgFighterMon', Math.max(0,Math.round(r.dmgToA-r.healA)), Math.max(0,Math.round(r.dmgToB-r.healB)), mv, mmv);
          s.p1.hp = Math.min(100, Math.max(0, s.p1.hp - r.dmgToA + r.healA));
          s.m.hp = Math.min(100, Math.max(0, s.m.hp - r.dmgToB + r.healB));
          s.log.push(s.p1.name+' usó '+mv+' · '+s.m.name+' usó '+mmv+' — '+r.text);
          if(s.p1.hp<=0 || s.m.hp<=0){
            if(s.m.hp<=0){
              sfx('win');
              const rew = dungeonRewards(s.m);
              gainXp(rew.xp);
              applyMonsterTypeReward(s.m.type, rew.statPts);
              if(!pet.dungeonDefeated) pet.dungeonDefeated=[];
              if(!pet.dungeonDefeated.includes(s.m.floor)) pet.dungeonDefeated.push(s.m.floor);
              if(s.m.floor===pet.dungeonFloor) pet.dungeonFloor += 1;
              s.log.push('¡Has ganado '+rew.xp+' XP y '+rew.statPts+' puntos de '+STAT_LABEL[s.m.type]+'!');
              savePet();
            } else {
              sfx('lose');
              pet.happy = clamp(pet.happy-10);
              savePet();
            }
          }
          renderDungeonBattle();
        };
      });
    } else if(s.m.hp<=0){
      document.getElementById('nextFloor').onclick=()=>{ sfx('tap'); dungeonState=null; renderDungeonHome(); };
    } else {
      document.getElementById('retryFloor').onclick=()=>{ sfx('tap'); dungeonState=null; renderDungeonHome(); };
    }
  }

  // ---- la arena online (con almacenamiento compartido) ----
  const ARENA_OPEN_KEY = 'bytemon:arena:open';
  function battleKey(id){ return 'bytemon:arena:battle:'+id; }

  async function getOpenList(){
    try{
      const res = await CloudAdapter.get(ARENA_OPEN_KEY, true);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){}
    return [];
  }
  async function setOpenList(list){
    try{ await CloudAdapter.set(ARENA_OPEN_KEY, JSON.stringify(list), true); }catch(e){}
  }

  const LEADERBOARD_KEY = 'bytemon:leaderboard';
  async function recordWin(winnerName, winnerSpecies){
    let board = [];
    try{
      const res = await CloudAdapter.get(LEADERBOARD_KEY, true);
      if(res && res.value) board = JSON.parse(res.value);
    }catch(e){}
    const idx = board.findIndex(b=>b.name===winnerName && b.species===winnerSpecies);
    if(idx>=0) board[idx].wins++; else board.push({name:winnerName, species:winnerSpecies, wins:1});
    board.sort((a,b)=>b.wins-a.wins);
    board = board.slice(0,10);
    try{ await CloudAdapter.set(LEADERBOARD_KEY, JSON.stringify(board), true); }catch(e){}
  }
  async function renderLeaderboard(){
    const box = document.getElementById('leaderboardBox');
    if(!box) return;
    box.innerHTML = '<p class="small-note">Cargando ranking...</p>';
    let board = [];
    try{
      const res = await CloudAdapter.get(LEADERBOARD_KEY, true);
      if(res && res.value) board = JSON.parse(res.value);
    }catch(e){}
    if(board.length===0){ box.innerHTML = '<p class="small-note">Aún no hay victorias registradas. ¡Sé el primero!</p>'; return; }
    box.innerHTML = board.map((b,i)=>`<div class="challenge-item"><span>#${i+1} ${b.name} <small style="color:var(--muted)">(${b.species})</small></span><b>${b.wins} 🏆</b></div>`).join('');
  }

  async function renderOnlineHome(){
    const c = document.getElementById('battleContent');
    c.innerHTML = `<p class="small-note">Combate online — cualquiera que abra este mismo VPET puede retarte, esté donde esté. Tu nombre y tu especie serán visibles para otros jugadores mientras el reto esté abierto.</p>
      <div class="modal-actions">
        <button id="createChallengeBtn">📣 Crear reto</button>
        <button id="refreshChallengesBtn">🔄 Ver retos</button>
      </div>
      <div id="challengeList"></div>
      <h3 style="font-size:11px;margin-top:18px;">🏆 RANKING GLOBAL</h3>
      <div id="leaderboardBox"></div>`;
    document.getElementById('createChallengeBtn').onclick = createChallenge;
    document.getElementById('refreshChallengesBtn').onclick = loadOpenChallenges;
    loadOpenChallenges();
    renderLeaderboard();
  }

  async function createChallenge(){
    let list = await getOpenList();
    const now = Date.now();
    list = list.filter(c => now - c.ts < 10*60*1000 && c.name);
    const id = 'b'+now+Math.random().toString(36).slice(2,7);
    const mine = mySnapshot();
    list.push({ id, ...mine, ts: now });
    await setOpenList(list);
    showToast('Reto publicado — esperando rival...');
    waitForOpponent(id, mine);
  }

  function waitForOpponent(id, mineSnapshot){
    const c = document.getElementById('battleContent');
    c.innerHTML = `<p style="text-align:center;">Esperando que alguien acepte tu reto...</p>
      <div class="battlelog">Tu reto: <b>${mineSnapshot.name}</b> (${mineSnapshot.species})</div>
      <div class="modal-actions"><button id="cancelChallenge">Cancelar</button></div>`;
    document.getElementById('cancelChallenge').onclick = async ()=>{
      stopBattlePoll();
      let list = await getOpenList();
      list = list.filter(x=>x.id!==id);
      await setOpenList(list);
      renderOnlineHome();
    };
    battleTimer = setInterval(async ()=>{
      try{
        const res = await CloudAdapter.get(battleKey(id), true);
        if(res && res.value){
          stopBattlePoll();
          enterOnlineBattle(id, 'p1');
        }
      }catch(e){}
    }, 2500);
  }

  async function loadOpenChallenges(){
    const list = await getOpenList();
    const now = Date.now();
    const fresh = list.filter(c=>now-c.ts<10*60*1000);
    const box = document.getElementById('challengeList');
    if(!box) return;
    if(fresh.length===0){ box.innerHTML = '<p class="small-note">No hay retos abiertos ahora mismo. ¡Crea uno!</p>'; return; }
    box.innerHTML = fresh.map(ch => `<div class="challenge-item"><span>${ch.name} <small style="color:var(--muted)">(${ch.species})</small></span><button data-accept="${ch.id}">Aceptar</button></div>`).join('');
    box.querySelectorAll('[data-accept]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.getAttribute('data-accept');
        let openList = await getOpenList();
        const challenge = openList.find(x=>x.id===id);
        if(!challenge){ showToast('Ese reto ya no está disponible'); loadOpenChallenges(); return; }
        openList = openList.filter(x=>x.id!==id);
        await setOpenList(openList);
        const doc = {
          id, round:1, resolvedRound:0, finished:false, winner:null, log:[],
          p1:{ ...challenge, hp:100, move:null },
          p2:{ ...mySnapshot(), hp:100, move:null }
        };
        await CloudAdapter.set(battleKey(id), JSON.stringify(doc), true);
        enterOnlineBattle(id, 'p2');
      };
    });
  }

  function enterOnlineBattle(id, mySlot){
    lastOnlineShakeRound = -1;
    lastOnlineHp = {p1:100, p2:100};
    async function poll(){
      let doc;
      try{
        const res = await CloudAdapter.get(battleKey(id), true);
        if(!res || !res.value) return;
        doc = JSON.parse(res.value);
      }catch(e){ return; }

      if(!doc.finished && doc.p1.move && doc.p2.move && doc.resolvedRound < doc.round){
        const r = resolveMoves(doc.p1.move, doc.p2.move, doc.p1.power, doc.p2.power, doc.p1.path, doc.p2.path);
        doc.p1.hp = Math.min(100, Math.max(0, doc.p1.hp - r.dmgToA + r.healA));
        doc.p2.hp = Math.min(100, Math.max(0, doc.p2.hp - r.dmgToB + r.healB));
        doc.log.push(doc.p1.name+' usó '+doc.p1.move+' · '+doc.p2.name+' usó '+doc.p2.move+' — '+r.text);
        doc.lastMove1 = doc.p1.move; doc.lastMove2 = doc.p2.move;
        doc.p1.move=null; doc.p2.move=null;
        doc.resolvedRound = doc.round;
        doc.round += 1;
        sfx('hit');
        if(doc.p1.hp<=0 || doc.p2.hp<=0){
          doc.finished=true;
          doc.winner = doc.p1.hp<=0? doc.p2.name : doc.p1.name;
          const winnerSpecies = doc.p1.hp<=0 ? doc.p2.species : doc.p1.species;
          recordWin(doc.winner, winnerSpecies);
          const iWon = (mySlot==='p1' && doc.p2.hp<=0) || (mySlot==='p2' && doc.p1.hp<=0);
          if(iWon){ gainXp(8); savePet(); }
        }
        try{ await CloudAdapter.set(battleKey(id), JSON.stringify(doc), true); }catch(e){}
      }
      renderOnlineBattleUI(doc, mySlot, id);
    }
    poll();
    battleTimer = setInterval(poll, 2000);
  }

  function renderOnlineBattleUI(doc, mySlot, id){
    const c = document.getElementById('battleContent');
    const me = doc[mySlot];
    const opp = doc[mySlot==='p1'?'p2':'p1'];
    const myMoveSet = !!me.move;
    c.innerHTML = `
      <div class="vs">
        <div class="arena-hpbar left"><div class="arena-hpfill" style="width:${Math.max(0,doc.p1.hp)}%"></div></div>
        <div class="arena-hpbar right"><div class="arena-hpfill" style="width:${Math.max(0,doc.p2.hp)}%"></div></div>
        <div class="vs-badge">VS</div>
        <div class="fighter" id="obFighter1"><div class="battle-sprite-box"><canvas id="obCanvas1" width="200" height="200"></canvas><div class="name-tag">${doc.p1.name}</div></div><small>${doc.p1.species}</small></div>
        <div class="fighter" id="obFighter2"><div class="battle-sprite-box"><canvas id="obCanvas2" width="200" height="200"></canvas><div class="name-tag">${doc.p2.name}</div></div><small>${doc.p2.species}</small></div>
      </div>
      ${doc.finished ? `<p style="text-align:center;font-weight:800;">${doc.winner} gana la batalla 🏆</p>
        <div class="modal-actions"><button id="backOnline">Volver a la arena</button></div>`
      : myMoveSet ? `<p class="small-note" style="text-align:center;">Esperando el movimiento de ${opp.name}...</p>`
      : `<p class="small-note" style="text-align:center;">Elige tu movimiento:</p>
        <div class="movegrid">
          <button data-mv="Ataque">⚔️<br>Ataque</button>
          <button data-mv="Especial">✨<br>Especial</button>
          <button data-mv="Defensa">🛡️<br>Defensa</button>
        </div>`}
      <div class="battlelog">${(doc.log||[]).slice().reverse().map(l=>'<div>'+l+'</div>').join('') || 'El combate comienza...'}</div>
    `;
    const ob1 = document.getElementById('obCanvas1'), ob2 = document.getElementById('obCanvas2');
    if(ob1){ useCanvas(ob1); drawCreature({...doc.p1, stage:doc.p1.stage||3, frame:0, sick:false, sleeping:false}); }
    if(ob2){ useCanvas(ob2); drawCreature({...doc.p2, stage:doc.p2.stage||3, frame:0, sick:false, sleeping:false}); }
    useScreenCanvas();
    if(doc.resolvedRound>0 && lastOnlineShakeRound!==doc.resolvedRound){
      lastOnlineShakeRound = doc.resolvedRound;
      const dmg1 = Math.max(0, Math.round(lastOnlineHp.p1 - doc.p1.hp));
      const dmg2 = Math.max(0, Math.round(lastOnlineHp.p2 - doc.p2.hp));
      playBattleClash('obFighter1','obFighter2', dmg1, dmg2, doc.lastMove1, doc.lastMove2);
    }
    lastOnlineHp = {p1:doc.p1.hp, p2:doc.p2.hp};
    if(!doc.finished && !myMoveSet){
      c.querySelectorAll('[data-mv]').forEach(btn=>{
        btn.onclick = async ()=>{
          sfx('tap');
          try{
            const res = await CloudAdapter.get(battleKey(id), true);
            const fresh = JSON.parse(res.value);
            fresh[mySlot].move = btn.getAttribute('data-mv');
            await CloudAdapter.set(battleKey(id), JSON.stringify(fresh), true);
            renderOnlineBattleUI(fresh, mySlot, id);
          }catch(e){}
        };
      });
    }
    if(doc.finished){
      stopBattlePoll();
      if(lastAnnouncedBattleId!==id){
        lastAnnouncedBattleId = id;
        sfx(doc.winner===me.name ? 'win' : 'lose');
      }
      const backBtn = document.getElementById('backOnline');
      if(backBtn) backBtn.onclick = ()=>{ sfx('tap'); renderOnlineHome(); };
    }
  }
  let lastAnnouncedBattleId = null;
  let lastOnlineShakeRound = -1;
  let lastOnlineHp = {p1:100, p2:100};

  // ---------- mis minijuegos, todos originales, para subir el cariño jugando ----------
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

  // esta es la animación de choque que uso en las 3 arenas (local, online, mazmorra):
  // hago que los dos se lancen el uno contra el otro, pongo el destello en medio,
  // y encima les saco el número de daño flotando antes de refrescar las barras de vida
  function spawnDmgFloat(fighterEl, dmg){
    if(!fighterEl || !dmg) return;
    const box = fighterEl.querySelector('.battle-sprite-box') || fighterEl;
    const el = document.createElement('div');
    el.className = 'dmg-float';
    el.textContent = '-'+dmg;
    box.appendChild(el);
    setTimeout(()=>el.remove(), 850);
  }
  function moveAnimClass(move, dir){
    if(move==='Ataque') return dir==='right' ? 'lunge-right' : 'lunge-left';
    if(move==='Especial') return 'special-glow';
    if(move==='Defensa') return 'defend-brace';
    return dir==='right' ? 'lunge-right' : 'lunge-left';
  }
  async function playBattleClash(id1, id2, dmg1, dmg2, move1, move2){
    const f1 = document.getElementById(id1);
    const f2 = document.getElementById(id2);
    if(!f1 || !f2) return;
    const cls1 = moveAnimClass(move1||'Ataque', 'right');
    const cls2 = moveAnimClass(move2||'Ataque', 'left');
    f1.classList.add(cls1);
    f2.classList.add(cls2);
    await sleep(260);
    const arena = f1.closest('.vs');
    if(arena){
      arena.classList.add('arena-shake');
      const flash = document.createElement('div');
      flash.className = 'arena-flash';
      arena.appendChild(flash);
      setTimeout(()=>flash.remove(), 300);
    }
    [f1, f2].forEach((f)=>{
      const box = f.querySelector('.battle-sprite-box');
      if(box){
        const impact = document.createElement('div');
        impact.className = 'clash-impact';
        box.appendChild(impact);
        setTimeout(()=>impact.remove(), 420);
      }
    });
    spawnDmgFloat(f1, dmg1);
    spawnDmgFloat(f2, dmg2);
    await sleep(280);
    f1.classList.remove(cls1);
    f2.classList.remove(cls2);
    if(arena) arena.classList.remove('arena-shake');
    await sleep(140);
  }
  let minigameTimers = [];
  function stopMinigameTimers(){ minigameTimers.forEach(t=>clearInterval(t)); minigameTimers=[]; }

  function canPlayGames(){
    if(pet.stage===0 || !pet.alive){ showToast('Tu mascota necesita nacer primero 🥚'); return false; }
    if(pet.sleeping){ showToast(pet.name+' está durmiendo, despiértalo primero'); return false; }
    if(pet.energy<10){ showToast(pet.name+' está muy cansado para jugar'); return false; }
    return true;
  }

  function finishMinigame(gain, energyCost, toastMsg){
    pet.happy = clamp(pet.happy+gain);
    pet.energy = clamp(pet.energy-energyCost);
    gainXp(Math.max(2, Math.round(gain/2)));
    sfx('play');
    showToast(toastMsg);
    render(); savePet();
  }

  function showGameResult(title, scoreText, gain){
    const c = document.getElementById('gamesContent');
    c.innerHTML = `
      <p style="text-align:center;font-weight:800;">${title}</p>
      <p class="small-note" style="text-align:center;">${scoreText} — +${gain} de ánimo 💗</p>
      <div class="modal-actions"><button class="status-btn" id="backToGames">Volver a minijuegos</button></div>
    `;
    document.getElementById('backToGames').onclick=()=>{ sfx('tap'); renderGamesMenu(); };
  }

  function openGamesModal(){
    if(!canPlayGames()) return;
    const el = document.createElement('div');
    el.className='modal-backdrop'; el.id='gamesModal';
    el.innerHTML = `<div class="modal">
      <button class="close-x" id="closeGames">✕</button>
      <h3>MINIJUEGOS</h3>
      <div id="gamesContent"></div>
    </div>`;
    document.getElementById('modalRoot').appendChild(el);
    refreshScrollLock();
    document.getElementById('closeGames').onclick=()=>{ stopMinigameTimers(); el.remove(); refreshScrollLock(); };
    el.addEventListener('click',(e)=>{ if(e.target===el){ stopMinigameTimers(); el.remove(); refreshScrollLock(); } });
    renderGamesMenu();
  }

  function renderGamesMenu(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    c.innerHTML = `
      <p class="small-note">Jugar sube el ánimo de ${pet.name}, pero gasta algo de energía.</p>
      <div class="modal-actions" style="flex-direction:column;gap:10px;">
        <button class="status-btn" id="gameCatch">🍓 Atrapa la fruta</button>
        <button class="status-btn" id="gameMemory">🧠 Memoria</button>
        <button class="status-btn" id="gameSimon">🎵 Simón dice</button>
      </div>
    `;
    document.getElementById('gameCatch').onclick = ()=>{ sfx('tap'); if(canPlayGames()) startCatchGame(); };
    document.getElementById('gameMemory').onclick = ()=>{ sfx('tap'); if(canPlayGames()) startMemoryGame(); };
    document.getElementById('gameSimon').onclick = ()=>{ sfx('tap'); if(canPlayGames()) startSimonGame(); };
  }

  function startCatchGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Toca la izquierda o la derecha para mover la cesta. ¡20 segundos!</p>
      <div class="game-hud"><span>Puntos: <b id="catchScore">0</b></span><span>Tiempo: <b id="catchTime">20</b>s</span></div>
      <div class="game-area" id="catchArea">
        <div class="game-zone" style="left:0;" id="zoneLeft"></div>
        <div class="game-zone" style="right:0;" id="zoneRight"></div>
        <div class="game-basket" id="basket" style="left:50%;"></div>
      </div>
    `;
    let score=0, timeLeft=20, basketPos=50;
    const area = document.getElementById('catchArea');
    const basket = document.getElementById('basket');
    const items = [];
    const FRUITS=['🍓','🍎','🍇','🍊','🍋'];

    document.getElementById('zoneLeft').onclick=()=>{ basketPos=Math.max(8,basketPos-14); basket.style.left=basketPos+'%'; };
    document.getElementById('zoneRight').onclick=()=>{ basketPos=Math.min(92,basketPos+14); basket.style.left=basketPos+'%'; };

    const spawnT = setInterval(()=>{
      const itEl = document.createElement('div');
      itEl.className='game-item';
      itEl.textContent = FRUITS[Math.floor(Math.random()*FRUITS.length)];
      const leftPct = 8+Math.random()*84;
      itEl.style.left = leftPct+'%';
      itEl.style.top = '0%';
      area.appendChild(itEl);
      items.push({el:itEl, left:leftPct, top:0});
    }, 850);

    const moveT = setInterval(()=>{
      for(let i=items.length-1;i>=0;i--){
        const it = items[i];
        it.top += 4;
        it.el.style.top = it.top+'%';
        if(it.top>=88){
          if(Math.abs(it.left-basketPos)<12){ score++; document.getElementById('catchScore').textContent=score; sfx('tap'); }
          it.el.remove(); items.splice(i,1);
        }
      }
    }, 60);

    const timerT = setInterval(()=>{
      timeLeft--;
      document.getElementById('catchTime').textContent = timeLeft;
      if(timeLeft<=0){
        clearInterval(spawnT); clearInterval(moveT); clearInterval(timerT);
        items.forEach(it=>it.el.remove());
        const gain = Math.min(28, score*3);
        finishMinigame(gain, 8, '¡'+pet.name+' atrapó '+score+' frutas! +'+gain+' de ánimo');
        showGameResult('🍓 Atrapa la fruta', score+' frutas atrapadas', gain);
      }
    }, 1000);

    minigameTimers.push(spawnT, moveT, timerT);
  }

  function startMemoryGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    const ICONS = ['🍓','🐸','🎈','⭐','🍩','🚀'];
    let deck = [...ICONS, ...ICONS];
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
    let flipped=[], matched=new Set(), moves=0, lock=false;

    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Encuentra las 6 parejas con el menor número de intentos.</p>
      <div class="game-hud"><span>Intentos: <b id="memMoves">0</b></span><span>Parejas: <b id="memPairs">0</b>/6</span></div>
      <div class="memgrid" id="memGrid"></div>
    `;
    const grid = document.getElementById('memGrid');
    deck.forEach((icon,idx)=>{
      const b = document.createElement('button');
      b.className='memcard'; b.dataset.idx=idx; b.dataset.icon=icon;
      b.textContent='❔';
      b.onclick=()=>{
        if(lock || b.classList.contains('matched') || flipped.includes(b)) return;
        sfx('tap');
        b.textContent = icon;
        flipped.push(b);
        if(flipped.length===2){
          moves++; document.getElementById('memMoves').textContent=moves;
          lock=true;
          const [a,bb]=flipped;
          if(a.dataset.icon===bb.dataset.icon){
            a.classList.add('matched'); bb.classList.add('matched');
            matched.add(a.dataset.idx); matched.add(bb.dataset.idx);
            document.getElementById('memPairs').textContent=matched.size/2;
            flipped=[]; lock=false;
            if(matched.size===deck.length){
              const gain = Math.max(10, 30-moves);
              finishMinigame(gain, 6, '¡'+pet.name+' completó la memoria en '+moves+' intentos! +'+gain+' de ánimo');
              setTimeout(()=>showGameResult('🧠 Memoria', moves+' intentos', gain), 300);
            }
          } else {
            setTimeout(()=>{ a.textContent='❔'; bb.textContent='❔'; flipped=[]; lock=false; }, 700);
          }
        }
      };
      grid.appendChild(b);
    });
  }

  function startSimonGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    const COLOR_IDS = ['red','green','blue','yellow'];
    let sequence=[], level=0, playerIdx=0, accepting=false;

    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Memoriza y repite la secuencia de colores.</p>
      <div class="game-hud"><span>Ronda: <b id="simonLevel">0</b></span></div>
      <div class="simon-grid">
        <button class="simon-btn simon-red" data-c="red"></button>
        <button class="simon-btn simon-green" data-c="green"></button>
        <button class="simon-btn simon-blue" data-c="blue"></button>
        <button class="simon-btn simon-yellow" data-c="yellow"></button>
      </div>
    `;
    const btns = {};
    c.querySelectorAll('.simon-btn').forEach(b=>{ btns[b.dataset.c]=b; b.onclick=()=>handlePress(b.dataset.c); });

    async function nextRound(){
      accepting=false;
      level++; document.getElementById('simonLevel').textContent=level;
      sequence.push(COLOR_IDS[Math.floor(Math.random()*4)]);
      await sleep(500);
      for(const col of sequence){
        btns[col].classList.add('lit'); sfx('tap'); await sleep(420);
        btns[col].classList.remove('lit'); await sleep(220);
      }
      playerIdx=0; accepting=true;
    }
    function handlePress(col){
      if(!accepting) return;
      btns[col].classList.add('lit'); setTimeout(()=>btns[col].classList.remove('lit'),150);
      sfx('tap');
      if(sequence[playerIdx]===col){
        playerIdx++;
        if(playerIdx===sequence.length){ accepting=false; setTimeout(nextRound, 700); }
      } else {
        accepting=false;
        const gain = Math.min(26, (level-1)*4);
        finishMinigame(gain, 5, '¡'+pet.name+' llegó a la ronda '+(level-1)+' en Simón dice! +'+gain+' de ánimo');
        setTimeout(()=>showGameResult('🎵 Simón dice', 'Llegaste a la ronda '+(level-1), gain), 300);
      }
    }
    nextRound();
  }

  function openMoreMenu(){
    sfx('tap');
    const el = document.createElement('div');
    el.className='modal-backdrop'; el.id='moreModal';
    el.innerHTML = `<div class="modal">
      <button class="close-x" id="closeMore">✕</button>
      <h3>MÁS OPCIONES</h3>
      <div class="modal-actions" style="flex-direction:column;gap:10px;">
        <button class="status-btn" id="moreMed" ${(!pet.sick||!pet.alive)?'disabled':''}>💊 Medicina</button>
        <button class="status-btn" id="moreInfo">📋 Estado</button>
        <button class="status-btn" id="moreBattle">⚔️ Batalla</button>
        <button class="status-btn" id="moreGames">🎲 Minijuegos</button>
        <button class="status-btn" id="moreTree">🌳 Árbol evolutivo</button>
      </div>
      <div class="footnote">Cada usuario que abra este VPET tiene su propia mascota guardada — es personal e independiente.</div>
    </div>`;
    document.getElementById('modalRoot').appendChild(el);
    refreshScrollLock();
    const close = ()=>{ el.remove(); refreshScrollLock(); };
    document.getElementById('closeMore').onclick = close;
    el.addEventListener('click',(e)=>{ if(e.target===el) close(); });
    document.getElementById('moreMed').onclick = ()=>{ useMedicine(); close(); };
    document.getElementById('moreInfo').onclick = ()=>{ close(); openInfoModal(); };
    document.getElementById('moreBattle').onclick = ()=>{ close(); openBattleModal(); };
    document.getElementById('moreGames').onclick = ()=>{ close(); openGamesModal(); };
    document.getElementById('moreTree').onclick = ()=>{ close(); openTreeModal(); };
  }
  document.getElementById('btnMore').onclick = openMoreMenu;
  function openTreeModal(){
    const el = document.createElement('div');
    el.className='modal-backdrop'; el.id='treeModal';
    const trendTemp = pet.playCount > pet.feedCount ? 'Activo' : 'Tranquilo';
    const lockedTemp = pet.stage>=2 ? pet.temperament : null;
    const trendPath = computePath();
    const lockedPath = pet.stage>=3 ? pet.path : null;
    const trendAff = computeAffinity();
    const lockedAff = pet.stage>=3 ? pet.affinity : null;
    const avgHappy = pet.ticks ? Math.round(pet.sumHappy/pet.ticks) : pet.happy;

    const branchCard = (label, active, desc)=>`<div class="evo-branch${active?' current':''}"><b>${label}${active?' — actual':''}</b>${desc}</div>`;

    const sendaCard = (key, label, active, desc)=>`
      <div class="evo-branch${active?' current':''}">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="evo-preview-box"><canvas id="evoPreview_${key}" width="160" height="160"></canvas></div>
          <div><b>${label}${active?' — actual':''}</b>${desc}</div>
        </div>
      </div>`;

    el.innerHTML = `<div class="modal">
      <button class="close-x" id="closeTree">✕</button>
      <h3>ÁRBOL EVOLUTIVO</h3>
      <p class="small-note">Las formas finales se generan una a una y son prácticamente irrepetibles (nombre, color, silueta, ojos y patrón), pero la ruta para llegar hasta ahí sigue siempre esta estructura. Los sprites son un ejemplo con tu afinidad y temperamento actuales — el tuyo real puede salir distinto.</p>

      <div class="evo-stage"><div class="evo-stagetitle">🥚 Huevo</div><div class="evo-gate">Eclosiona solo, con el tiempo</div></div>
      <div class="evo-stage"><div class="evo-stagetitle">🐣 Cría</div><div class="evo-gate">Sube a Pequeño en el nivel ${LEVEL_CHILD}</div></div>
      <div class="evo-stage"><div class="evo-stagetitle">🌱 Pequeño</div>
        <div class="evo-gate">Sube a Joven en el nivel ${LEVEL_ADULT} — aquí se fija el <b>Temperamento</b>:</div>
        ${branchCard('Activo', trendTemp==='Activo'&&!lockedTemp, '<br>Si has jugado más veces de las que has alimentado.')}
        ${branchCard('Tranquilo', trendTemp==='Tranquilo'&&!lockedTemp, '<br>Si has alimentado más veces de las que has jugado.')}
        <div class="evo-trend">${lockedTemp ? 'Ya fijado: '+lockedTemp : 'Tendencia actual: '+trendTemp+' ('+pet.playCount+' jugadas · '+pet.feedCount+' comidas)'}</div>
      </div>
      <div class="evo-stage"><div class="evo-stagetitle">✨ Joven — aquí nace tu especie única</div>
        <div class="evo-gate"><b>Senda</b> (según cómo la cuidas) — así se vería un ejemplo de cada una con tu afinidad actual:</div>
        ${sendaCard('luz','Luz', trendPath==='luz'&&!lockedPath, '<br>Pocos fallos de cuidado y ánimo alto de media.')}
        ${sendaCard('sombra','Sombra', trendPath==='sombra'&&!lockedPath, '<br>Muchos fallos de cuidado, o ánimo bajo de media.')}
        ${sendaCard('equilibrio','Equilibrio', trendPath==='equilibrio'&&!lockedPath, '<br>Un término medio entre las dos anteriores.')}
        <div class="evo-trend">${lockedPath ? 'Ya fijada: '+PATH_LABEL[lockedPath] : 'Tendencia actual: '+PATH_LABEL[trendPath]+' ('+pet.mistakes+' fallos · '+avgHappy+'% ánimo medio)'}</div>
        <div class="evo-gate" style="margin-top:12px;"><b>Afinidad</b> (tu stat más alto ahora mismo):</div>
        ${STAT_KEYS.map(k=>branchCard(STAT_LABEL[k], trendAff===k&&!lockedAff, ' — '+pet.stats[k]+' puntos')).join('')}
        ${branchCard('Equilibrado', trendAff==='equilibrado'&&!lockedAff, '<br>Si dos o más stats están empatados en el más alto.')}
        <div class="evo-trend">${lockedAff ? 'Ya fijada: '+(STAT_LABEL[lockedAff]||'Equilibrado') : 'Tendencia actual: '+(STAT_LABEL[trendAff]||'Equilibrado')}</div>
        <p class="small-note">Con la Senda + la Afinidad se genera al azar: el nombre, el tono de color (de 360 posibles), la forma del cuerpo, el tipo de rasgo (alas/cuernos/orejas/aletas/antenas/púas), el estilo de ojos y el patrón — así que aunque otro jugador tenga tu misma Senda y Afinidad, su mascota no se verá igual que la tuya.</p>
      </div>
      <div class="evo-stage"><div class="evo-stagetitle">💠 Perfecto</div><div class="evo-gate">Misma especie, forma Mayor — nivel ${LEVEL_PERFECT}</div></div>
      <div class="evo-stage" style="border-left-color:transparent;"><div class="evo-stagetitle">🌟 Supremo</div><div class="evo-gate">Misma especie, forma Suprema — nivel ${LEVEL_ULTIMATE}</div></div>

      ${pet.stage>=3 ? `<h3 style="margin-top:18px;">TU FORMA ACTUAL</h3>
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px;">
          <div class="evo-preview-box" style="width:70px;height:70px;"><canvas id="evoPreviewCurrent" width="200" height="200"></canvas></div>
          <div style="font-weight:800;">${speciesDisplay(pet)}</div>
        </div>
        <div class="modal-row"><span>Senda</span><b>${PATH_LABEL[pet.path]}</b></div>
        <div class="modal-row"><span>Afinidad</span><b>${STAT_LABEL[pet.affinity]||'Equilibrado'}</b></div>
        <div class="modal-row"><span>Forma de cuerpo</span><b>${pet.bodyShape}</b></div>
        <div class="modal-row"><span>Rasgo</span><b>${pet.featureType}</b></div>
        <div class="modal-row"><span>Patrón</span><b>${pet.pattern}</b></div>
        <div class="modal-row"><span>Color</span><b>Tono ${pet.hue}° <span class="swatch" style="background:hsl(${pet.hue},68%,55%)"></span></b></div>` : ''}
    </div>`;
    document.getElementById('modalRoot').appendChild(el);
    refreshScrollLock();
    ['luz','sombra','equilibrio'].forEach(senda=>{
      const cv = document.getElementById('evoPreview_'+senda);
      if(!cv) return;
      const snap = previewSnapshot(senda, lockedAff||trendAff, lockedTemp||trendTemp);
      useCanvas(cv);
      drawCreature(snap);
    });
    if(pet.stage>=3){
      const cv = document.getElementById('evoPreviewCurrent');
      if(cv){ useCanvas(cv); drawCreature(snapshotVisual(pet)); }
    }
    useScreenCanvas();
    document.getElementById('closeTree').onclick=()=>{ el.remove(); refreshScrollLock(); };
    el.addEventListener('click',(e)=>{ if(e.target===el){ el.remove(); refreshScrollLock(); } });
  }


  document.getElementById('btnMute').onclick = ()=>{
    ensureAudio();
    soundOn = !soundOn;
    document.getElementById('btnMute').textContent = soundOn ? '🔊' : '🔇';
    if(soundOn) sfx('tap');
  };

  loadPet().then(()=>{
    setInterval(()=>tick(true), TICK_MS);
    setInterval(()=>{ if(pet.alive && pet.stage>0){ render(); } }, 550); // idle animation refresh
  });
})();
</script>
