  // ---------- fondo de las peleas en 2D, bien detallado ----------
  function draw2DBattleBackdrop(canvas, theme){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = window.innerWidth*dpr; canvas.height = window.innerHeight*dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    const w = window.innerWidth, h = window.innerHeight;
    const rand = mulberry32(theme==='mazmorra'?77:33);
    if(theme==='mazmorra'){
      const sky = ctx.createLinearGradient(0,0,0,h);
      sky.addColorStop(0,'#0b070c'); sky.addColorStop(.55,'#241019'); sky.addColorStop(.8,'#4a2418'); sky.addColorStop(1,'#7a3a22');
      ctx.fillStyle = sky; ctx.fillRect(0,0,w,h);
      // arco de piedra al fondo, como la entrada a una cámara mas profunda
      ctx.fillStyle = 'rgba(15,9,10,.85)';
      const archY = h*.42, archW = w*.62, archX = w*.5;
      ctx.beginPath();
      ctx.moveTo(archX-archW/2, h*.7);
      ctx.lineTo(archX-archW/2, archY+40);
      ctx.quadraticCurveTo(archX-archW/2, archY, archX, archY);
      ctx.quadraticCurveTo(archX+archW/2, archY, archX+archW/2, archY+40);
      ctx.lineTo(archX+archW/2, h*.7);
      ctx.fill();
      // estalactitas colgando arriba
      ctx.fillStyle = '#1c1113';
      for(let i=0;i<14;i++){
        const x = (i/13)*w + (rand()-.5)*30;
        const len = 18+rand()*46;
        ctx.beginPath();
        ctx.moveTo(x-14,0); ctx.lineTo(x+14,0); ctx.lineTo(x,len); ctx.closePath(); ctx.fill();
      }
      // paredes laterales con textura de bloques, en perspectiva hacia el centro
      [-1,1].forEach(side=>{
        ctx.fillStyle = 'rgba(28,16,17,.9)';
        ctx.beginPath();
        ctx.moveTo(side<0?0:w, h*.2);
        ctx.lineTo(side<0?0:w, h*.85);
        ctx.lineTo(archX+side*archW*.55, h*.72);
        ctx.lineTo(archX+side*archW*.5, archY+30);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth=1.5;
        for(let r=0;r<8;r++){
          const yy = h*.22 + r*(h*.6/8);
          ctx.beginPath(); ctx.moveTo(side<0?0:w, yy); ctx.lineTo(archX+side*archW*.52, yy*.55+archY*.4); ctx.stroke();
        }
      });
      // manchas de luz calida de las antorchas, para que combine con las luces 3D reales
      [-1,1].forEach(side=>{
        const gx = w/2+side*w*.24, gy = h*.55;
        const glow = ctx.createRadialGradient(gx,gy,4,gx,gy,120);
        glow.addColorStop(0,'rgba(255,170,90,.35)'); glow.addColorStop(1,'rgba(255,170,90,0)');
        ctx.fillStyle = glow; ctx.fillRect(gx-120,gy-120,240,240);
      });
    } else if(theme==='arena'){
      // arena de piedra con arco central enmarcando un atardecer entre montañas
      const sky = ctx.createLinearGradient(0,0,0,h*.62);
      sky.addColorStop(0,'#2a2550'); sky.addColorStop(.35,'#6a4a78'); sky.addColorStop(.62,'#c98a6a'); sky.addColorStop(1,'#ffcf9a');
      ctx.fillStyle = sky; ctx.fillRect(0,0,w,h*.62);
      // sol grande y difuso justo en el centro del arco
      const sun = ctx.createRadialGradient(w*.5,h*.42,10,w*.5,h*.42,w*.22);
      sun.addColorStop(0,'rgba(255,240,210,.95)'); sun.addColorStop(1,'rgba(255,240,210,0)');
      ctx.fillStyle = sun; ctx.fillRect(w*.5-w*.22,h*.42-w*.22,w*.44,w*.44);
      // montañas lejanas, dos capas
      ctx.fillStyle = 'rgba(90,70,110,.55)';
      ctx.beginPath(); ctx.moveTo(0,h*.6);
      for(let x=0;x<=w;x+=w/12){ ctx.lineTo(x, h*.58 - Math.abs(Math.sin(x*.015+1))*h*.1); }
      ctx.lineTo(w,h*.62); ctx.lineTo(0,h*.62); ctx.fill();
      ctx.fillStyle = 'rgba(60,45,75,.7)';
      ctx.beginPath(); ctx.moveTo(0,h*.62);
      for(let x=0;x<=w;x+=w/16){ ctx.lineTo(x, h*.6 - Math.abs(Math.sin(x*.022+3))*h*.075); }
      ctx.lineTo(w,h*.62); ctx.lineTo(0,h*.62); ctx.fill();
      // suelo de losas, en degradado calido, con las lineas de las baldosas convergiendo al centro
      const floor = ctx.createLinearGradient(0,h*.6,0,h);
      floor.addColorStop(0,'#5a2a2e'); floor.addColorStop(.4,'#8a3a34'); floor.addColorStop(1,'#2a1216');
      ctx.fillStyle = floor; ctx.fillRect(0,h*.6,w,h*.4);
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.4;
      const vanishX = w*.5, vanishY = h*.6;
      for(let i=-8;i<=8;i++){
        ctx.beginPath(); ctx.moveTo(vanishX, vanishY); ctx.lineTo(vanishX+i*w*.16, h); ctx.stroke();
      }
      for(let r=0;r<7;r++){
        const t = r/6, yy = vanishY + t*t*(h-vanishY);
        ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(w,yy); ctx.stroke();
      }
      // muros oscuros a los lados, cada uno con un arco pequeño mostrando el mismo cielo
      const wallMat = 'rgba(20,10,16,.92)';
      [-1,1].forEach(side=>{
        ctx.fillStyle = wallMat;
        ctx.fillRect(side<0?0:w*.78, 0, w*.22, h);
        ctx.save();
        ctx.beginPath();
        const ax = side<0? w*.11 : w*.89, ay=h*.34, arx=w*.09, ary=h*.26;
        ctx.ellipse(ax,ay,arx,ary,0,Math.PI,0);
        ctx.lineTo(ax+arx, h*.62); ctx.lineTo(ax-arx, h*.62); ctx.closePath();
        ctx.clip();
        ctx.fillStyle = sky; ctx.fillRect(side<0?0:w*.78,0,w*.22,h);
        ctx.fillStyle = 'rgba(60,45,75,.6)';
        ctx.beginPath(); ctx.moveTo(side<0?0:w*.78,h*.55);
        ctx.lineTo(side<0?w*.22:w, h*.5); ctx.lineTo(side<0?w*.22:w,h*.62); ctx.lineTo(side<0?0:w*.78,h*.62); ctx.fill();
        ctx.restore();
      });
      // columnas centrales flanqueando el arco grande, con capitel
      [-1,1].forEach(side=>{
        const px = w*.5 + side*w*.235;
        ctx.fillStyle = '#3a2a30';
        ctx.fillRect(px-w*.028, h*.08, w*.056, h*.56);
        ctx.fillStyle = '#4a3238';
        ctx.fillRect(px-w*.042, h*.08, w*.084, h*.045);
        ctx.fillRect(px-w*.042, h*.56, w*.084, h*.045);
      });
      // estandartes colgando arriba del arco central
      [-1,-.33,.33,1].forEach(px=>{
        ctx.fillStyle = 'rgba(120,30,30,.8)';
        ctx.fillRect(w*.5+px*w*.16-6, 0, 12, h*.1+Math.abs(px)*h*.03);
      });
      // nubes finas cruzando el cielo, en varias capas de opacidad
      const rand2 = mulberry32(51);
      for(let i=0;i<6;i++){
        const cx = rand2()*w, cy = h*.12+rand2()*h*.28, cw = 60+rand2()*90;
        ctx.fillStyle = 'rgba(255,235,220,'+(.12+rand2()*.15).toFixed(2)+')';
        ctx.beginPath();
        for(let k=0;k<4;k++){ ctx.ellipse(cx+k*cw*.28, cy+Math.sin(k)*4, cw*.26, cw*.11, 0, 0, Math.PI*2); }
        ctx.fill();
      }
      // pajaros lejanos, un simple trazo en "M" repetido
      ctx.strokeStyle = 'rgba(30,20,30,.55)'; ctx.lineWidth = 1.6;
      for(let i=0;i<5;i++){
        const bx = w*.15+rand2()*w*.7, by = h*.16+rand2()*h*.18, bs = 4+rand2()*3;
        ctx.beginPath();
        ctx.moveTo(bx-bs,by); ctx.quadraticCurveTo(bx-bs*.4,by-bs*.8,bx,by);
        ctx.quadraticCurveTo(bx+bs*.4,by-bs*.8,bx+bs,by);
        ctx.stroke();
      }
      // braseros de fuego a los pies de cada columna central, para que combinen con las luces 3D reales
      [-1,1].forEach(side=>{
        const px = w*.5 + side*w*.235, py = h*.63;
        ctx.fillStyle = '#2a1c1c'; ctx.fillRect(px-10,py-6,20,10);
        const flameGlow = ctx.createRadialGradient(px,py-10,2,px,py-10,46);
        flameGlow.addColorStop(0,'rgba(255,180,80,.85)'); flameGlow.addColorStop(1,'rgba(255,140,50,0)');
        ctx.fillStyle = flameGlow; ctx.fillRect(px-46,py-56,92,92);
        ctx.fillStyle = '#ffcf6e';
        ctx.beginPath(); ctx.moveTo(px,py-24); ctx.quadraticCurveTo(px-7,py-12,px,py-6); ctx.quadraticCurveTo(px+7,py-12,px,py-24); ctx.fill();
      });
      // grietas y desgaste en las losas del suelo, para que no se vea tan limpio
      ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1;
      for(let i=0;i<10;i++){
        const sx = rand2()*w, sy = h*.68+rand2()*h*.28;
        ctx.beginPath(); ctx.moveTo(sx,sy);
        let cx2=sx, cy2=sy;
        for(let k=0;k<3;k++){ cx2 += (rand2()-.5)*30; cy2 += rand2()*14; ctx.lineTo(cx2,cy2); }
        ctx.stroke();
      }
      // penumbra en las esquinas para dar profundidad
      const vign = ctx.createRadialGradient(w*.5,h*.45,h*.2,w*.5,h*.45,h*.85);
      vign.addColorStop(0,'rgba(0,0,0,0)'); vign.addColorStop(1,'rgba(0,0,0,.5)');
      ctx.fillStyle = vign; ctx.fillRect(0,0,w,h);
    } else {
      // bosque: cielo de atardecer, montañas lejanas, varias filas de árboles con profundidad
      const sky = ctx.createLinearGradient(0,0,0,h);
      sky.addColorStop(0,'#160d24'); sky.addColorStop(.4,'#3a2050'); sky.addColorStop(.72,'#7a4a5a'); sky.addColorStop(1,'#c98a5a');
      ctx.fillStyle = sky; ctx.fillRect(0,0,w,h);
      // luna
      ctx.fillStyle = 'rgba(255,250,230,.9)';
      ctx.beginPath(); ctx.arc(w*.78, h*.18, 34, 0, Math.PI*2); ctx.fill();
      // estrellitas
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      for(let i=0;i<40;i++){ const x=rand()*w, y=rand()*h*.45; ctx.fillRect(x,y,1.6,1.6); }
      // montañas lejanas
      ctx.fillStyle = 'rgba(35,22,40,.75)';
      ctx.beginPath(); ctx.moveTo(0,h*.62);
      for(let x=0;x<=w;x+=w/10){ ctx.lineTo(x, h*.62 - Math.abs(Math.sin(x*.01+2))*h*.14); }
      ctx.lineTo(w,h*.7); ctx.lineTo(0,h*.7); ctx.fill();
      // tres filas de árboles, cada vez más cerca, oscuros y grandes
      const rows = [ {y:h*.66, s:.55, c:'#1c2a1e', n:16}, {y:h*.74, s:.8, c:'#152018', n:11}, {y:h*.85, s:1.15, c:'#0e1710', n:7} ];
      rows.forEach(row=>{
        for(let i=0;i<row.n;i++){
          const x = (i/(row.n-1))*w*1.15 - w*.07 + (rand()-.5)*30;
          const th = 70*row.s, tw=44*row.s;
          ctx.fillStyle = row.c;
          ctx.fillRect(x-4*row.s, row.y-th*.3, 8*row.s, th*.3);
          ctx.beginPath();
          ctx.moveTo(x, row.y-th); ctx.lineTo(x-tw/2, row.y-th*.35); ctx.lineTo(x+tw/2, row.y-th*.35); ctx.closePath(); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(x, row.y-th*.72); ctx.lineTo(x-tw*.4, row.y-th*.1); ctx.lineTo(x+tw*.4, row.y-th*.1); ctx.closePath(); ctx.fill();
        }
      });
      // niebla suave pegada al suelo
      const mist = ctx.createLinearGradient(0,h*.8,0,h);
      mist.addColorStop(0,'rgba(200,200,220,0)'); mist.addColorStop(1,'rgba(200,200,220,.18)');
      ctx.fillStyle = mist; ctx.fillRect(0,h*.8,w,h*.2);
    }
  }

  function initDungeonScene(theme){
    theme = theme || 'arena';
    const bgCanvas = document.getElementById('dg2dBg');
    if(bgCanvas) draw2DBattleBackdrop(bgCanvas, theme);
    const canvasEl = document.getElementById('dgCanvas');
    if(!canvasEl) return;
    const ctx2 = canvasEl.getContext('2d');
    ctx2.imageSmoothingEnabled = false;
    function resize(){
      const dpr = Math.min(window.devicePixelRatio||1, 2);
      canvasEl.width = Math.round(window.innerWidth*dpr);
      canvasEl.height = Math.round(window.innerHeight*dpr);
      ctx2.setTransform(dpr,0,0,dpr,0,0);
      const bg = document.getElementById('dg2dBg');
      if(bg) draw2DBattleBackdrop(bg, theme);
    }
    dungeonScene3D = { ctx2, canvasEl, meTraits:null, monTraits:null, bobT:0, raf:null, attack:null, particles:[], shields:[], charges:[], shake:null, onResize:resize };
    resize();
    window.addEventListener('resize', resize);
    function loop(){
      if(!dungeonScene3D) return;
      dungeonScene3D.bobT += .06;
      applyDungeonAttack();
      drawBattleFighters2D();
      dungeonScene3D.raf = requestAnimationFrame(loop);
    }
    loop();
  }
  function drawBattleFighters2D(){
    const s = dungeonScene3D;
    if(!s) return;
    const w = window.innerWidth, h = window.innerHeight;
    s.ctx2.clearRect(0,0,w,h);
    const groundY = h*.62;
    const scaleFactor = Math.min(w,h)/380; // referencia pensada para un móvil normal, escalo proporcional al resto
    const shakeOff = applyScreenShake();
    // los efectos avanzan antes de dibujar, para que salgan en la misma posición que los luchadores de este fotograma
    advanceHitParticles3D(); advanceShields3D(); advanceCharges3D();
    [['me',-1],['mon',1]].forEach(([side,dir])=>{
      const traits = side==='me' ? s.meTraits : s.monTraits;
      if(!traits) return;
      const bob = Math.sin(s.bobT + (side==='me'?0:1))*4;
      let lungeOff = 0, tiltOff = 0, chargeGlow = 0;
      if(s.attack && s.attack.side===side){
        const el = performance.now()-s.attack.start, t=Math.min(1,el/550);
        const lunge = Math.sin(t*Math.PI);
        lungeOff = -dir*lunge*46;
        if(s.attack.moveType==='Especial') chargeGlow = 1-t;
      }
      if(s.attack && s.attack.side!==side && s.defShakeUntil>performance.now()){
        tiltOff = Math.sin(performance.now()*.09)*4;
      }
      const baseX = w*.5 + dir*w*.22;
      const px2 = baseX + lungeOff + shakeOff.x + tiltOff;
      const py2 = groundY + bob + shakeOff.y;
      s.ctx2.save();
      s.ctx2.translate(px2, py2);
      s.ctx2.scale(dir<0?scaleFactor:-scaleFactor, scaleFactor); // el de la derecha mira hacia la izquierda, como cara a cara
      if(chargeGlow>0){
        s.ctx2.fillStyle = `rgba(255,207,94,${.35*chargeGlow})`;
        s.ctx2.beginPath(); s.ctx2.arc(0,-40,50+10*Math.sin(performance.now()*.02),0,Math.PI*2); s.ctx2.fill();
      }
      useCanvas(dummyCanvas2D);
      drawCreature({...traits, frame:pet.frame||0, sleeping:false, sick:false}, true, 12, 13.5);
      const spriteSize = 190*scaleFactor; // tamaño real en pantalla del sprite — antes esto salía en apenas 24px sin querer
      s.ctx2.drawImage(dummyCanvas2D, -spriteSize/2, -spriteSize*0.62, spriteSize, spriteSize);
      useScreenCanvas();
      s.ctx2.restore();
    });
    // partículas, escudos y destellos de carga, ya en coordenadas de pantalla
    s.particles.forEach(p=>{
      s.ctx2.fillStyle = p.color; s.ctx2.globalAlpha = Math.max(0,1-p.life/p.maxLife);
      s.ctx2.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    });
    s.ctx2.globalAlpha = 1;
    s.shields.forEach(sh=>{
      s.ctx2.strokeStyle = `rgba(111,216,255,${Math.max(0,.9-sh.life*.07)})`;
      s.ctx2.lineWidth = 3;
      s.ctx2.beginPath(); s.ctx2.arc(sh.x,sh.y,14+sh.life*3,0,Math.PI*2); s.ctx2.stroke();
    });
  }
  function setDungeonFighters(meTraits, monTraits){
    if(!dungeonScene3D) return;
    dungeonScene3D.meTraits = meTraits || {stage:0};
    dungeonScene3D.monTraits = monTraits;
  }
  function playDungeonAttack(side, moveType, damage, blocked){
    // ataca de verdad: se lanza hacia el rival, y en el instante del choque disparo números de daño,
    // partículas, temblor de cámara y destello — con su propio look según sea Ataque, Especial o un bloqueo
    if(!dungeonScene3D) return;
    dungeonScene3D.attack = { side, start:performance.now(), moveType, damage:Math.max(0,Math.round(damage||0)), blocked:!!blocked, impactDone:false };
  }
  function applyDungeonAttack(){
    if(!dungeonScene3D || !dungeonScene3D.attack) return;
    const atk = dungeonScene3D.attack;
    const el = performance.now() - atk.start;
    const dur = 550;
    if(el > dur){ dungeonScene3D.attack = null; return; }
    const t = el/dur;
    if(!atk.impactDone && t>=.48){
      atk.impactDone = true;
      const w = window.innerWidth, h = window.innerHeight;
      const defSide = atk.side==='me' ? 1 : -1;
      const impactX = w*.5 + defSide*w*.14, impactY = h*.62-40;
      dungeonScene3D.defShakeUntil = performance.now()+330;
      if(atk.blocked){
        spawnShieldBlock3D(impactX, impactY);
        sfx('hit');
        triggerScreenShake(3);
      } else {
        const isEspecial = atk.moveType==='Especial';
        spawnHitParticles3D(impactX, impactY, isEspecial?'#ffcf5e':'#ff5c5c', isEspecial?16:10);
        triggerImpactFlash(isEspecial ? 'rgba(255,207,94,.35)' : 'rgba(255,60,60,.3)');
        triggerScreenShake(isEspecial?9:5);
        spawnDamageNumber3D(impactX, impactY, atk.damage, isEspecial?'crit':'normal');
      }
    }
  }
  // ---------- efectos de combate: números de daño, partículas, temblor de cámara, destellos ----------
  function spawnDamageNumber3D(x, y, amount, kind){
    if(amount<=0) return;
    const el = document.createElement('div');
    el.className = 'dmg-number' + (kind==='crit' ? ' dmg-crit' : '') + (kind==='heal' ? ' dmg-heal' : '');
    el.textContent = (kind==='heal' ? '+' : '-') + amount;
    el.style.left = x+'px'; el.style.top = y+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 900);
  }
  function spawnHitParticles3D(x, y, color, count){
    if(!dungeonScene3D) return;
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2, spd = 1.5+Math.random()*3;
      dungeonScene3D.particles.push({ x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-1.5, color, size:3+Math.random()*3, life:0, maxLife:20+Math.random()*10 });
    }
  }
  function advanceHitParticles3D(){
    if(!dungeonScene3D) return;
    dungeonScene3D.particles = dungeonScene3D.particles.filter(p=>{
      p.life++; p.vy += .2; p.x += p.vx; p.y += p.vy;
      return p.life < p.maxLife;
    });
  }
  function triggerScreenShake(intensity){
    if(!dungeonScene3D) return;
    dungeonScene3D.shake = { intensity, start:performance.now(), dur:280 };
  }
  function applyScreenShake(){
    if(!dungeonScene3D || !dungeonScene3D.shake) return {x:0,y:0};
    const { intensity, start, dur } = dungeonScene3D.shake;
    const el = performance.now()-start;
    if(el>dur){ dungeonScene3D.shake=null; return {x:0,y:0}; }
    const decay = 1-(el/dur);
    return { x:(Math.random()-.5)*intensity*decay, y:(Math.random()-.5)*intensity*decay };
  }

  function render3DMiniPreview(canvasEl, traitsOrNull){
    if(!canvasEl) return;
    const w = canvasEl.clientWidth||84, h = canvasEl.clientHeight||84;
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    canvasEl.width = w*dpr; canvasEl.height = h*dpr;
    const ctx2 = canvasEl.getContext('2d');
    ctx2.imageSmoothingEnabled = false;
    ctx2.setTransform(dpr,0,0,dpr,0,0);
    const seedForTheme = (traitsOrNull && traitsOrNull.bgSeed!=null) ? traitsOrNull.bgSeed : ((traitsOrNull && traitsOrNull.hue!=null) ? traitsOrNull.hue : 210);
    const miniTheme = pickEnvTheme(seedForTheme);
    const miniColors = ENV_COLORS[miniTheme];
    const inst = { raf:null };
    let bobT = Math.random()*10;
    function loop(){
      bobT += 0.06;
      ctx2.clearRect(0,0,w,h);
      ctx2.fillStyle = `hsl(${miniColors.sky[0]}, ${Math.round(miniColors.sky[1]*100)}%, ${Math.round(miniColors.sky[2]*100)}%)`;
      ctx2.fillRect(0,0,w,h);
      useCanvas(dummyCanvas2D);
      if(!traitsOrNull) drawEgg(Math.floor(bobT*10), seedForTheme);
      else drawCreature({...traitsOrNull, frame:Math.floor(bobT*10), sleeping:false, sick:false}, true, 12, 13.5);
      useScreenCanvas();
      const bob = Math.sin(bobT)*3;
      const spriteSize = Math.min(w,h)*0.95;
      ctx2.drawImage(dummyCanvas2D, w/2-spriteSize/2, h/2-spriteSize/2+bob, spriteSize, spriteSize);
      inst.raf = requestAnimationFrame(loop);
    }
    loop();
    miniPreviewInstances.push(inst);
  }

  const LEADERBOARD_KEY = 'bytemon:leaderboard';
  async function recordWin(winnerName, winnerSpecies){

      if(res && res.value) board = JSON.parse(res.value);

    board.sort((a,b)=>b.wins-a.wins);
    board = board.slice(0,10);

  function waitForOpponent(id, mineSnapshot){
    const c = document.getElementById('battleContent');
    c.innerHTML = `<p style="text-align:center;">Esperando que alguien acepte tu reto...</p>

  async function loadOpenChallenges(){
    const list = await getOpenList();
    const now = Date.now();
    const fresh = list.filter(c=>now-c.ts<10*60*1000);
    const box = document.getElementById('challengeList');
    if(!box) return;
    if(fresh.length===0){ box.innerHTML = '<p class="small-note">No hay retos abiertos ahora mismo. ¡Crea uno!</p>'; return; }
    box.innerHTML = fresh.map(ch => `<div class="challenge-item"><span>${ch.name} <small style="color:var(--muted)">(${ch.species})</small></span><button data-accept="${ch.id}">Aceptar</button></div>`).join('');
    box.querySelectorAll('[data-accept]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.getAttribute('data-accept');
        let openList = await getOpenList();
        const challenge = openList.find(x=>x.id===id);
        if(!challenge){ showToast('Ese reto ya no está disponible'); loadOpenChallenges(); return; }
        openList = openList.filter(x=>x.id!==id);
        await setOpenList(openList);
        const doc = {
          id, round:1, resolvedRound:0, finished:false, winner:null, log:[],
          p1:{ ...challenge, hp:100, move:null },
          p2:{ ...mySnapshot(), hp:100, move:null }
        };
        await CloudAdapter.set(battleKey(id), JSON.stringify(doc), true);
        enterOnlineBattle(id, 'p2');
      };
    });
  }

  function enterOnlineBattle(id, mySlot){
    lastOnlineShakeRound = -1;
    lastOnlineHp = {p1:100, p2:100};
    async function poll(){
      let doc;
      try{
        const res = await CloudAdapter.get(battleKey(id), true);
        if(!res || !res.value) return;
        doc = JSON.parse(res.value);
      }catch(e){ return; }

      if(!doc.finished && doc.p1.move && doc.p2.move && doc.resolvedRound < doc.round){
        const r = resolveMoves(doc.p1.move, doc.p2.move, doc.p1.power, doc.p2.power, doc.p1.path, doc.p2.path);
        doc.p1.hp = Math.min(100, Math.max(0, doc.p1.hp - r.dmgToA + r.healA));
        doc.p2.hp = Math.min(100, Math.max(0, doc.p2.hp - r.dmgToB + r.healB));
        doc.log.push(doc.p1.name+' usó '+doc.p1.move+' · '+doc.p2.name+' usó '+doc.p2.move+' — '+r.text);
        doc.lastMove1 = doc.p1.move; doc.lastMove2 = doc.p2.move;
        doc.p1.move=null; doc.p2.move=null;
        doc.resolvedRound = doc.round;
        doc.round += 1;
        sfx('hit');
        if(doc.p1.hp<=0 || doc.p2.hp<=0){
          doc.finished=true;
          doc.winner = doc.p1.hp<=0? doc.p2.name : doc.p1.name;
          const winnerSpecies = doc.p1.hp<=0 ? doc.p2.species : doc.p1.species;
          recordWin(doc.winner, winnerSpecies);
          const iWon = (mySlot==='p1' && doc.p2.hp<=0) || (mySlot==='p2' && doc.p1.hp<=0);
          if(iWon){ gainXp(8); savePet(); }
        }
        try{ await CloudAdapter.set(battleKey(id), JSON.stringify(doc), true); }catch(e){}
      }
      renderOnlineBattleUI(doc, mySlot, id);
    }
    poll();
    battleTimer = setInterval(poll, 2000);
  }

      : `<div class="dg-bottom">
          <div class="dg-log">${myMoveSet ? 'Esperando el movimiento de '+opp.name+'...' : 'Elige tu movimiento:'}</div>
          ${myMoveSet ? '' : `<div class="dg-movegrid">

            <button class="action-btn" data-mv="Especial">✨<br>Especial</button>
            <button class="action-btn" data-mv="Defensa">🛡️<br>Defensa</button>
          </div>`}
        </div>`}
    `;
    document.getElementById('dgBack').onclick = ()=>{ stopBattlePoll(); stopDungeonScene(); currentSetTab && currentSetTab('online'); };
    stopDungeonScene();
    initDungeonScene('arena');
    setDungeonFighters({...doc.p1, stage:doc.p1.stage||3, sick:false, sleeping:false}, {...doc.p2, stage:doc.p2.stage||3, sick:false, sleeping:false});
    if(doc.resolvedRound>0 && lastOnlineShakeRound!==doc.resolvedRound){
      lastOnlineShakeRound = doc.resolvedRound;
      const dmgToP1 = Math.max(0, Math.round(lastOnlineHp.p1 - doc.p1.hp));
      const dmgToP2 = Math.max(0, Math.round(lastOnlineHp.p2 - doc.p2.hp));
      playDungeonAttack('me', doc.lastMove1, dmgToP2, doc.lastMove2==='Defensa' && doc.lastMove1!=='Defensa');
      setTimeout(()=>playDungeonAttack('mon', doc.lastMove2, dmgToP1, doc.lastMove1==='Defensa' && doc.lastMove2!=='Defensa'), 280);
    }
    lastOnlineHp = {p1:doc.p1.hp, p2:doc.p2.hp};
    if(!doc.finished && !myMoveSet){
      c.querySelectorAll('[data-mv]').forEach(btn=>{
        btn.onclick = async ()=>{
          sfx('tap');
          try{
            const res = await CloudAdapter.get(battleKey(id), true);
            const fresh = JSON.parse(res.value);
            fresh[mySlot].move = btn.getAttribute('data-mv');
            await CloudAdapter.set(battleKey(id), JSON.stringify(fresh), true);
            renderOnlineBattleUI(fresh, mySlot, id);
          }catch(e){}
        };

    }
    if(doc.finished){
      stopBattlePoll();
      if(lastAnnouncedBattleId!==id){
        lastAnnouncedBattleId = id;
        sfx(doc.winner===me.name ? 'win' : 'lose');

      const backBtn = document.getElementById('backOnline');
      if(backBtn) backBtn.onclick = ()=>{ sfx('tap'); stopDungeonScene(); setArenaFullscreen(false); renderOnlineHome(); };
      const rematchBtn = document.getElementById('rematchOnline');
      if(rematchBtn) rematchBtn.onclick = ()=>{ sfx('tap'); createChallenge(); };
    }

  let lastAnnouncedBattleId = null;
  let lastOnlineShakeRound = -1;

  // ---------- minijuegos originales para subir el cariño jugando ----------
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

  // animación de choque compartida por las 3 arenas (local, online, mazmorra):
  // los dos luchadores se lanzan el uno contra el otro, aparece un destello en medio,
  // y sale el número de daño flotando antes de refrescar las barras de vida
  function spawnDmgFloat(fighterEl, dmg){
    if(!fighterEl || !dmg) return;
    const box = fighterEl.querySelector('.battle-sprite-box') || fighterEl;
    const el = document.createElement('div');

  function moveAnimClass(move, dir){
    if(move==='Ataque') return dir==='right' ? 'lunge-right' : 'lunge-left';
    if(move==='Especial') return 'special-glow';
    if(move==='Defensa') return 'defend-brace';
    return dir==='right' ? 'lunge-right' : 'lunge-left';
  }
  async function playBattleClash(id1, id2, dmg1, dmg2, move1, move2){
    const f1 = document.getElementById(id1);
    const f2 = document.getElementById(id2);
    if(!f1 || !f2) return;
    const cls1 = moveAnimClass(move1||'Ataque', 'right');
    const cls2 = moveAnimClass(move2||'Ataque', 'left');
    f1.classList.add(cls1);
    f2.classList.add(cls2);
    await sleep(260);
    const arena = f1.closest('.vs');
    if(arena){
      arena.classList.add('arena-shake');
      const flash = document.createElement('div');
      flash.className = 'arena-flash';
      arena.appendChild(flash);
      setTimeout(()=>flash.remove(), 300);
    }
    [f1, f2].forEach((f)=>{
      const box = f.querySelector('.battle-sprite-box');
      if(box){
        const impact = document.createElement('div');
        impact.className = 'clash-impact';
        box.appendChild(impact);
        setTimeout(()=>impact.remove(), 420);
      }
    });
    spawnDmgFloat(f1, dmg1);
    spawnDmgFloat(f2, dmg2);
    await sleep(280);
    f1.classList.remove(cls1);
    f2.classList.remove(cls2);
    if(arena) arena.classList.remove('arena-shake');
    await sleep(140);
  }

  // ---------- Atrapa la fruta en pixel art: la mascota se mueve por el suelo, no es un emoji plano ----------
  let dodgeScene3D = null;
  let catchScene3D = null;
  function stopCatchScene3D(){
    if(catchScene3D){
      if(catchScene3D.raf) cancelAnimationFrame(catchScene3D.raf);
      catchScene3D = null;
    }
  }
  function initCatchScene3D(canvasEl){
    if(!canvasEl) return false;
    const w = canvasEl.clientWidth||300, h = canvasEl.clientHeight||300;
    const dpr = Math.min(window.devicePixelRatio||1,2);
    canvasEl.width = w*dpr; canvasEl.height = h*dpr;
    const ctx2 = canvasEl.getContext('2d');
    ctx2.imageSmoothingEnabled = false;
    ctx2.setTransform(dpr,0,0,dpr,0,0);
    catchScene3D = { ctx2, canvasEl, w, h, fruits:[], bobT:0, raf:null, x:0 };
    function loop(){
      if(!catchScene3D) return;
      catchScene3D.bobT += .08;
      drawCatchScene2D();
      catchScene3D.raf = requestAnimationFrame(loop);
    }
    loop();
    return true;
  }
  function drawCatchScene2D(){
    const s = catchScene3D;
    const {ctx2,w,h} = s;
    ctx2.clearRect(0,0,w,h);
    const grad = ctx2.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#241c3a'); grad.addColorStop(1,'#1a1030');
    ctx2.fillStyle = grad; ctx2.fillRect(0,0,w,h);
    // suelo con los limites marcados a cada lado, como antes en 3D
    ctx2.fillStyle = 'rgba(125,93,255,.18)'; ctx2.fillRect(0,h*.72,w,h*.28);
    ctx2.strokeStyle = '#7d5dff'; ctx2.lineWidth = 3;
    ctx2.beginPath(); ctx2.moveTo(w*.08,h*.4); ctx2.lineTo(w*.08,h*.72); ctx2.stroke();
    ctx2.beginPath(); ctx2.moveTo(w*.92,h*.4); ctx2.lineTo(w*.92,h*.72); ctx2.stroke();
    // el rango de x va de -1.85 a 1.85 (igual que antes en 3D), lo mapeo al ancho del lienzo
    const toScreenX = (x)=> w*.5 + (x/1.85)*w*.42;
    s.fruits.forEach(f=>{
      const fx = toScreenX(f.x), fy = h*.12 + ((2.6-f.y)/3.8)*h*.55;
      ctx2.fillStyle = f.color;
      ctx2.save(); ctx2.translate(fx,fy); ctx2.rotate(f.rot||0);
      ctx2.fillRect(-9,-9,18,18);
      ctx2.restore();
    });
    const bob = Math.sin(s.bobT)*4;
    useCanvas(dummyCanvas2D);
    drawCreature({...snapshotVisual(pet), frame:pet.frame||0, sleeping:false, sick:false}, true, 12, 13.5);
    useScreenCanvas();
    const spriteSize = 110;
    ctx2.drawImage(dummyCanvas2D, toScreenX(s.x)-spriteSize/2, h*.78-spriteSize+bob, spriteSize, spriteSize);
  }
  function setCatchBasketX3D(x){
    if(!catchScene3D) return;
    catchScene3D.x = x;
  }
  const CATCH_FRUIT_COLORS = ['#ff4d6d','#ffd23f','#8a3fff','#ff8a3f','#4dff9e'];
  function spawnCatchFruit3D(x){
    if(!catchScene3D) return;
    const color = CATCH_FRUIT_COLORS[Math.floor(Math.random()*CATCH_FRUIT_COLORS.length)];
    catchScene3D.fruits.push({ x, y:2.6, color, rot:0, caught:false });
  }
  function advanceCatchFruits3D(speed){
    if(!catchScene3D) return { caught:0, missed:0 };
    let caught=0, missed=0;
    const remaining = [];
    catchScene3D.fruits.forEach(f=>{
      f.y -= speed; f.rot = (f.rot||0) + .15;
      if(f.y < -.15 && f.y > -.55 && Math.abs(f.x-catchScene3D.x) < .55){
        caught++;
      } else if(f.y < -.9){
        missed++;
      } else {
        remaining.push(f);
      }
    });
    catchScene3D.fruits = remaining;
    return { caught, missed };
  }
  // ---------- Esquiva en pixel art: la mascota se mueve por el carril, no es un emoji plano ----------
  function stopDodgeScene3D(){
    if(dodgeScene3D){
      if(dodgeScene3D.raf) cancelAnimationFrame(dodgeScene3D.raf);
      dodgeScene3D = null;
    }
  }
  function initDodgeScene3D(canvasEl){
    if(!canvasEl) return false;
    const w = canvasEl.clientWidth||300, h = canvasEl.clientHeight||300;
    const dpr = Math.min(window.devicePixelRatio||1,2);
    canvasEl.width = w*dpr; canvasEl.height = h*dpr;
    const ctx2 = canvasEl.getContext('2d');
    ctx2.imageSmoothingEnabled = false;
    ctx2.setTransform(dpr,0,0,dpr,0,0);
    dodgeScene3D = { ctx2, canvasEl, w, h, obstacles:[], bobT:0, raf:null, lane:1 };
    function loop(){
      if(!dodgeScene3D) return;
      dodgeScene3D.bobT += .09;
      drawDodgeScene2D();
      dodgeScene3D.raf = requestAnimationFrame(loop);
    }
    loop();
    return true;
  }
  function drawDodgeScene2D(){
    const s = dodgeScene3D;
    const {ctx2,w,h} = s;
    ctx2.clearRect(0,0,w,h);
    const grad = ctx2.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#1a1030'); grad.addColorStop(1,'#2a1c3a');
    ctx2.fillStyle = grad; ctx2.fillRect(0,0,w,h);
    const laneXs = [w*.3, w*.7];
    ctx2.strokeStyle = 'rgba(125,93,255,.55)'; ctx2.lineWidth = 3;
    laneXs.forEach(x=>{ ctx2.beginPath(); ctx2.moveTo(x,0); ctx2.lineTo(x,h); ctx2.stroke(); });
    // los obstaculos van de z=-13 (lejos) a z=1.5 (encima) — los dibujo mas grandes y mas abajo cuanto mas cerca están
    s.obstacles.forEach(o=>{
      const near = Math.max(0, Math.min(1, (o.z+13)/13.5));
      const oy = h*.1 + near*h*.62, size = 14+near*34;
      ctx2.fillStyle = o.color;
      ctx2.beginPath(); ctx2.arc(laneXs[o.lane], oy, size/2, 0, Math.PI*2); ctx2.fill();
    });
    const bob = Math.sin(s.bobT)*4;
    useCanvas(dummyCanvas2D);
    drawCreature({...snapshotVisual(pet), frame:pet.frame||0, sleeping:false, sick:false}, true, 12, 13.5);
    useScreenCanvas();
    const spriteSize = 110;
    ctx2.drawImage(dummyCanvas2D, laneXs[s.lane]-spriteSize/2, h*.78-spriteSize+bob, spriteSize, spriteSize);
  }
  function setDodgeLane3D(lane){
    if(!dodgeScene3D) return;
    dodgeScene3D.lane = lane;
  }
  function spawnDodgeObstacle3D(lane){
    if(!dodgeScene3D) return;
    const colors = ['#9a8a72','#ff8844','#ff4444'];
    dodgeScene3D.obstacles.push({ lane, z:-13, color: colors[Math.floor(Math.random()*colors.length)], hit:false });
  }
  function advanceDodgeObstacles3D(speed){
    if(!dodgeScene3D) return [];
    const hits = [];
    dodgeScene3D.obstacles.forEach(o=>{
      o.z += speed;
      if(!o.hit && o.z > -.3 && o.z < .5 && o.lane===dodgeScene3D.lane){
        o.hit = true; hits.push(o);
      }
    });
    dodgeScene3D.obstacles = dodgeScene3D.obstacles.filter(o=> o.z <= 1.5);
    return hits;
  }

  function startDodgeGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Toca la mitad izquierda o derecha para esquivar. ¡Aguanta 3 golpes!</p>
      <div class="game-hud"><span>Tiempo: <b id="dgTime">0.0</b>s</span><span>Vidas: <b id="dgLives">3</b></span></div>
      <div class="game-area" id="dodgeArea" style="position:relative;overflow:hidden;padding:0;">
        <canvas id="dodgeCanvas3D" style="width:100%;height:100%;display:block;"></canvas>
        <div id="dodgeHalfL" style="position:absolute;left:0;top:0;width:50%;height:100%;"></div>
        <div id="dodgeHalfR" style="position:absolute;right:0;top:0;width:50%;height:100%;"></div>
      </div>
    `;
    const canvasEl = document.getElementById('dodgeCanvas3D');
    initDodgeScene3D(canvasEl);
    let lane = 1; // 0 = izquierda, 1 = derecha
    setDodgeLane3D(lane);
    let lives = 3, startTime = performance.now(), spawnEvery = 900, lastSpawn = 0, over = false;
    document.getElementById('dodgeHalfL').onclick = ()=>{ if(over) return; lane=0; setDodgeLane3D(lane); };
    document.getElementById('dodgeHalfR').onclick = ()=>{ if(over) return; lane=1; setDodgeLane3D(lane); };
    const loop = setInterval(()=>{
      if(over) return;
      const now = performance.now();
      const elapsed = (now-startTime)/1000;
      document.getElementById('dgTime').textContent = elapsed.toFixed(1);
      if(now-lastSpawn > spawnEvery){
        lastSpawn = now;
        spawnDodgeObstacle3D(Math.random()<0.5?0:1);
        spawnEvery = Math.max(420, spawnEvery-15);
      }
      const hits = advanceDodgeObstacles3D(.42);
      if(hits.length){
        lives -= hits.length;
        document.getElementById('dgLives').textContent = Math.max(0,lives);
        sfx('hit');
        spawnFloatingEmoji('💥');
        if(lives<=0){ endDodge(elapsed); }
      }
    }, 30);
    minigameTimers.push(loop);
    function endDodge(elapsed){
      over = true;
      clearInterval(loop);
      stopDodgeScene3D();
      const gain = Math.min(28, Math.round(elapsed*2.2));
      finishMinigame(gain, 6, '¡'+pet.name+' aguantó '+elapsed.toFixed(1)+'s esquivando! +'+gain+' de ánimo');
      showGameResult('🏃 Esquiva', elapsed.toFixed(1)+' segundos aguantados', gain);
    }
  }

  function startRhythmGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Toca justo cuando el círculo llegue al aro. 8 golpes, encadena combo.</p>
      <div class="game-hud"><span>Combo: <b id="rhCombo">0</b></span><span>Golpe: <b id="rhBeat">1</b>/8</span></div>
      <div class="game-area" id="rhArea" style="display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">
        <div id="rhRing" style="position:absolute;width:56px;height:56px;border-radius:50%;border:4px solid rgba(125,255,179,.5);"></div>
        <div id="rhBall" style="position:absolute;width:22px;height:22px;border-radius:50%;background:#7dffb3;box-shadow:0 0 10px #7dffb3;"></div>
      </div>
    `;
    const area = document.getElementById('rhArea');
    let beat=0, combo=0, score=0, over=false;
    function playBeat(){
      if(over) return;
      const ball = document.getElementById('rhBall');
      const areaRect = area.getBoundingClientRect();
      const cx = areaRect.width/2, cy = areaRect.height/2;
      const radius = Math.min(areaRect.width, areaRect.height)*0.36;
      const dur = 1000;
      const start = performance.now();
      let hitWindowOpen = true;
      function step(){
        if(over) return;
        const t = (performance.now()-start)/dur;
        if(t>=1){
          if(hitWindowOpen){ missBeat(); }
          return;
        }
        const ang = t*Math.PI*2 - Math.PI/2;
        ball.style.left = (cx + Math.cos(ang)*radius*(1-t*0.001) - 11)+'px';
        ball.style.top = (cy + Math.sin(ang)*radius*(1-t*0.001) - 11)+'px';
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
      area.onclick = ()=>{
        if(!hitWindowOpen || over) return;
        const t = (performance.now()-start)/dur;
        const dist = Math.abs(t-0.85); // el aro está a un 85% del recorrido, cerca del punto de partida otra vez
        hitWindowOpen = false;
        if(dist < 0.09){
          combo++; score += 3+combo;
          document.getElementById('rhRing').style.borderColor = '#7dffb3';
          spawnFloatingEmoji('🥁');
        } else {
          combo = 0;
          document.getElementById('rhRing').style.borderColor = '#ff5c5c';
        }
        document.getElementById('rhCombo').textContent = combo;
        sfx(dist<0.09?'tap':'hit');
        nextBeat();
      };
    }
    function missBeat(){
      combo = 0;
      document.getElementById('rhCombo').textContent = combo;
      nextBeat();
    }
    function nextBeat(){
      beat++;
      if(beat>8){ endRhythm(); return; }
      document.getElementById('rhBeat').textContent = Math.min(beat,8);
      setTimeout(playBeat, 260);
    }
    nextBeat();
    function endRhythm(){
      over = true;
      area.onclick = null;
      const gain = Math.min(28, Math.round(score*0.9));
      finishMinigame(gain, 6, '¡'+pet.name+' siguió el ritmo! +'+gain+' de ánimo');
      showGameResult('🥁 Ritmo', score+' puntos conseguidos', gain);
    }
  }

      <div class="game-area" id="timArea" style="display:flex;align-items:center;justify-content:center;">
        <div id="timRing" style="width:120px;height:120px;border-radius:50%;border:6px solid #ff5c5c;transition:width .05s linear, height .05s linear, border-color .1s;"></div>
      </div>
    `;
    let score=0, tries=0;
    const ring = document.getElementById('timArea');
    let size, shrinking, raf;
    function nextAttempt(){
      tries++;
      document.getElementById('timTry').textContent = Math.min(tries,5);
      size = 120; shrinking=true;
      step();
    }
    function step(){
      const el = document.getElementById('timRing');
      if(!el) return;
      if(shrinking){
        size -= 1.6;
        if(size<=20){ size=20; shrinking=false; }
      } else {
        size += 1.6;
        if(size>=120){ endAttempt(0); return; }
      }
      el.style.width = size+'px'; el.style.height = size+'px';
      const sweet = size<=48 && size>=28;
      el.style.borderColor = sweet ? '#5eff9e' : '#ff5c5c';
      raf = requestAnimationFrame(step);
    }
    function endAttempt(pts){
      cancelAnimationFrame(raf);
      score += pts;
      document.getElementById('timScore').textContent = score;
      sfx(pts>0?'tap':'hit');
      if(tries>=5){
        const gain = Math.min(28, score);
        finishMinigame(gain, 5, '¡'+pet.name+' consiguió '+score+' puntos de precisión! +'+gain+' de ánimo');
        showGameResult('🎯 Toque perfecto', score+' puntos de precisión', gain);
      } else {
        setTimeout(nextAttempt, 500);
      }
    }
    ring.onclick = ()=>{
      const el = document.getElementById('timRing');
      if(!el) return;
      const sweet = size<=48 && size>=28;
      endAttempt(sweet ? 6 : 1);
    };
    nextAttempt();
  }

      spawnCatchFruit3D((Math.random()*2-1)*1.7);
    }, 850);

      const res = advanceCatchFruits3D(.045);
      if(res.caught){
        score += res.caught;
        document.getElementById('catchScore').textContent = score;
        sfx('tap');
        spawnFloatingEmoji('🍓');
      }
    }, 30);

    const timerT = setInterval(()=>{
      timeLeft--;
      document.getElementById('catchTime').textContent = timeLeft;
      if(timeLeft<=0){
        clearInterval(spawnT); clearInterval(moveT); clearInterval(timerT);

        const gain = Math.min(28, score*3);

        showGameResult('🍓 Atrapa la fruta', score+' frutas atrapadas', gain);
      }
    }, 1000);

    minigameTimers.push(spawnT, moveT, timerT);
  }

  function startMemoryGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    const ICONS = ['🍓','🐸','🎈','⭐','🍩','🚀'];
    let deck = [...ICONS, ...ICONS];
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
    let flipped=[], matched=new Set(), moves=0, lock=false;

    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Encuentra las 6 parejas con el menor número de intentos.</p>
      <div class="game-hud"><span>Intentos: <b id="memMoves">0</b></span><span>Parejas: <b id="memPairs">0</b>/6</span></div>
      <div class="memgrid" id="memGrid"></div>
    `;
    const grid = document.getElementById('memGrid');
    deck.forEach((icon,idx)=>{
      const b = document.createElement('button');
      b.className='memcard'; b.dataset.idx=idx; b.dataset.icon=icon;
      b.textContent='❔';
      b.onclick=()=>{
        if(lock || b.classList.contains('matched') || flipped.includes(b)) return;
        sfx('tap');
        b.textContent = icon;
        flipped.push(b);
        if(flipped.length===2){
          moves++; document.getElementById('memMoves').textContent=moves;
          lock=true;
          const [a,bb]=flipped;
          if(a.dataset.icon===bb.dataset.icon){
            a.classList.add('matched'); bb.classList.add('matched');
            matched.add(a.dataset.idx); matched.add(bb.dataset.idx);
            document.getElementById('memPairs').textContent=matched.size/2;
            flipped=[]; lock=false;
            if(matched.size===deck.length){
              const gain = Math.max(10, 30-moves);
              finishMinigame(gain, 6, '¡'+pet.name+' completó la memoria en '+moves+' intentos! +'+gain+' de ánimo');
              setTimeout(()=>showGameResult('🧠 Memoria', moves+' intentos', gain), 300);
            }
          } else {
            setTimeout(()=>{ a.textContent='❔'; bb.textContent='❔'; flipped=[]; lock=false; }, 700);
          }
        }
      };
      grid.appendChild(b);
    });
  }

  function startSimonGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    const COLOR_IDS = ['red','green','blue','yellow'];
    let sequence=[], level=0, playerIdx=0, accepting=false;

    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Memoriza y repite la secuencia de colores.</p>
      <div class="game-hud"><span>Ronda: <b id="simonLevel">0</b></span></div>
      <div class="simon-grid">
        <button class="simon-btn simon-red" data-c="red"></button>
        <button class="simon-btn simon-green" data-c="green"></button>
        <button class="simon-btn simon-blue" data-c="blue"></button>
        <button class="simon-btn simon-yellow" data-c="yellow"></button>
      </div>
    `;
    const btns = {};
    c.querySelectorAll('.simon-btn').forEach(b=>{ btns[b.dataset.c]=b; b.onclick=()=>handlePress(b.dataset.c); });

    async function nextRound(){
      accepting=false;
      level++; document.getElementById('simonLevel').textContent=level;
      sequence.push(COLOR_IDS[Math.floor(Math.random()*4)]);
      await sleep(500);
      for(const col of sequence){
        btns[col].classList.add('lit'); sfx('tap'); await sleep(420);
        btns[col].classList.remove('lit'); await sleep(220);
      }
      playerIdx=0; accepting=true;
    }
    function handlePress(col){
      if(!accepting) return;
      btns[col].classList.add('lit'); setTimeout(()=>btns[col].classList.remove('lit'),150);
      sfx('tap');
      if(sequence[playerIdx]===col){
        playerIdx++;
        if(playerIdx===sequence.length){ accepting=false; setTimeout(nextRound, 700); }
      } else {
        accepting=false;
        const gain = Math.min(26, (level-1)*4);
        finishMinigame(gain, 5, '¡'+pet.name+' llegó a la ronda '+(level-1)+' en Simón dice! +'+gain+' de ánimo');
        setTimeout(()=>showGameResult('🎵 Simón dice', 'Llegaste a la ronda '+(level-1), gain), 300);
      }
    }
    nextRound();
  }

  function petStoryTogether(){
    // "nuestra historia" usa los datos reales de la mascota — cuántas veces la has cuidado, en qué
    // etapa está, cuántos días lleváis — no algo inventado sobre la marcha
    const parts = [];
    if(pet.feedCount>0) parts.push(`me has dado de comer ${pet.feedCount} ${pet.feedCount===1?'vez':'veces'}`);
    if(pet.playCount>0) parts.push(`hemos jugado juntos ${pet.playCount} ${pet.playCount===1?'vez':'veces'}`);
    const ageH = Math.floor((pet.age||0));
    if(ageH>0) parts.push(`llevamos ${ageH} ${ageH===1?'hora':'horas'} juntos`);
    let msg = parts.length ? 'Desde que empezamos, ' + parts.join(', ') + '.' : 'Todavía estamos empezando a conocernos.';
    if(pet.stage>=3 && pet.speciesName) msg += ` Y mira, ya evolucioné hasta convertirme en ${pet.speciesName}.`;
    if(pet.level>=5) msg += ` Ya voy por el nivel ${pet.level}, gracias a ti.`;
    return msg;
  }
  function petSelfStatus(){
    // el propio compañero también cuenta algo de cómo está él, para que la conversación no sea de
    // un solo sentido — usando sus datos reales, no algo inventado
    if(pet.sleeping) return "Ahora mismo estoy medio dormido/a, pero me alegra que hayas venido igualmente.";
    if(pet.sick) return "Hoy no me encuentro muy bien, la verdad — pero se agradece la visita.";
    if(pet.sac<35) return "Ahora mismo tengo bastante hambre, si te soy sincero/a.";
    if(pet.energy<30) return "Estoy un poco cansado/a hoy, con menos energía de la normal.";
    if(pet.happy>80) return "¡La verdad es que hoy me siento genial!";
    if(pet.happy<35) return "No te voy a mentir, hoy ando un poco decaído/a.";
    return "Por mi parte, hoy es un día tranquilo, sin más.";
  }
  function openTalkModal(){
    sfx('tap');
    const hour = new Date().getHours();
    const pool = hour<12 ? TALK_GREETINGS_MORNING : hour<20 ? TALK_GREETINGS_AFTERNOON : TALK_GREETINGS_NIGHT;
    const greeting = pool[Math.floor(Math.random()*pool.length)];
    // memoria de esta conversación en concreto: qué ánimo eligió, qué temas ya ha tocado y qué frases
    // ya ha dicho — para que las opciones vayan cambiando de verdad en vez de repetir el mismo menú
    const memory = { mood:null, used:new Set(), topicsUsed:new Set() };
    function pickFresh(msgPool){
      const options = msgPool.filter(m=>!memory.used.has(m));
      const chosen = (options.length ? options : msgPool)[Math.floor(Math.random()*(options.length?options.length:msgPool.length))];
      memory.used.add(chosen);
      return chosen;
    }
    function pickFreshTree(treePool){
      const options = treePool.filter(t=>!memory.used.has(t.open));
      const chosen = (options.length?options:treePool)[Math.floor(Math.random()*(options.length?options.length:treePool.length))];
      memory.used.add(chosen.open);
      return chosen;
    }
    function showThread(tree){
      // se abre con la idea, y las dos opciones que salen después responden específicamente a ESA idea
      // — así la conversación sigue un hilo real en vez de saltar a un tema suelto sin relación
      addPetLine(tree.open);
      setOptions(tree.follow.map(f=>({ label:f.label, onClick:()=>{ addPetLine(f.reply); setOptions(topicOptions()); } })));
    }
    const el = document.createElement('div');
    el.className='modal-backdrop'; el.id='talkModal';
    el.innerHTML = `<div class="modal" style="max-width:340px;">
      <button class="close-x" id="closeTalk">✕</button>
      <h3>💬 ${pet.name}</h3>
      <div id="talkLog" style="max-height:44vh;overflow-y:auto;margin:10px 0;display:flex;flex-direction:column;gap:8px;padding-right:2px;"></div>
      <div class="modal-actions" id="talkActions" style="flex-direction:column;gap:8px;"></div>
    </div>`;
    document.getElementById('modalRoot').appendChild(el);
    refreshScrollLock();
    const close = ()=>{ el.remove(); refreshScrollLock(); };
    document.getElementById('closeTalk').onclick = close;
    el.addEventListener('click',(e)=>{ if(e.target===el) close(); });
    const log = document.getElementById('talkLog');
    function addPetLine(text){
      const b = document.createElement('div');
      b.style.cssText = 'background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.45;align-self:flex-start;max-width:88%;white-space:pre-line;';
      b.textContent = text;
      log.appendChild(b);
      log.scrollTop = log.scrollHeight;
    }
    function addYouLine(text){
      const b = document.createElement('div');
      b.style.cssText = 'background:rgba(125,93,255,.35);border-radius:10px;padding:6px 10px;font-size:12.5px;align-self:flex-end;max-width:80%;color:#dfe0ff;';
      b.textContent = text;
      log.appendChild(b);
      log.scrollTop = log.scrollHeight;
    }
    addPetLine(greeting);
    function setOptions(buttons){
      // "buttons" es una lista de {label, onClick} — nunca más de 3 a la vez, para que no se sienta
      // como una tarjeta llena de botones sino como una conversación que va avanzando
      document.getElementById('talkActions').innerHTML = buttons.map((b,i)=>`<button class="status-btn" id="talkBtn${i}">${b.label}</button>`).join('');
      buttons.forEach((b,i)=> document.getElementById('talkBtn'+i).onclick = ()=>{ sfx('tap'); addYouLine(b.label); b.onClick(); });
    }
    function topicOptions(excludeExtra){
      // el siguiente paso depende de qué se ha hablado ya — solo ofrezco temas que no se hayan
      // tocado todavía, y como mucho dos a la vez más la salida
      const all = [
        {key:'self', label:'¿Y tú cómo estás?', run:()=>{ addPetLine(petSelfStatus()); }},
        {key:'random', label:'Cuéntame algo', thread:true, run:()=>{ showThread(pickFreshTree(TALK_RANDOM)); }},
        {key:'likes', label:'¿Qué te gusta?', run:()=>{ addPetLine(pickFresh(TALK_LIKES)); }},
        {key:'advice', label:'Dame un consejo', thread:true, run:()=>{ showThread(pickFreshTree(TALK_ADVICE)); }},
        {key:'story', label:'Nuestra historia juntos', run:()=>{ addPetLine(petStoryTogether()); }},
        {key:'joke', label:'Cuéntame un chiste', thread:true, run:()=>{ showThread(pickFreshTree(TALK_JOKES)); }},
        {key:'dream', label:'¿Con qué sueñas?', thread:true, run:()=>{ showThread(pickFreshTree(TALK_DREAMS)); }},
        {key:'gratitude', label:'¿Quieres decirme algo?', run:()=>{ addPetLine(pickFresh(TALK_GRATITUDE)); }},
        {key:'memories', label:'Un recuerdo curioso', thread:true, run:()=>{ showThread(pickFreshTree(TALK_MEMORIES)); }},
        {key:'askme', label:'Pregúntame algo tú', thread:true, run:()=>{ showThread(pickFreshTree(TALK_ASKME)); }}
      ].filter(t => !memory.topicsUsed.has(t.key) && !(excludeExtra&&excludeExtra.includes(t.key)));
      const picked = [];
      while(picked.length<2 && all.length){ picked.push(all.splice(Math.floor(Math.random()*all.length),1)[0]); }
      const buttons = picked.map(t=>({ label:t.label, onClick:()=>{ memory.topicsUsed.add(t.key); t.run(); if(!t.thread) afterTopic(t.key); } }));
      buttons.push({ label:'Dejarlo aquí', onClick: close });
      return buttons;
    }
    function afterTopic(justUsed){
      // si acaba de contar que tiene hambre o poca energía, se ofrece un atajo real a la acción,
      // en vez de solo seguir hablando — así la charla se conecta con el juego de verdad
      if(justUsed==='self' && pet.sac<35 && !pet.sleeping){
        setOptions([
          { label:'Dale de comer', onClick:()=>{ close(); openMoreMenu2Feed(); } },
          ...topicOptions(['self']).slice(0,1)
        ]);
        return;
      }
      setOptions(topicOptions());
    }
    function openMoreMenu2Feed(){
      // atajo directo a dar de comer, para no obligar a salir del chat y buscarlo por el menú —
      // reutiliza el propio botón real, así se dispara exactamente la misma lógica de siempre
      const btn = document.getElementById('btnFeed');
      if(btn && !btn.disabled) btn.click();
    }
    function moodBadFollowUp(){
      // tras un "no muy bien" no se vuelve directo al menú de siempre — queda un hueco para seguir
      // acompañando un poco más, con calma, antes de continuar con otros temas
      setOptions([
        { label:'Gracias por escuchar', onClick:()=>{ addPetLine('Para eso estoy. No hace falta que me des las gracias, pero se agradece igual.'); setOptions(topicOptions()); } },
        { label:'Necesito distraerme un poco', onClick:()=>{ addPetLine('Vale, vamos a algo más ligero entonces.'); setOptions(topicOptions(['self'])); } },
        { label:'Quiero seguir hablando de esto', onClick:()=>{ addPetLine(pickFresh(TALK_COMFORT)); moodBadFollowUp(); } }
      ]);
    }
    setOptions([
      { label:'😊 Bien', onClick:()=>{ memory.mood='good'; addPetLine(pickFresh(TALK_MOOD_GOOD)); pet.happy=clamp(pet.happy+2); savePet(); setOptions(topicOptions()); } },
      { label:'😐 Normal', onClick:()=>{ memory.mood='ok'; addPetLine(pickFresh(TALK_MOOD_OK)); pet.happy=clamp(pet.happy+2); savePet(); setOptions(topicOptions()); } },
      { label:'😔 No muy bien', onClick:()=>{ memory.mood='bad'; addPetLine(pickFresh(TALK_MOOD_BAD)+'\n\nSi sientes que esto te pesa mucho, hablar con alguien de confianza o un profesional puede ayudar de verdad — yo estoy aquí para acompañarte, pero no puedo sustituir eso.'); pet.happy=clamp(pet.happy+2); savePet(); moodBadFollowUp(); } }
    ]);
  }
  document.getElementById('btnMore').onclick = openMoreMenu;
  function openTreeModal(){
    const el = document.createElement('div');
    el.className='modal-backdrop'; el.id='treeModal';
    const trendTemp = pet.playCount > pet.feedCount ? 'Activo' : 'Tranquilo';
    const lockedTemp = pet.stage>=2 ? pet.temperament : null;
    const trendPath = computePath();
    const lockedPath = pet.stage>=3 ? pet.path : null;
    const trendAff = computeAffinity();
    const lockedAff = pet.stage>=3 ? pet.affinity : null;
    const avgHappy = pet.ticks ? Math.round(pet.sumHappy/pet.ticks) : pet.happy;

    const sendaNode = (key, label, active, desc)=>`
      <div class="efork-branch">
        <div class="efork-stem"></div>
        <div class="enode small${active?' current':''}">
          <div class="evo-preview-box" style="margin:0 auto 4px;"><canvas id="evoPreview_${key}" width="160" height="160"></canvas></div>
          ${label}<small>${desc}</small>
        </div>
      </div>`;
    const affChip = (label, active, desc)=>`<span class="evo-branch${active?' current':''}" style="display:inline-block;margin:3px;">${label}${desc}</span>`;

    el.innerHTML = `<div class="modal">
      <button class="close-x" id="closeTree">✕</button>
      <h3>ÁRBOL EVOLUTIVO</h3>
      <p class="small-note">Las formas finales son prácticamente irrepetibles (nombre, color, silueta, ojos y patrón), pero la ruta para llegar hasta ahí sigue siempre este árbol. El nodo marcado en verde es hacia donde va tu mascota ahora mismo.</p>

      <div class="eflow">
        <div class="enode">🥚 Huevo</div>
        <div class="econnector"></div>
        <div class="enode">🐣 Cría</div>
        <div class="econnector"></div>
        <div class="enode${pet.stage===2?' current':''}">🌱 Pequeño<small>sube en el nivel ${LEVEL_CHILD}</small></div>

        <div class="efork">
          <div class="efork-line"></div>
          <div class="efork-row">
            <div class="efork-branch"><div class="efork-stem"></div><div class="enode small${trendTemp==='Activo'&&!lockedTemp?' current':''}${lockedTemp==='Activo'?' current':''}">⚡ Activo<small>juegas más que alimentas</small></div></div>
            <div class="efork-branch"><div class="efork-stem"></div><div class="enode small${trendTemp==='Tranquilo'&&!lockedTemp?' current':''}${lockedTemp==='Tranquilo'?' current':''}">🌙 Tranquilo<small>alimentas más que juegas</small></div></div>
          </div>
        </div>
        <div class="evo-trend" style="text-align:center;">${lockedTemp ? 'Ya fijado: '+lockedTemp : 'Tendencia: '+trendTemp+' ('+pet.playCount+' jugadas · '+pet.feedCount+' comidas)'}</div>

        <div class="econnector"></div>
        <div class="enode${pet.stage>=3?' current':''}">✨ Joven<small>sube en el nivel ${LEVEL_ADULT} — nace tu especie única</small></div>

        <div class="efork">
          <div class="efork-line"></div>
          <div class="efork-row three">
            ${sendaNode('luz','Luz', trendPath==='luz'&&!lockedPath||lockedPath==='luz', 'ánimo alto, pocos fallos')}
            ${sendaNode('sombra','Sombra', trendPath==='sombra'&&!lockedPath||lockedPath==='sombra', 'muchos fallos o ánimo bajo')}
            ${sendaNode('equilibrio','Equilibrio', trendPath==='equilibrio'&&!lockedPath||lockedPath==='equilibrio', 'término medio')}
          </div>
        </div>
        <div class="evo-trend" style="text-align:center;">${lockedPath ? 'Ya fijada: '+PATH_LABEL[lockedPath] : 'Tendencia: '+PATH_LABEL[trendPath]+' ('+pet.mistakes+' fallos · '+avgHappy+'% ánimo medio)'}</div>

        <div class="evo-gate" style="text-align:center;margin-top:10px;"><b>Afinidad</b> (tu stat más alto ahora mismo) — cruza con la Senda para decidir forma y rasgo:</div>
        <div style="text-align:center;">
          ${STAT_KEYS.map(k=>affChip(STAT_LABEL[k], (trendAff===k&&!lockedAff)||lockedAff===k, ' '+pet.stats[k]+'pt')).join('')}
          ${affChip('Equilibrado', (trendAff==='equilibrado'&&!lockedAff)||lockedAff==='equilibrado', '')}
        </div>

        <div class="econnector"></div>
        <div class="enode${pet.stage===4?' current':''}">💠 Perfecto<small>misma especie, forma Mayor — nivel ${LEVEL_PERFECT}</small></div>
        <div class="econnector"></div>
        <div class="enode${pet.stage===5?' current':''}">🌟 Supremo<small>misma especie, forma Suprema — nivel ${LEVEL_ULTIMATE}</small></div>
      </div>

      ${pet.stage>=3 ? `<h3 style="margin-top:18px;">TU FORMA ACTUAL</h3>
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px;">
          <div class="evo-preview-box" style="width:70px;height:70px;"><canvas id="evoPreviewCurrent" width="200" height="200"></canvas></div>
          <div style="font-weight:800;">${speciesDisplay(pet)}</div>
        </div>
        <div class="modal-row"><span>Senda</span><b>${PATH_LABEL[pet.path]}</b></div>
        <div class="modal-row"><span>Afinidad</span><b>${STAT_LABEL[pet.affinity]||'Equilibrado'}</b></div>
        <div class="modal-row"><span>Forma de cuerpo</span><b>${pet.bodyShape}</b></div>
        <div class="modal-row"><span>Rasgo</span><b>${pet.featureType}</b></div>
        <div class="modal-row"><span>Patrón</span><b>${pet.pattern}</b></div>
        <div class="modal-row"><span>Color</span><b>Tono ${pet.hue}° <span class="swatch" style="background:hsl(${pet.hue},68%,55%)"></span></b></div>` : ''}
    </div>`;
    document.getElementById('modalRoot').appendChild(el);
    refreshScrollLock();
    stopMiniPreviews();
    ['luz','sombra','equilibrio'].forEach(senda=>{
      const cv = document.getElementById('evoPreview_'+senda);
      if(!cv) return;
      const snap = previewSnapshot(senda, lockedAff||trendAff, lockedTemp||trendTemp);
      render3DMiniPreview(cv, snap);
    });
    if(pet.stage>=3){
      const cv = document.getElementById('evoPreviewCurrent');
      if(cv){ render3DMiniPreview(cv, snapshotVisual(pet)); }
    }
    document.getElementById('closeTree').onclick=()=>{ stopMiniPreviews(); el.remove(); refreshScrollLock(); };
    el.addEventListener('click',(e)=>{ if(e.target===el){ stopMiniPreviews(); el.remove(); refreshScrollLock(); } });
  }


  document.getElementById('btnMute').onclick = ()=>{
    ensureAudio();
    soundOn = !soundOn;
    document.getElementById('btnMute').textContent = soundOn ? '🔊' : '🔇';
    if(soundOn) sfx('tap');
  };


  // ---------- entornos: cada mascota vive en el suyo propio, elegido por su semilla ----------
  const ENV_THEMES = ['bosque','parque','galaxia','playa','digital','cueva','volcan','nieve','desierto','otonio'];
  const ENV_COLORS = {
    bosque:  { sky:[110,.42,.13], ground:[105,.38,.2] },
    parque:  { sky:[100,.5,.6],  ground:[95,.42,.42] },
    galaxia: { sky:[255,.5,.05], ground:[255,.3,.11] },
    playa:   { sky:[42,.65,.62], ground:[42,.5,.55] },
    digital: { sky:[160,.65,.05],ground:[160,.4,.09] },
    cueva:   { sky:[275,.4,.05], ground:[275,.3,.09] },
    volcan:  { sky:[10,.55,.13], ground:[8,.4,.14] },
    nieve:   { sky:[205,.35,.62], ground:[200,.15,.82] },
    desierto:{ sky:[35,.55,.55], ground:[38,.5,.58] },
    otonio:  { sky:[28,.45,.35], ground:[25,.4,.22] }
  };
  function pickEnvTheme(seed){
    const rand = mulberry32((seed||1)+41);
    return ENV_THEMES[Math.floor(rand()*ENV_THEMES.length)];
  }

  let screenSized = false;
  let petWander = null;
  function updatePetWander(){
    const now = performance.now();
    // centro vertical real de la pantalla, calculado así porque un móvil es mucho más alto que ancho
    const centerY = (canvas.height/cell)/2;
    if(!petWander){
      petWander = { x:12, y:centerY, targetX:12, targetY:centerY, nextMoveAt:now+1800, behavior:'quieta', hopPhase:0, faceDir:1 };
    }
    const w = petWander;
    if(now >= w.nextMoveAt){
      // se sortea qué hace ahora: pasear a un punto nuevo, dar un saltito, olfatear, o quedarse quieta —
      // quité el giro porque rotaba sin querer el fondo entero, no solo a la mascota
      const behaviors = pet.sleeping ? ['quieta'] : ['pasear','pasear','quieta','quieta','saltar','oler'];
      w.behavior = behaviors[Math.floor(Math.random()*behaviors.length)];
      if(w.behavior==='pasear'){
        const newX = 6 + Math.random()*12;
        w.faceDir = newX >= w.x ? 1 : -1;
        w.targetX = newX;
        w.targetY = centerY-3 + Math.random()*6;
      }
      w.nextMoveAt = now + (w.behavior==='pasear' ? 3200+Math.random()*2600 : 2000+Math.random()*2600);
    }
    if(w.behavior==='pasear'){
      w.x += (w.targetX-w.x)*0.025;
      w.y += (w.targetY-w.y)*0.025;
    }
    w.hopPhase = w.behavior==='saltar' ? w.hopPhase+0.14 : 0;
    return w;
  }
  function renderPetScreen(){
    // el tamaño del lienzo solo hace falta calcularlo una vez, la primera vez que se dibuja
    if(!screenSized){
      screenSized = true;
      const aspect = window.innerHeight / window.innerWidth;
      screenCanvas.width = GRID * CELL_PX;
      screenCanvas.height = Math.max(screenCanvas.width, Math.round(GRID * CELL_PX * aspect));
      screenCanvas.style.imageRendering = 'pixelated';
    }
    useCanvas(screenCanvas);
    if(pet.stage===0) drawEgg(pet.frame, pet.bgSeed);
    else {
      const w = updatePetWander();
      const hop = w.behavior==='saltar' ? -Math.abs(Math.sin(w.hopPhase))*1.6 : 0;
      // siempre mira hacia el mismo lado — voltearla con ctx.scale(-1,1) rompía el contorno
      drawCreature(pet, false, w.x, w.y+hop);
    }
    useScreenCanvas();
  }
  let petAnimLoopRunning = false;
  function startPetAnimLoop(){
    // el paseo se anima en su propio bucle, aparte del refresco lento del juego (cada 550ms) —
    // si no, cada paso se veía a saltos en vez de un movimiento fluido de verdad
    if(petAnimLoopRunning) return;
    petAnimLoopRunning = true;
    let lastDraw = 0;
    function loop(now){
      requestAnimationFrame(loop);
      if(now - lastDraw < 66) return; // ~15 fotogramas por segundo — de sobra para un paseo suave, sin gastar de más
      lastDraw = now;
      if(pet && pet.alive && document.getElementById('modalRoot').children.length===0 && document.getElementById('screen')){
        renderPetScreen();
      }
    }
    requestAnimationFrame(loop);
  }

  loadPet().then(()=>{
    setInterval(()=>tick(true), TICK_MS);
    setInterval(()=>{ if(pet.alive && pet.stage>0){ render(); } }, 550); // idle animation refresh
    startPetAnimLoop();
  });
})();
</script>
<script>
  // registro del service worker, así "Añadir a pantalla de inicio" crea un acceso directo de verdad
  // (con icono propio y sin barra del navegador), no solo un marcador cualquiera
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* si falla, la app sigue funcionando igual, solo sin caché offline */ });
    });
  }
</script>
