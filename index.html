<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BYTEMON — Tu mascota digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<!-- Solo necesito esto si subo el archivo fuera de Claude (ver mis notas al final del código) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --shell:#1c1c1e;
    --shell-hi:#2c2c30;
    --shell-lo:#0a0a0b;
    --screen:#0a1712;
    --ink:#eaf2ee;
    --muted:#8592a0;
    --luz:#5eff9e;
    --sombra:#ff4d8d;
    --equilibrio:#ffb84d;
    --accent:#8fe3a0;
    --danger:#ff5c5c;
    --devred:#d81c2b;
    --devred-dk:#7a0f18;
    --devred-lt:#f04552;
    --techglow:#4fd6ff;
    --arcaneglow:#7dffb3;
    --arcaneglow-dk:#2e8a5c;
    --metal:#3a2a6b;
    --metal-lt:#5a3f9e;
    --metal-dk:#1f1640;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  #bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block;}
  #twinkleLayer{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
  .twinkle{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3.2s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;} 50%{opacity:.9;}}
  body{
    margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    font-family:'Nunito',sans-serif;color:var(--ink);padding:18px;
  }
  .device{
    width:100%;max-width:380px;
    background:
      repeating-linear-gradient(135deg, rgba(157,77,255,.05) 0 2px, transparent 2px 8px),
      radial-gradient(circle at 25% 10%, rgba(157,77,255,.14), transparent 55%),
      linear-gradient(160deg,var(--metal-lt),var(--metal) 45%,var(--metal-dk));
    border-radius:46px;
    padding:24px 20px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,.7);
    border:1px solid var(--arcaneglow-dk);
    position:relative;
  }
  .device::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
    border-radius:46px;
    box-shadow:inset 0 0 0 1.5px rgba(125,255,179,.3), inset 0 1px 0 rgba(157,77,255,.2);
  }
  .antenna{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:3px;height:16px;
    background:linear-gradient(var(--metal-lt),var(--metal-dk));border-radius:2px;}
  .antenna::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:8px;height:8px;
    border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--arcaneglow),var(--arcaneglow-dk));
    box-shadow:0 0 5px 1px var(--arcaneglow);}
  .device::after{
    content:'';position:absolute;left:16px;right:16px;top:58px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--arcaneglow) 15%,var(--techglow) 50%,var(--arcaneglow) 85%,transparent);
    box-shadow:0 0 6px 0 rgba(157,77,255,.6);opacity:.7;pointer-events:none;
  }
  .screw{display:none;position:absolute;width:14px;height:14px;
    background:radial-gradient(circle at 32% 28%,var(--metal-lt),var(--metal-dk) 75%);
    clip-path:polygon(25% 0%,75% 0%,100% 25%,100% 75%,75% 100%,25% 100%,0% 75%,0% 25%);
    box-shadow:0 1px 2px rgba(0,0,0,.7), inset 0 0 0 1px rgba(157,77,255,.5);z-index:3;}
  .screw::before{content:'';position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;
    background:var(--arcaneglow);box-shadow:0 0 4px 1px var(--arcaneglow);transform:translate(-50%,-50%);}
  .screw.tl{top:12px;left:28px;} .screw.tr{top:10px;right:10px;}
  .screw.bl{bottom:10px;left:10px;} .screw.br{bottom:12px;right:28px;}
  .vents{display:none;position:absolute;bottom:14px;left:18px;width:34px;height:20px;border-radius:3px;
    background:repeating-linear-gradient(180deg, #050608 0 3px, var(--metal) 3px 5.5px);
    box-shadow:inset 0 0 0 1px #000, 0 0 0 1px rgba(79,214,255,.25), 0 1px 2px rgba(0,0,0,.6);opacity:.95;}
  .modelplate{display:none;position:absolute;bottom:16px;right:20px;font-family:'Press Start 2P',monospace;font-size:6.5px;
    color:rgba(157,77,255,.55);letter-spacing:.5px;text-shadow:0 0 4px rgba(157,77,255,.4);}
  .gauge{display:none;position:absolute;bottom:44px;left:19px;width:24px;height:24px;
    clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
    background:radial-gradient(circle at 35% 30%,var(--metal-lt),var(--metal-dk) 75%);
    box-shadow:0 0 10px 2px rgba(157,77,255,.4);
    animation:coreGlow 3s ease-in-out infinite;
  }
  .gauge::before{content:'';position:absolute;inset:6px;
    clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
    background:radial-gradient(circle, var(--arcaneglow), transparent 70%);opacity:.75;filter:blur(1px);}
  @keyframes coreGlow{0%,100%{box-shadow:0 0 8px 1px rgba(157,77,255,.3);}
    50%{box-shadow:0 0 16px 3px rgba(157,77,255,.65);}}
  .device-top{display:flex;justify-content:space-between;align-items:center;padding:0 10px 10px;}
  .device-top .knob{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--metal-lt),var(--metal-dk));box-shadow:inset 0 0 0 1px #000, 0 0 3px rgba(157,77,255,.4);}
  .statusled{width:7px;height:7px;border-radius:50%;background:var(--luz);box-shadow:0 0 5px 1px var(--luz);transition:background .3s, box-shadow .3s;}
  .device-top .slider{width:26px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--metal-dk),var(--metal-lt));box-shadow:inset 0 0 0 1px #000;}
  .keyring{
    position:absolute;top:-11px;right:26px;width:20px;height:20px;border-radius:50%;
    border:3px solid var(--metal-lt);box-shadow:0 1px 2px rgba(0,0,0,.5), 0 0 4px rgba(79,214,255,.3);background:transparent;
  }
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 14px;}
  .brand{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;color:var(--ink);
    text-shadow:0 0 6px rgba(157,77,255,.6);display:flex;align-items:center;gap:7px;}
  .brand span{color:var(--arcaneglow);}
  .rune{width:6px;height:6px;background:var(--arcaneglow);transform:rotate(45deg);
    box-shadow:0 0 6px 1px var(--arcaneglow);animation:runePulse 2.4s ease-in-out infinite;flex-shrink:0;}
  @keyframes runePulse{0%,100%{opacity:.35;} 50%{opacity:1;}}
  .agebadge{font-size:11px;color:var(--muted);font-weight:700;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .mutebtn{font-size:15px;cursor:pointer;user-select:none;line-height:1;}
  .screen-bezel{
    position:relative;border-radius:26px;padding:16px;isolation:isolate;
    background:
      radial-gradient(circle 4px at 18px 50%, #150f09 95%, transparent 97%),
      radial-gradient(circle 4px at calc(100% - 18px) 50%, #150f09 95%, transparent 97%),
      radial-gradient(circle 4px at 50% 18px, #150f09 95%, transparent 97%),
      radial-gradient(circle 4px at 50% calc(100% - 18px), #150f09 95%, transparent 97%),
      radial-gradient(circle at 30% 25%, var(--metal-lt), var(--metal) 45%, var(--metal-dk) 100%);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.4), inset 0 2px 4px rgba(0,0,0,.5), 0 3px 8px rgba(0,0,0,.5), 0 0 0 1px var(--arcaneglow-dk), 0 0 10px rgba(125,255,179,.25);
  }
  .screen-bezel::before{
    content:'';position:absolute;inset:-5px;border-radius:30px;z-index:-1;
    background:var(--techglow);opacity:.3;filter:blur(6px);
  }
  .screen-inner{position:relative;border-radius:16px;overflow:hidden;background:var(--screen);}
  .hudcorner{display:none;position:absolute;width:10px;height:10px;border-color:var(--techglow);opacity:.65;pointer-events:none;z-index:4;}
  .hudcorner.tl{top:3px;left:3px;border-top:2px solid;border-left:2px solid;}
  .hudcorner.tr{top:3px;right:3px;border-top:2px solid;border-right:2px solid;}
  .hudcorner.bl{bottom:3px;left:3px;border-bottom:2px solid;border-left:2px solid;}
  .hudcorner.br{bottom:3px;right:3px;border-bottom:2px solid;border-right:2px solid;}
  canvas#screen{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;}
  .scanlines{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 4px);
    mix-blend-mode:multiply;
  }
  .glowring{
    position:absolute;inset:-2px;border-radius:12px;pointer-events:none;
    box-shadow:0 0 22px 2px var(--glow, transparent) inset;transition:box-shadow .6s;
  }
  .hud{
    position:fixed;top:58px;right:12px;left:auto;z-index:15;
    display:flex;flex-direction:column;align-items:flex-end;gap:2px;
    font-family:'Press Start 2P',monospace;font-size:8px;color:var(--luz);text-shadow:0 0 4px rgba(0,0,0,.9);
  }
  .pathtag{position:absolute;bottom:6px;right:8px;font-family:'Press Start 2P',monospace;font-size:7px;
    color:var(--tagcolor,#666);text-shadow:0 0 4px rgba(0,0,0,.9);}
  .stats{
    position:fixed;top:58px;left:12px;z-index:15;
    display:flex;flex-direction:column;gap:3px;
    background:rgba(8,6,16,.55);padding:6px 8px;border-radius:10px;
    width:98px;
  }
  .stat-row{display:flex;align-items:center;gap:5px;}
  .stat-icon{font-size:10px;width:12px;text-align:center;}
  .bar-track{flex:1;height:5px;border-radius:3px;background:#000;box-shadow:inset 0 1px 2px rgba(0,0,0,.8);overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;transition:width .4s ease;}
  .fill-sac{background:linear-gradient(90deg,#ffb84d,#ffd98a);}
  .fill-happy{background:linear-gradient(90deg,#ff8fd0,#ffc2e8);}
  .fill-energy{background:linear-gradient(90deg,#5ec8ff,#a7e6ff);}
  .fill-health{background:linear-gradient(90deg,#5eff9e,#baffcf);}
  .fill-hyg{background:linear-gradient(90deg,#c9a0ff,#e6d3ff);}
  .effects-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:0;}
  .effect-chip{font-size:10px;font-weight:800;padding:4px 9px;border-radius:8px;}
  .effect-empacho{background:rgba(255,184,77,.15);color:#ffb84d;border:1px solid rgba(255,184,77,.4);}
  .effect-letargo{background:rgba(255,92,92,.15);color:#ff5c5c;border:1px solid rgba(255,92,92,.4);}
  .effect-racha{background:rgba(94,255,158,.15);color:#5eff9e;border:1px solid rgba(94,255,158,.4);}
  .controls{margin-top:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  button{
    font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:var(--ink);cursor:pointer;
    background:linear-gradient(160deg,var(--metal-lt),var(--metal-dk));border:1px solid var(--arcaneglow-dk);
    border-radius:12px;padding:11px 14px;
    box-shadow:0 2px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  button:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.5);}
  button:disabled{opacity:.4;filter:grayscale(.5);}

  .action-btn{
    font-family:'Press Start 2P',monospace;font-weight:400;font-size:6.5px;letter-spacing:0;color:#eaf6ff;
    background:radial-gradient(circle at 35% 28%,var(--metal-lt),var(--metal-dk) 80%);
    border:none;border-radius:16px;aspect-ratio:1/1;padding:6px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 0 0 1px var(--arcaneglow), inset 0 0 10px rgba(125,255,179,.15);
    position:relative;
  }
  .action-btn::before{
    content:'';position:absolute;inset:-3px;z-index:-1;border-radius:18px;
    background:linear-gradient(160deg,var(--arcaneglow),var(--techglow));opacity:.55;filter:blur(3px);
  }
  .action-btn:active{transform:translateY(2px) scale(.97);box-shadow:0 0 0 1px var(--arcaneglow);}
  .action-btn:disabled{opacity:.3;filter:grayscale(.6);}
  .action-btn .ico{font-size:18px;filter:drop-shadow(0 0 4px rgba(125,255,179,.7));}
  .status-btn{
    grid-column:span 3;clip-path:none;aspect-ratio:auto;border-radius:14px;flex-direction:row;gap:8px;padding:11px;font-size:11px;
    box-shadow:0 0 0 1px var(--arcaneglow), inset 0 0 10px rgba(79,214,255,.12);
  }
  .status-btn::before{clip-path:none;border-radius:16px;}
  .status-btn .ico{font-size:16px;}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#0d0f16;border:1px solid #333;color:var(--ink);padding:9px 16px;border-radius:10px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(5,6,10,.7);display:flex;align-items:flex-start;justify-content:center;
    padding:20px;padding-top:max(20px, env(safe-area-inset-top));z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .modal{background:var(--shell);border-radius:20px;padding:20px;max-width:340px;width:100%;border:1px solid #000;
    box-shadow:0 20px 50px rgba(0,0,0,.6);max-height:calc(100vh - 40px);overflow-y:auto;-webkit-overflow-scrolling:touch;
    margin:auto 0;}
  .modal h3{margin:0 0 12px;font-family:'Press Start 2P',monospace;font-size:12px;color:var(--luz);}
  .modal-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);}
  .modal-row b{color:var(--ink);}
  .modal-row span{color:var(--muted);}
  .modal input[type=text]{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid #000;background:#11141c;color:var(--ink);
    font-family:'Nunito';font-weight:700;margin-top:8px;font-size:13px;
  }
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;}
  .close-x{background:none;border:none;box-shadow:none;color:var(--muted);font-size:20px;position:sticky;top:0;float:right;padding:0;z-index:5;}
  .modal{position:relative;}
  .gameover{text-align:center;}
  .gameover .ico{font-size:40px;}
  .footnote{font-size:10.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5;}
  .tabrow{display:flex;gap:8px;margin-bottom:14px;}
  .tabrow button{flex:1;padding:8px;}
  .tabrow button.active{background:linear-gradient(160deg,var(--luz),#2a9);color:#0a1712;}
  .vs{
    position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;
    margin-bottom:10px;padding:30px 10px 12px;border-radius:14px;min-height:120px;
    background:linear-gradient(180deg,#0d1b2a,#101f30 60%,#0b1622);
    border:1px solid rgba(125,255,179,.25);overflow:hidden;
  }
  .arena-hpbar{position:absolute;top:8px;width:40%;height:7px;border-radius:4px;background:#000;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.7);overflow:hidden;}
  .arena-hpbar.left{left:8px;}
  .arena-hpbar.right{right:8px;}
  .arena-hpbar .arena-hpfill{height:100%;transition:width .4s;}
  .arena-hpbar.left .arena-hpfill{background:linear-gradient(90deg,#5eff9e,#baffcf);}
  .arena-hpbar.right .arena-hpfill{background:linear-gradient(90deg,#ff5c5c,#ffb3b3);margin-left:auto;}
  .vs-badge{position:absolute;top:6px;left:50%;transform:translateX(-50%);
    font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);text-shadow:0 0 4px rgba(0,0,0,.8);}
  .fighter{flex:1;text-align:center;position:relative;z-index:2;}
  .battle-sprite-box{width:64px;height:64px;margin:0 auto 4px;border-radius:12px;overflow:hidden;background:#0a1712;border:1px solid rgba(125,255,179,.3);position:relative;}
  .battle-sprite-box canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
  .name-tag{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.72);color:#fff;padding:1px 6px;border-radius:6px;
    font-size:9px;font-weight:800;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;z-index:3;}
  .hit-shake{animation:hitShake .25s;}
  @keyframes hitShake{0%,100%{transform:translate(0,0);} 25%{transform:translate(-4px,2px);} 50%{transform:translate(4px,-2px);} 75%{transform:translate(-3px,-3px);}}
  .lunge-right{animation:lungeRight .5s cubic-bezier(.25,.1,.3,1);}
  .lunge-left{animation:lungeLeft .5s cubic-bezier(.25,.1,.3,1);}
  @keyframes lungeRight{
    0%{transform:translate(0,0) scale(1) rotate(0); filter:blur(0);}
    18%{transform:translate(-14px,3px) scale(.9) rotate(-6deg); filter:blur(0);}
    55%{transform:translate(54px,-10px) scale(1.22) rotate(8deg); filter:blur(2px);}
    72%{transform:translate(48px,-8px) scale(1.15) rotate(6deg); filter:blur(0);}
    100%{transform:translate(0,0) scale(1) rotate(0); filter:blur(0);}
  }
  @keyframes lungeLeft{
    0%{transform:translate(0,0) scale(1) rotate(0); filter:blur(0);}
    18%{transform:translate(14px,3px) scale(.9) rotate(6deg); filter:blur(0);}
    55%{transform:translate(-54px,-10px) scale(1.22) rotate(-8deg); filter:blur(2px);}
    72%{transform:translate(-48px,-8px) scale(1.15) rotate(-6deg); filter:blur(0);}
    100%{transform:translate(0,0) scale(1) rotate(0); filter:blur(0);}
  }
  .arena-shake{animation:arenaShake .35s;}
  @keyframes arenaShake{0%,100%{transform:translate(0,0);} 12%{transform:translate(-5px,4px);} 26%{transform:translate(5px,-4px);} 40%{transform:translate(-4px,4px);} 54%{transform:translate(4px,-3px);} 68%{transform:translate(-3px,2px);} 82%{transform:translate(2px,-1px);}}
  .special-glow .battle-sprite-box{animation:specialGlow .55s ease-out;}
  @keyframes specialGlow{0%{filter:brightness(1);box-shadow:none;} 50%{filter:brightness(1.9) saturate(1.6);box-shadow:0 0 22px 7px var(--arcaneglow);} 100%{filter:brightness(1);box-shadow:none;}}
  .defend-brace .battle-sprite-box{animation:defendBrace .4s ease-out;}
  @keyframes defendBrace{0%{transform:scale(1);} 40%{transform:scale(.88);box-shadow:inset 0 0 0 3px rgba(125,255,179,.7);} 100%{transform:scale(1);}}
  .arena-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;border-radius:inherit;
    animation:arenaFlash .28s ease-out forwards;}
  @keyframes arenaFlash{0%{opacity:0;} 25%{opacity:.6;} 100%{opacity:0;}}
  .clash-impact{position:absolute;top:50%;left:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;
    background:radial-gradient(circle,#fff,var(--arcaneglow) 45%,transparent 72%);z-index:21;pointer-events:none;
    animation:clashPop .4s ease-out forwards;}
  @keyframes clashPop{0%{opacity:0;transform:scale(.15);} 35%{opacity:1;transform:scale(1.5);} 100%{opacity:0;transform:scale(2.4);}}
  .dmg-float{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:900;font-size:17px;
    color:#ff5c5c;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;z-index:22;
    animation:dmgFloat .9s cubic-bezier(.2,.9,.3,1) forwards;}
  @keyframes dmgFloat{0%{opacity:0;transform:translate(-50%,10px) scale(.4);} 18%{opacity:1;transform:translate(-50%,-8px) scale(1.4);} 38%{transform:translate(-50%,-3px) scale(1);} 100%{opacity:0;transform:translate(-50%,-32px) scale(1);}}
  .type-badge{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;margin-top:2px;
    background:rgba(125,255,179,.15);color:var(--luz);border:1px solid rgba(125,255,179,.3);}
  .defeated-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .defeated-chip{font-size:10.5px;padding:5px 9px;border-radius:8px;background:rgba(157,77,255,.1);
    border:1px solid rgba(157,77,255,.3);cursor:pointer;color:var(--ink);}
  .fighter b{display:block;font-size:13px;}
  .fighter small{color:var(--muted);}
  .hpbar{height:10px;border-radius:5px;background:#000;margin-top:6px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);}
  .hpfill{height:100%;background:linear-gradient(90deg,#5eff9e,#baffcf);transition:width .4s;}

<script>
(function(){
  // =======================================================================
  // Esto es lo que tengo que rellenar si algún día alojo esto fuera de Claude
  // Si lo abro dentro de Claude no toco nada, usa su propio almacenamiento.
  // Si lo subo a mi hosting (Netlify, GitHub Pages...), pongo aquí los datos
  // de mi proyecto Firebase gratuito (ya lo tengo hecho, es el "vpet")
  // =======================================================================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyA9ugnLWynAjK4TpFnHwWW-BkXfo_ljWsA",
    authDomain: "vpet-77c73.firebaseapp.com",
    projectId: "vpet-77c73",
    storageBucket: "vpet-77c73.firebasestorage.app",
    messagingSenderId: "556197497383",
    appId: "1:556197497383:web:cbf509f199450fa04a9c02"
  };

  // ---------- cómo guardo los datos ----------
  // Dentro de Claude uso window.storage, ya viene separado por usuario solo.
  // Si lo tengo alojado fuera, uso Firestore + login anónimo: cada móvil o
  // navegador saca su propio uid, así mis datos nunca se mezclan entre
  // dispositivos. Lo "shared" (arena, ranking) sí lo ve todo el mundo,
  // igual que pasaba dentro de Claude.
  const CloudAdapter = (function(){
    const hasClaudeStorage = typeof window !== 'undefined' && !!window.storage;
    let fbReady = null;
    let uid = null;

    function initFirebase(){
      if(fbReady) return fbReady;
      fbReady = new Promise((resolve)=>{
        if(typeof firebase === 'undefined'){ resolve(false); return; }
        try{
          firebase.initializeApp(FIREBASE_CONFIG);
          const auth = firebase.auth();
          auth.onAuthStateChanged((user)=>{
            if(user){ uid = user.uid; resolve(true); }
            else { auth.signInAnonymously().catch(()=>resolve(false)); }
          });
        }catch(e){ console.error('Firebase no configurado o inválido:', e); resolve(false); }
      });
      return fbReady;
    }

    function docRef(db, key, shared){
      if(shared) return db.collection('shared_kv').doc(key);
      return db.collection('users').doc(uid).collection('data').doc(key);
    }

    async function get(key, shared){
      if(hasClaudeStorage){
        try{ return await window.storage.get(key, !!shared); }catch(e){ return null; }
      }
      const ok = await initFirebase();
      if(!ok) return null;
      const db = firebase.firestore();
      try{
        const doc = await docRef(db, key, shared).get();
        if(!doc.exists) return null;
        return { key, value: doc.data().value, shared: !!shared };
      }catch(e){ return null; }
    }

    async function set(key, value, shared){
      if(hasClaudeStorage){
        try{ return await window.storage.set(key, value, !!shared); }catch(e){ return null; }
      }
      const ok = await initFirebase();
      if(!ok) return null;
      const db = firebase.firestore();
      try{
        await docRef(db, key, shared).set({ value, updatedAt: Date.now() });
        return { key, value, shared: !!shared };
      }catch(e){ return null; }
    }

    return { get, set };
  })();

  // ---------- mi fondo procedural, distinto cada vez que abro la app ----------
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const bgSeed = Math.floor(Math.random()*4294967295);

  function drawBackground(){
    const w = window.innerWidth, h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    bgCanvas.width = w*dpr; bgCanvas.height = h*dpr;
    bgCtx.setTransform(dpr,0,0,dpr,0,0);

    const rand = mulberry32(bgSeed);
    const hue = Math.floor(rand()*360);
    const hue2 = (hue + 40 + Math.floor(rand()*60)) % 360;

    const sky = bgCtx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0, `hsl(${hue}, 45%, 9%)`);
    sky.addColorStop(1, `hsl(${hue2}, 55%, 4%)`);
    bgCtx.fillStyle = sky;
    bgCtx.fillRect(0,0,w,h);

    const blobCount = 4 + Math.floor(rand()*3);
    for(let i=0;i<blobCount;i++){
      const bx = rand()*w, by = rand()*h, br = (0.28+rand()*0.35)*Math.max(w,h);
      const bh = Math.floor(rand()*360);
      const grad = bgCtx.createRadialGradient(bx,by,0,bx,by,br);
      grad.addColorStop(0, `hsla(${bh},70%,50%,0.14)`);
      grad.addColorStop(1, `hsla(${bh},70%,50%,0)`);
      bgCtx.fillStyle = grad;
      bgCtx.fillRect(0,0,w,h);
    }

    bgCtx.strokeStyle = `hsla(${hue2}, 80%, 70%, 0.10)`;
    bgCtx.lineWidth = 1;
    const traceCount = 10 + Math.floor(rand()*8);
    for(let i=0;i<traceCount;i++){
      let x = rand()*w, y = rand()*h;
      bgCtx.beginPath();
      bgCtx.moveTo(x,y);
      const segments = 2+Math.floor(rand()*3);
      for(let s=0;s<segments;s++){
        if(rand()<0.5) x += (rand()-0.5)*180; else y += (rand()-0.5)*180;
        bgCtx.lineTo(x,y);
      }
      bgCtx.stroke();
      bgCtx.fillStyle = `hsla(${hue2}, 90%, 70%, 0.4)`;
      bgCtx.beginPath(); bgCtx.arc(x,y,2,0,Math.PI*2); bgCtx.fill();
    }

    const hexCount = 3+Math.floor(rand()*3);
    for(let i=0;i<hexCount;i++){
      const hx = rand()*w, hy = rand()*h, hr = 16+rand()*24;
      bgCtx.strokeStyle = `hsla(${hue}, 80%, 70%, 0.12)`;
      bgCtx.lineWidth = 1.2;
      bgCtx.beginPath();
      for(let k=0;k<6;k++){
        const ang = Math.PI/3*k;
        const px = hx+hr*Math.cos(ang), py = hy+hr*Math.sin(ang);
        if(k===0) bgCtx.moveTo(px,py); else bgCtx.lineTo(px,py);
      }
      bgCtx.closePath();
      bgCtx.stroke();
    }

    const starCount = Math.floor((w*h)/9000);
    for(let i=0;i<starCount;i++){
      const sx = rand()*w, sy = rand()*h, sr = rand()*1.4+0.3;
      bgCtx.fillStyle = `rgba(255,255,255,${0.15+rand()*0.5})`;
      bgCtx.beginPath(); bgCtx.arc(sx,sy,sr,0,Math.PI*2); bgCtx.fill();
    }
  }

  function spawnTwinkles(){
    const layer = document.getElementById('twinkleLayer');
    layer.innerHTML = '';
    const count = 22;
    for(let i=0;i<count;i++){
      const t = document.createElement('div');
      t.className='twinkle';
      t.style.left = (Math.random()*100)+'%';
      t.style.top = (Math.random()*100)+'%';
      t.style.animationDelay = (Math.random()*3.2)+'s';
      layer.appendChild(t);
    }
  }

  drawBackground();
  spawnTwinkles();
  let bgResizeT;
  window.addEventListener('resize', ()=>{ clearTimeout(bgResizeT); bgResizeT=setTimeout(drawBackground, 200); });

  const STORAGE_KEY = 'bytemon:pet';
  const GRID = 24;
  const screenCanvas = document.getElementById('screen');
  let canvas = screenCanvas;
  let ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  let cell = canvas.width / GRID;
  let cinematicActive = false;
  function useCanvas(c){
    canvas = c; ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false; cell = c.width / GRID;
  }
  function useScreenCanvas(){ useCanvas(screenCanvas); }

  // ---------- mis sonidos, los genero yo mismo con osciladores (nada de archivos de audio) ----------
  let audioCtx = null;
  let soundOn = true;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); }
  }
  function beep(freq, duration, type, delay, peakGain){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay||0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peakGain!==undefined?peakGain:0.15, t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+duration+0.03);
  }
  function sfx(name){
    if(!soundOn) return;
    ensureAudio();
    if(!audioCtx) return;
    switch(name){
      case 'tap':     beep(700,0.05,'square',0,0.07); break;
      case 'feed':    beep(520,0.09,'square',0); beep(760,0.09,'square',0.08); break;
      case 'play':    beep(600,0.07,'square',0); beep(760,0.07,'square',0.08); beep(940,0.09,'square',0.16); break;
      case 'clean':   beep(300,0.12,'sawtooth',0,0.08); beep(520,0.1,'sawtooth',0.08,0.08); break;
      case 'sleep':   beep(520,0.12,'sine',0,0.08); beep(360,0.18,'sine',0.1,0.08); break;
      case 'wake':    beep(360,0.1,'sine',0,0.08); beep(560,0.14,'sine',0.09,0.08); break;
      case 'heal':    beep(700,0.08,'triangle',0); beep(900,0.08,'triangle',0.08); beep(1100,0.12,'triangle',0.16); break;
      case 'hatch':   beep(500,0.1,'square',0); beep(700,0.1,'square',0.1); beep(950,0.18,'square',0.2); break;
      case 'evolve':  beep(400,0.1,'square',0); beep(600,0.1,'square',0.1); beep(800,0.1,'square',0.2); beep(1050,0.22,'square',0.3); break;
      case 'mistake': beep(220,0.16,'sawtooth',0,0.09); break;
      case 'hit':     beep(150,0.1,'square',0,0.12); break;
      case 'win':     beep(600,0.1,'square',0); beep(800,0.1,'square',0.1); beep(1000,0.1,'square',0.2); beep(1300,0.22,'square',0.3); break;
      case 'lose':    beep(500,0.15,'sawtooth',0); beep(380,0.15,'sawtooth',0.15); beep(260,0.28,'sawtooth',0.3); break;
      case 'death':   beep(300,0.2,'sawtooth',0); beep(200,0.2,'sawtooth',0.2); beep(120,0.38,'sawtooth',0.4); break;
    }
  }

  const STAGE_NAMES = ['HUEVO','CRÍA','PEQUEÑO','JOVEN','PERFECTO','SUPREMO'];
  const PATH_LABEL = {luz:'SENDA: LUZ', sombra:'SENDA: SOMBRA', equilibrio:'SENDA: EQUILIBRIO'};
  const PATH_COLOR = {luz:'#5eff9e', sombra:'#ff4d8d', equilibrio:'#ffb84d'};
  // ---------- generador de especies (mi PRNG con semilla, para que cada mascota sea consistente) ----------
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const SYLLABLES = {
    luz:        ['Ae','Vel','Ser','Lir','Or','Wyn','Ith','Cel','Ael','Nyra','Sol','Ily'],
    sombra:     ['Fang','Grim','Vex','Drak','Nox','Krev','Zhul','Morg','Ash','Rax','Vor','Sker'],
    equilibrio: ['Tan','Kai','Doro','Bal','Sen','Mira','Tazu','Ren','Vio','Tol','Nim','Quor']
  };
  function proceduralName(path, temperament, seed){
    const rand = mulberry32(seed);
    const pool = SYLLABLES[path];
    const preferLong = temperament==='Tranquilo';
    const count = rand() < (preferLong ? 0.4 : 0.7) ? 2 : 3;
    let parts=[], last=null;
    for(let i=0;i<count;i++){
      let s;
      do{ s = pool[Math.floor(rand()*pool.length)]; } while(s===last && pool.length>1);
      parts.push(s.toLowerCase());
      last = s;
    }
    let name = parts.join('');
    return name.charAt(0).toUpperCase()+name.slice(1);
  }
  function speciesDisplay(pet){
    if(!pet.speciesName) return STAGE_NAMES[pet.stage];
    if(pet.stage===4) return pet.speciesName+' Mayor';
    if(pet.stage===5) return pet.speciesName+' Supremo';
    return pet.speciesName;
  }
  function seedFromString(str){
    let h=0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i))|0; }
    return h>>>0;
  }
  function previewSnapshot(senda, affinity, temperament){
    const seed = seedFromString(senda+'|'+affinity+'|'+temperament);
    const rand = mulberry32(seed);
    const w = AFFINITY_WEIGHTS[affinity] || AFFINITY_WEIGHTS.equilibrado;
    return {
      stage:3, frame:0, sick:false, sleeping:false, temperament, path:senda,
      hue: Math.floor(rand()*360),
      bodyShape: weightedPick(rand, EVO_SHAPE_OPTS, w.shape),
      featureType: weightedPick(rand, EVO_FEAT_OPTS, w.feat),
      eyeStyle: ['redondos','rasgados','ciclope','trio'][Math.floor(rand()*4)],
      pattern: ['liso','manchas','rayas','estrellado'][Math.floor(rand()*4)],
      bgSeed: seed+999
    };
  }

  const AGE_HATCH = 3;
  const LEVEL_CHILD = 3;
  const LEVEL_ADULT = 8;
  const LEVEL_PERFECT = 15;
  const LEVEL_ULTIMATE = 25;
  const TICK_MS = 4000;
  const SICK_DEATH_TICKS = 14;

  function freshPet(){
    return {
      name:'Compi', stage:0, path:null,
      sac:80, happy:80, energy:80, health:100, hyg:100,
      poops:0, poopTimer:0,
      age:0, mistakes:0, sick:false, sickTicks:0, sleeping:false, alive:true,
      sumHappy:0, sumSac:0, sumHyg:0, ticks:0,
      lastMistakeFlags:{sac:false,happy:false,hyg:false},
      temperament:null, feedCount:0, playCount:0, speciesName:null,
      empachoTicks:0, activeEffects:[],
      speciesSeed:null, hue:0, bodyShape:'redondo', featureType:'alas', eyeStyle:'redondos', pattern:'liso',
      level:1, xp:0, xpNext:10, stats:{atq:5, def:5, mag:5, res:5, vel:5}, affinity:null,
      bgSeed: Math.floor(Math.random()*4294967295),
      dungeonFloor:1, dungeonDefeated:[],
      lastSaved: Date.now(), frame:0
    };
  }

  let pet = freshPet();
  let hasLoaded = false;

  async function loadPet(){
    try{
      const res = await CloudAdapter.get(STORAGE_KEY, false);
      if(res && res.value){
        const loaded = JSON.parse(res.value);
        pet = Object.assign(freshPet(), loaded);
        catchUp();
      }
    }catch(e){ /* no había mascota guardada, me quedo con el huevo nuevo */ }
    hasLoaded = true;
    render();
  }

  async function savePet(){
    pet.lastSaved = Date.now();
    try{ await CloudAdapter.set(STORAGE_KEY, JSON.stringify(pet), false); }catch(e){ /* si falla el guardado no pasa nada, lo intento en el siguiente tick */ }
  }

  function catchUp(){
    if(!pet.alive) return;
    const elapsedMs = Date.now() - (pet.lastSaved || Date.now());
    let missedTicks = Math.floor(elapsedMs / TICK_MS);
    missedTicks = Math.max(0, Math.min(missedTicks, 60));
    for(let i=0;i<missedTicks;i++){ tick(false); }
  }

  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function computePath(){
    const avgHappy = pet.ticks ? pet.sumHappy/pet.ticks : pet.happy;
    if(pet.mistakes <= 2 && avgHappy >= 70) return 'luz';
    if(pet.mistakes >= 6 || avgHappy < 40) return 'sombra';
    return 'equilibrio';
  }

  function weightedPick(rand, options, weights){
    const total = weights.reduce((a,b)=>a+b,0);
    let r = rand()*total;
    for(let i=0;i<options.length;i++){
      r -= weights[i];
      if(r<=0) return options[i];
    }
    return options[options.length-1];
  }

  function snapshotVisual(p){
    return {stage:p.stage, frame:0, sick:false, sleeping:false, temperament:p.temperament, path:p.path,
      hue:p.hue, bodyShape:p.bodyShape, featureType:p.featureType, eyeStyle:p.eyeStyle, pattern:p.pattern, bgSeed:p.bgSeed};
  }

  function checkEvolution(){
    if(pet.stage===0 && pet.age>=AGE_HATCH){
      const pre = snapshotVisual(pet);
      pet.stage=1;
      const post = snapshotVisual(pet);
      sfx('hatch');
      playEvolutionCinematic(pre, post, '¡Ha nacido!', pet.name+' ha eclosionado del huevo.');
    }
    else if(pet.stage===1 && pet.level>=LEVEL_CHILD){
      const pre = snapshotVisual(pet);
      pet.temperament = pet.playCount > pet.feedCount ? 'Activo' : 'Tranquilo';
      pet.stage=2;
      const post = snapshotVisual(pet);
      sfx('evolve');
      playEvolutionCinematic(pre, post, '¡Evolución!', pet.name+' ha crecido — temperamento '+pet.temperament);
    }
    else if(pet.stage===2 && pet.level>=LEVEL_ADULT){
      const pre = snapshotVisual(pet);
      pet.path = computePath();
      pet.affinity = computeAffinity();
      pet.speciesSeed = Math.floor(Math.random()*4294967295);
      pet.speciesName = proceduralName(pet.path, pet.temperament, pet.speciesSeed);
      const rand2 = mulberry32(pet.speciesSeed+1);
      pet.hue = Math.floor(rand2()*360);

      const w = AFFINITY_WEIGHTS[pet.affinity] || AFFINITY_WEIGHTS.equilibrado;
      pet.bodyShape = weightedPick(rand2, EVO_SHAPE_OPTS, w.shape);
      pet.featureType = weightedPick(rand2, EVO_FEAT_OPTS, w.feat);
      pet.eyeStyle = ['redondos','rasgados','ciclope','trio'][Math.floor(rand2()*4)];
      pet.pattern = ['liso','manchas','rayas','estrellado'][Math.floor(rand2()*4)];
      pet.stage=3;
      const post = snapshotVisual(pet);
      sfx('evolve');
      playEvolutionCinematic(pre, post, '¡Digievolución!', pet.speciesName+' — '+PATH_LABEL[pet.path]);
    }
    else if(pet.stage===3 && pet.level>=LEVEL_PERFECT){
      const pre = snapshotVisual(pet);
      pet.stage=4;
      const post = snapshotVisual(pet);
      sfx('evolve');
      playEvolutionCinematic(pre, post, '¡Forma Perfecta!', speciesDisplay(pet));
    }
    else if(pet.stage===4 && pet.level>=LEVEL_ULTIMATE){
      const pre = snapshotVisual(pet);
      pet.stage=5;
      const post = snapshotVisual(pet);
      sfx('evolve');
      playEvolutionCinematic(pre, post, '¡Forma Suprema!', speciesDisplay(pet));
    }
  }

  function renderSnapshotToCurrentCanvas(snap){
    if(snap.stage===0) drawEgg(0, snap.bgSeed);
    else drawCreature(snap);
  }

  async function playEvolutionCinematic(pre, post, title, subtitle){
    cinematicActive = true;
    const flash = document.getElementById('cineFlash');
    const el = document.createElement('div');
    el.className = 'cine-backdrop';
    el.id = 'evoCinematic';
    el.innerHTML = `
      <div class="cine-box" id="cineBox"><canvas id="cineCanvas" width="480" height="480"></canvas></div>
      <div class="cine-title" id="cineTitle">${title}</div>
      <div class="cine-sub" id="cineSub">${subtitle}</div>
      <button class="status-btn action-btn" id="cineContinue">Continuar</button>
    `;
    document.getElementById('modalRoot').appendChild(el);
    refreshScrollLock();
    requestAnimationFrame(()=>el.classList.add('show'));

    const cineCanvas = document.getElementById('cineCanvas');
    useCanvas(cineCanvas);
    const box = document.getElementById('cineBox');

    renderSnapshotToCurrentCanvas(pre);
    box.classList.add('shake');
    await sleep(900);

    flash.classList.add('on');
    await sleep(140);
    box.classList.remove('shake');
    flash.classList.remove('on');

    renderSnapshotToCurrentCanvas(post);
    box.classList.add('reveal');
    document.getElementById('cineTitle').classList.add('show');
    await sleep(200);
    document.getElementById('cineSub').classList.add('show');
    await sleep(1000);
    const contBtn = document.getElementById('cineContinue');
    contBtn.classList.add('show');

    await new Promise(resolve=>{ contBtn.onclick = ()=>{ sfx('tap'); resolve(); }; });

    el.classList.remove('show');
    await sleep(350);
    el.remove();
    useScreenCanvas();
    cinematicActive = false;
    refreshScrollLock();
    render();
  }

  const STAT_KEYS = ['atq','def','mag','res','vel'];
  const EVO_SHAPE_OPTS = ['redondo','anguloso','alargado','compacto'];
  const EVO_FEAT_OPTS = ['alas','cuernos','orejas','aletas','antenas','pinchos'];
  const AFFINITY_WEIGHTS = {
    atq:        { shape:[1,2.2,0.6,1.6], feat:[0.5,2.2,0.8,1,0.5,2] },
    def:        { shape:[1.4,0.8,0.5,2.2], feat:[0.5,1,2,2,0.5,1.4] },
    mag:        { shape:[1.6,0.5,2,0.6], feat:[2.2,0.5,0.8,0.6,2.2,0.5] },
    res:        { shape:[2,0.6,0.8,1.4], feat:[1.4,0.6,2.2,1,1,0.6] },
    vel:        { shape:[1,0.6,2.2,0.8], feat:[2,0.5,0.6,1.4,2,0.5] },
    equilibrado:{ shape:[1,1,1,1], feat:[1,1,1,1,1,1] }
  };
  const STAT_LABEL = {atq:'Ataque', def:'Defensa', mag:'Magia', res:'Resistencia', vel:'Velocidad'};
  function gainXp(amount){
    if(pet.stage===0 || !pet.alive) return;
    pet.xp += amount;
    while(pet.xp >= pet.xpNext){
      pet.xp -= pet.xpNext;
      pet.level += 1;
      pet.xpNext = Math.round(pet.xpNext*1.35 + 5);
      const gains = STAT_KEYS.map(k=>{
        const up = 1+Math.floor(Math.random()*4);
        pet.stats[k] += up;
        return up;
      });
      const best = STAT_KEYS.reduce((a,b,i)=>gains[i]>gains[STAT_KEYS.indexOf(a)]?b:a, STAT_KEYS[0]);
      showToast('¡'+pet.name+' subió a nivel '+pet.level+'! ('+STAT_LABEL[best]+' +'+gains[STAT_KEYS.indexOf(best)]+')');
    }
  }
  function computeAffinity(){
    const s = pet.stats;
    let best = STAT_KEYS[0];
    STAT_KEYS.forEach(k=>{ if(s[k]>s[best]) best=k; });
    const tiedTop = STAT_KEYS.filter(k=>s[k]===s[best]);
    return tiedTop.length>1 ? 'equilibrado' : best;
  }

  function tick(doRender){
    if(!pet.alive) return;
    pet.age += 1;
    pet.ticks += 1;
    pet.sumHappy += pet.happy;
    pet.sumSac += pet.sac;
    pet.sumHyg += pet.hyg;

    if(pet.stage>0){
      if(pet.sleeping){
        pet.energy = clamp(pet.energy + 6);
        pet.sac = clamp(pet.sac - 1);
        pet.happy = clamp(pet.happy - 1);
        pet.activeEffects = [];
      } else {
        const isEmpacho = pet.empachoTicks>0;
        const isLetargo = pet.energy<=5;
        const isRacha = pet.sac>60 && pet.happy>60 && pet.hyg>60 && pet.health>=80;

        // el hambre y el ánimo casi no bajan: solo se mueven de verdad cada 3 turnos
        if(pet.ticks % 3 === 0 || isLetargo){
          const sacDecay = 1 + (isLetargo?2:0);
          const happyDecay = 1 + (isEmpacho?2:0) + (isLetargo?1:0) - (isRacha?3:0);
          pet.sac = clamp(pet.sac - sacDecay);
          pet.happy = clamp(pet.happy - happyDecay);
        }
        if(pet.ticks % 2 === 0){ pet.energy = clamp(pet.energy - 1); }
        if(isRacha){ pet.health = clamp(pet.health + 2); }
        if(pet.empachoTicks>0){ pet.empachoTicks--; }

        pet.activeEffects = [];
        if(isEmpacho) pet.activeEffects.push('empacho');
        if(isLetargo) pet.activeEffects.push('letargo');
        if(isRacha) pet.activeEffects.push('racha');
      }

      if(pet.poopTimer>0){
        pet.poopTimer -= 1;
        if(pet.poopTimer===0 && pet.poops<4){ pet.poops += 1; }
      }
      pet.hyg = clamp(100 - pet.poops*14);

      // aquí cuento los fallos de cuidado, solo una vez cada vez que la barra toca fondo
      const flags = pet.lastMistakeFlags;
      if(pet.sac<=0 && !flags.sac){ pet.mistakes++; pet.health=clamp(pet.health-10); flags.sac=true; sfx('mistake'); }
      if(pet.sac>10) flags.sac=false;
      if(pet.happy<=0 && !flags.happy){ pet.mistakes++; pet.health=clamp(pet.health-10); flags.happy=true; sfx('mistake'); }
      if(pet.happy>10) flags.happy=false;
      if(pet.hyg<=0 && !flags.hyg){ pet.mistakes++; pet.health=clamp(pet.health-10); flags.hyg=true; sfx('mistake'); }
      if(pet.hyg>10) flags.hyg=false;

      if(pet.health<=0 && !pet.sick){ pet.sick=true; pet.sickTicks=0; }
      if(pet.sick){
        pet.sickTicks++;
        if(pet.sickTicks>=SICK_DEATH_TICKS){
          pet.alive=false;
          sfx('death');
        }
      }
    }
    checkEvolution();

    if(doRender!==false){ render(); savePet(); }
  }

  // ---------- aquí dibujo el bicho en pixel art ----------
  function px(gx,gy,color,w,h){
    w=w||1; h=h||1;
    ctx.fillStyle=color;
    ctx.fillRect(Math.round(gx*cell), Math.round(gy*cell), Math.ceil(w*cell), Math.ceil(h*cell));
  }
  function ellipseCells(cx,cy,rx,ry){
    const out=[];
    for(let gy=Math.floor(cy-ry-1);gy<=Math.ceil(cy+ry+1);gy++){
      for(let gx=Math.floor(cx-rx-1);gx<=Math.ceil(cx+rx+1);gx++){
        const dx=(gx-cx)/rx, dy=(gy-cy)/ry;
        if(dx*dx+dy*dy<=1) out.push([gx,gy]);
      }
    }
    return out;
  }

  function palette(stage, hue){
    if(stage<=2){ return {body:'#8fe3a0', belly:'#eafff0', dark:'#4fae6c', accent:'#c8ffd6'}; }
    const h = hue||0;
    return {
      body:  `hsl(${h}, 68%, 62%)`,
      belly: `hsl(${h}, 55%, 87%)`,
      dark:  `hsl(${h}, 60%, 30%)`,
      accent:`hsl(${(h+35)%360}, 75%, 65%)`
    };
  }

  function drawSceneBackground(seed){
    const rand = mulberry32(seed||1);
    const roll = rand();
    if(roll<0.25){
      // día
      const sky = ctx.createLinearGradient(0,0,0,canvas.height);
      sky.addColorStop(0,'#8fd8ff'); sky.addColorStop(1,'#cdeeff');
      ctx.fillStyle=sky; ctx.fillRect(0,0,canvas.width,canvas.height);
      px(19,3,'#ffe066',3,3);
      px(3,4,'#ffffff',3.4,1.2); px(4.4,3.2,'#ffffff',2.2,1);
      px(9,6,'#ffffff',2.6,1);
      ctx.fillStyle='#6fbf6f'; ctx.fillRect(0, canvas.height-cell*3, canvas.width, cell*3);
    } else if(roll<0.5){
      // noche
      const sky = ctx.createLinearGradient(0,0,0,canvas.height);
      sky.addColorStop(0,'#0b1330'); sky.addColorStop(1,'#1b2550');
      ctx.fillStyle=sky; ctx.fillRect(0,0,canvas.width,canvas.height);
      px(19,4,'#fff6d8',3,3);
      for(let i=0;i<14;i++){ px(1+rand()*21, 1+rand()*11, `rgba(255,255,255,${0.35+rand()*0.5})`, 0.6,0.6); }
      ctx.fillStyle='#101a2b'; ctx.fillRect(0, canvas.height-cell*3, canvas.width, cell*3);
    } else if(roll<0.75){
      // espacio
      const sky = ctx.createLinearGradient(0,0,0,canvas.height);
      sky.addColorStop(0,'#1a0f2e'); sky.addColorStop(1,'#0a0714');
      ctx.fillStyle=sky; ctx.fillRect(0,0,canvas.width,canvas.height);
      const hue=Math.floor(rand()*360);
      px(4,5,`hsl(${hue},60%,55%)`,5,5);
      ctx.strokeStyle=`hsl(${hue},60%,75%)`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse((4+2.5)*cell,(5+2.5)*cell, 5*cell,1.6*cell,-0.4,0,Math.PI*2); ctx.stroke();
      for(let i=0;i<18;i++){ px(1+rand()*21, 1+rand()*21, `rgba(255,255,255,${0.25+rand()*0.5})`, 0.5,0.5); }
    } else {
      // cuadrícula digital
      ctx.fillStyle='#04120c'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle='rgba(94,255,158,0.15)'; ctx.lineWidth=1;
      for(let gx=0; gx<=24; gx+=3){ ctx.beginPath(); ctx.moveTo(gx*cell,0); ctx.lineTo(gx*cell,canvas.height); ctx.stroke(); }
      for(let gy=0; gy<=24; gy+=3){ ctx.beginPath(); ctx.moveTo(0,gy*cell); ctx.lineTo(canvas.width,gy*cell); ctx.stroke(); }
      for(let i=0;i<9;i++){ const gx=Math.floor(rand()*24); px(gx, rand()*22, 'rgba(94,255,158,0.5)', 0.6, 2+rand()*3); }
    }
  }

  function drawEgg(frame, bgSeed){
    const cx=12, cy=13;
    drawSceneBackground(bgSeed);
    const cells = ellipseCells(cx,cy,5.2,6.6);
    cells.forEach(([gx,gy])=>px(gx,gy,'#fff3d6'));
    // manchitas del cascarón
    const spots=[[cx-2,cy-3],[cx+2,cy-1],[cx-1,cy+3],[cx+3,cy+2]];
    spots.forEach(([gx,gy])=>px(gx,gy,'#ffd98a',1.3,1.3));
    // grieta que aparece cuando ya casi va a eclosionar
    if(frame%2===0){
      px(cx-0.5,cy-4,'#caa15a'); px(cx,cy-3,'#caa15a'); px(cx+0.7,cy-2,'#caa15a');
    }
    // la sombrita en el suelo, para que no parezca que flota
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(cx*cell, (cy+7)*cell, 5*cell,1.1*cell,0,0,Math.PI*2); ctx.fill();
  }

  function drawCreature(pet){
    const {stage, frame, sick, sleeping, temperament} = pet;
    drawSceneBackground(pet.bgSeed);
    const cx=12, cy=13.5;
    const sizes = {1:[4.6,4.2],2:[5.6,5.0],3:[6.8,6.2],4:[7.8,7.2],5:[8.8,8.2]};
    let [rx,ry] = sizes[stage];
    if(stage>=3){
      const shape = pet.bodyShape||'redondo';
      if(shape==='anguloso'){ rx*=0.92; ry*=1.08; }
      else if(shape==='alargado'){ rx*=0.8; ry*=1.28; }
      else if(shape==='compacto'){ rx*=1.18; ry*=0.82; }
    }
    const pal = palette(stage, pet.hue);
    const bob = (frame%8<4)?0:0.4;
    const bcy = cy+bob;

    ctx.filter = sick? 'saturate(0.35) brightness(0.85)' : 'none';

    // otra vez la sombrita del suelo, pero pegada al bicho ya crecido
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(cx*cell, (cy+ry+2)*cell, (rx*0.9)*cell,1.1*cell,0,0,Math.PI*2); ctx.fill();

    // esto va detrás del cuerpo: el rasgo que le tocó a esta especie, no depende de la senda
    if(stage>=3){
      const featScale = stage===3?1:(stage===4?1.35:1.7);
      const feat = pet.featureType||'alas';
      if(feat==='alas') drawWings(cx,bcy,rx,ry,featScale,pal.accent);
      else if(feat==='cuernos') drawHorns(cx,bcy,rx,ry,featScale,pal.accent);
      else if(feat==='orejas') drawEars(cx,bcy,rx,ry,featScale,pal.accent);
      else if(feat==='aletas') drawFins(cx,bcy,rx,ry,featScale,pal.accent);
      else if(feat==='antenas') drawAntennas(cx,bcy,rx,ry,featScale,pal.accent);
      else if(feat==='pinchos') drawSpikes(cx,bcy,rx,ry,featScale,pal.accent);
    }

    // el cuerpo
    ellipseCells(cx,bcy,rx,ry).forEach(([gx,gy])=>px(gx,gy,pal.body));
    // la barriguita más clara
    ellipseCells(cx,bcy+ry*0.28,rx*0.62,ry*0.5).forEach(([gx,gy])=>px(gx,gy,pal.belly));
    // el patrón propio de esta especie (liso, manchas, rayas o estrellado), desde Joven en adelante
    if(stage>=3 && pet.pattern && pet.pattern!=='liso'){
      drawPattern(cx,bcy,rx,ry,pet.pattern,pal.dark);
    }

    // patitas cortas, desde que es Pequeño en adelante
    if(stage>=2 && stage<=2){
      px(cx-rx*0.55,bcy+ry*0.85,pal.dark,1.4,1.1);
      px(cx+rx*0.15,bcy+ry*0.85,pal.dark,1.4,1.1);
    }
    if(stage>=3){
      px(cx-rx*0.55,bcy+ry*0.9,pal.dark,1.6,1.3);
      px(cx+rx*0.2,bcy+ry*0.9,pal.dark,1.6,1.3);
    }

    // en Supremo le añado el aura de chispas y la coronita
    if(stage===5){
      const spark = pal.accent;
      const sparklePts = [[cx-rx-1.5,bcy-2],[cx+rx+1,bcy-3],[cx-rx-0.5,bcy+3],[cx+rx+1.5,bcy+2],[cx-2,bcy-ry-2.5],[cx+3,bcy-ry-2]];
      sparklePts.forEach(([gx,gy])=>{ if((frame+Math.round(gx))%6<3) px(gx,gy,spark,0.9,0.9); });
      px(cx-1.6,bcy-ry-1.2,pal.accent,3.2,0.9);
      px(cx-0.7,bcy-ry-2,pal.accent,1.4,0.9);
    }

    // los ojos, con el estilo propio de esta especie
    const eyeStyle = stage>=3 ? (pet.eyeStyle||'redondos') : 'redondos';
    const eyeY = bcy - ry*0.12;
    const eyeDX = eyeStyle==='ciclope' ? 0 : rx*0.42;
    if(sleeping){
      if(eyeStyle==='ciclope'){ px(cx-0.8,eyeY,'#1a2620',1.6,0.5); }
      else{ px(cx-eyeDX-0.6,eyeY,'#1a2620',1.6,0.5); px(cx+eyeDX-0.6,eyeY,'#1a2620',1.6,0.5); }
      ctx.fillStyle='#dfeee6';
      ctx.font='700 22px monospace';
      ctx.fillText('Z', (cx+rx+1)*cell, (bcy-ry-2+((frame%16<8)?0:-1))*cell);
    } else if(sick){
      // ojos huecos/mareados, para cuando está enfermo
      px(cx-eyeDX-0.6,eyeY-0.6,'#1a2620',1.6,1.6);
      px(cx-eyeDX-0.1,eyeY-0.1,pal.body,0.6,0.6);
      px(cx+eyeDX-0.6,eyeY-0.6,'#1a2620',1.6,1.6);
      px(cx+eyeDX-0.1,eyeY-0.1,pal.body,0.6,0.6);
    } else {
      const blink = frame%20>=18;
      const eh = blink?0.4:1.5;
      if(eyeStyle==='ciclope'){
        px(cx-1.1,eyeY+(2.2-eh)/2,'#1a2620',2.2,eh+0.7);
      } else if(eyeStyle==='rasgados'){
        px(cx-eyeDX-0.4,eyeY+(1.5-eh)/2,'#1a2620',1.1,eh);
        px(cx+eyeDX-0.8,eyeY+(1.5-eh)/2,'#1a2620',1.1,eh);
      } else if(eyeStyle==='trio'){
        px(cx-eyeDX-0.6,eyeY+(1.5-eh)/2,'#1a2620',1.4,eh);
        px(cx+eyeDX-0.6,eyeY+(1.5-eh)/2,'#1a2620',1.4,eh);
        px(cx-0.5,eyeY+ry*0.35,'#1a2620',1.0,eh*0.7);
      } else {
        px(cx-eyeDX-0.6,eyeY+(1.5-eh)/2,'#1a2620',1.6,eh);
        px(cx+eyeDX-0.6,eyeY+(1.5-eh)/2,'#1a2620',1.6,eh);
      }
    }

    // la boquita
    if(!sleeping){
      px(cx-0.7,bcy+ry*0.42,'#1a2620',1.4,0.5);
    }

    // el detallito del temperamento, desde que es Pequeño
    if(stage>=2 && temperament){
      const mx = cx+rx*0.55, my = bcy-ry-1.4;
      if(temperament==='Activo'){
        px(mx,my,'#ffe066',0.8,0.8); px(mx-0.6,my+0.7,'#ffe066',0.7,0.7); px(mx+0.5,my+1.1,'#ffe066',0.6,0.6);
      } else {
        px(mx,my,'#bfe8ff',0.9,0.9); px(mx-0.3,my+0.8,'#bfe8ff',0.6,0.6);
      }
    }

    ctx.filter='none';
  }

  function drawWings(cx,cy,rx,ry,scale,color){
    const w=1.6*scale, h=3.2*scale;
    px(cx-rx-w*0.9, cy-h*0.3, color, w, h*0.5);
    px(cx-rx-w*0.5, cy-h*0.55, color, w*0.7, h*0.4);
    px(cx+rx-w*0.1, cy-h*0.3, color, w, h*0.5);
    px(cx+rx+w*0.35, cy-h*0.55, color, w*0.7, h*0.4);
  }
  function drawHorns(cx,cy,rx,ry,scale,color){
    const h=2.6*scale;
    px(cx-rx*0.55,cy-ry-h,color,1.1,h);
    px(cx-rx*0.55-0.4,cy-ry-h*0.5,color,0.7,h*0.5);
    px(cx+rx*0.45,cy-ry-h,color,1.1,h);
    px(cx+rx*0.45+0.4,cy-ry-h*0.5,color,0.7,h*0.5);
  }
  function drawEars(cx,cy,rx,ry,scale,color){
    const r=1.5*scale;
    ellipseCells(cx-rx*0.65,cy-ry*0.85,r*0.6,r).forEach(([gx,gy])=>px(gx,gy,color));
    ellipseCells(cx+rx*0.65,cy-ry*0.85,r*0.6,r).forEach(([gx,gy])=>px(gx,gy,color));
  }
  function drawFins(cx,cy,rx,ry,scale,color){
    const w=1.3*scale, h=2.2*scale;
    px(cx-rx-w*0.7, cy+ry*0.1, color, w, h*0.5);
    px(cx-rx-w*0.3, cy+ry*0.5, color, w*0.6, h*0.4);
    px(cx+rx-w*0.3, cy+ry*0.1, color, w, h*0.5);
    px(cx+rx-w*0.3+w*0.3, cy+ry*0.5, color, w*0.6, h*0.4);
    px(cx-0.6, cy-ry-h*0.6, color, 1.2, h*0.7);
  }
  function drawAntennas(cx,cy,rx,ry,scale,color){
    const h=2.8*scale;
    px(cx-rx*0.4-0.2, cy-ry-h, color, 0.5, h);
    px(cx-rx*0.4-0.6, cy-ry-h-0.7, color, 1.2, 1.2);
    px(cx+rx*0.4-0.3, cy-ry-h*0.8, color, 0.5, h*0.8);
    px(cx+rx*0.4-0.7, cy-ry-h*0.8-0.7, color, 1.2, 1.2);
  }
  function drawSpikes(cx,cy,rx,ry,scale,color){
    const n=3, s=1.3*scale;
    for(let i=0;i<n;i++){
      const gx = cx - rx*0.5 + i*(rx*0.5);
      px(gx, cy-ry-s*(1-i*0.15), color, s*0.7, s*(1+i*0.15));
    }
  }
  function drawPattern(cx,cy,rx,ry,pattern,color){
    if(pattern==='manchas'){
      const spots=[[cx-rx*0.35,cy-ry*0.15],[cx+rx*0.3,cy-ry*0.3],[cx-rx*0.1,cy+ry*0.3],[cx+rx*0.35,cy+ry*0.05]];
      spots.forEach(([gx,gy])=>px(gx,gy,color,1,1));
    } else if(pattern==='rayas'){
      for(let i=-1;i<=1;i++){ px(cx+i*rx*0.4-0.25, cy-ry*0.55, color, 0.5, ry*1.05); }
    } else if(pattern==='estrellado'){
      const flecks=[[cx-rx*0.5,cy-ry*0.4],[cx+rx*0.2,cy-ry*0.55],[cx-rx*0.2,cy+ry*0.1],[cx+rx*0.45,cy+ry*0.25],[cx-rx*0.05,cy-ry*0.05],[cx+rx*0.05,cy+ry*0.45]];
      flecks.forEach(([gx,gy])=>px(gx,gy,color,0.5,0.5));
    }
  }

  function render(){
    if(!hasLoaded || cinematicActive) return;
    document.getElementById('hudName').textContent = pet.name.toUpperCase();
    document.getElementById('hudStage').textContent = speciesDisplay(pet);
    document.getElementById('ageBadge').textContent = 'Edad: '+pet.age+'h · Nv.'+pet.level;
    const led = document.getElementById('statusLed');
    if(!pet.alive){ led.style.background='#666'; led.style.boxShadow='0 0 5px 1px #666'; }
    else if(pet.sick){ led.style.background='var(--danger)'; led.style.boxShadow='0 0 5px 1px var(--danger)'; }
    else if(pet.sleeping){ led.style.background='#5ec8ff'; led.style.boxShadow='0 0 5px 1px #5ec8ff'; }
    else { led.style.background='var(--luz)'; led.style.boxShadow='0 0 5px 1px var(--luz)'; }
    const tag = document.getElementById('pathTag');
    if(pet.path){ tag.textContent = PATH_LABEL[pet.path]; tag.style.setProperty('--tagcolor', PATH_COLOR[pet.path]); document.getElementById('glowring').style.setProperty('--glow', PATH_COLOR[pet.path]+'55'); }
    else { tag.textContent=''; document.getElementById('glowring').style.setProperty('--glow','transparent'); }

    document.getElementById('barSac').style.width = pet.sac+'%';
    document.getElementById('barHappy').style.width = pet.happy+'%';
    document.getElementById('barEnergy').style.width = pet.energy+'%';
    document.getElementById('barHealth').style.width = pet.health+'%';
    document.getElementById('barHyg').style.width = pet.hyg+'%';

    const EFFECT_LABEL = {empacho:'🤢 Empacho', letargo:'😩 Letargo', racha:'🌟 Racha de bienestar'};
    document.getElementById('effectsRow').innerHTML = (pet.activeEffects||[]).map(e=>
      `<span class="effect-chip effect-${e}">${EFFECT_LABEL[e]}</span>`).join('');

    const medBtn0 = document.getElementById('btnMed');
    if(medBtn0) medBtn0.disabled = !pet.sick;
    document.getElementById('btnSleep').querySelector('.ico').textContent = pet.sleeping ? '⏰' : '😴';
    document.getElementById('btnSleep').lastChild.textContent = pet.sleeping ? 'Despertar' : 'Dormir';
    ['btnFeed','btnPlay','btnClean'].forEach(id=>document.getElementById(id).disabled = pet.sleeping || !pet.alive);
    const medBtn = document.getElementById('btnMed');
    if(medBtn) medBtn.disabled = !pet.sick || !pet.alive;

    if(!pet.alive){ renderGameOver(); return; }
    removeGameOver();

    pet.frame = (pet.frame||0)+1;
    if(pet.stage===0) drawEgg(pet.frame, pet.bgSeed);
    else drawCreature(pet);
  }

    if(el) el.remove();

  // ---------- botones de acción ----------
  document.getElementById('btnFeed').onclick = ()=>{
    if(pet.stage===0 || pet.sleeping || !pet.alive) return;
    if(pet.sac>=90){
      pet.empachoTicks = 5;
      if(pet.poops<4) pet.poops++;
      pet.hyg = clamp(100 - pet.poops*14);
      pet.feedCount++;
      showToast(pet.name+' ya estaba lleno — le ha sentado mal, tiene empacho 🤢');
      sfx('mistake');
      render(); savePet();
      return;
    }
    pet.sac = clamp(pet.sac+28);
    pet.happy = clamp(pet.happy+4);
    pet.feedCount++;
    gainXp(2);
    if(pet.poopTimer===0 && pet.poops<4) pet.poopTimer = 6;
    showToast(pet.name+' ha comido 🍖');
    sfx('feed');
    render(); savePet();
  };
  document.getElementById('btnPlay').onclick = ()=>{
    if(pet.stage===0 || pet.sleeping || !pet.alive) return;
    if(pet.energy<10){ showToast(pet.name+' está muy cansado para jugar'); return; }
    pet.happy = clamp(pet.happy+22);
    pet.energy = clamp(pet.energy-14);
    pet.sac = clamp(pet.sac-6);
    pet.playCount++;
    gainXp(3);
    showToast('¡'+pet.name+' se divirtió jugando! 🎮');
    sfx('play');
    render(); savePet();
  };
  document.getElementById('btnClean').onclick = ()=>{
    if(pet.stage===0 || !pet.alive) return;
    if(pet.poops===0){ showToast('Ya está todo limpio ✨'); return; }
    pet.poops=0; pet.poopTimer=0; pet.hyg=100;

    showToast('Limpieza completa 🧹');
    sfx('clean');
    render(); savePet();
  };
  document.getElementById('btnSleep').onclick = ()=>{
    if(pet.stage===0 || !pet.alive) return;
    pet.sleeping = !pet.sleeping;

  };
  function useMedicine(){

    showToast(pet.name+' ha sido curado 💊');
    sfx('heal');
    render(); savePet();
  }
