  // ---------- el fondo de las peleas lo pinto en 2D, bien detallado ----------
  function draw2DBattleBackdrop(canvas, theme){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = window.innerWidth*dpr; canvas.height = window.innerHeight*dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    const w = window.innerWidth, h = window.innerHeight;
    const rand = mulberry32(theme==='mazmorra'?77:33);
    if(theme==='mazmorra'){
      const sky = ctx.createLinearGradient(0,0,0,h);
      sky.addColorStop(0,'#0b070c'); sky.addColorStop(.55,'#241019'); sky.addColorStop(.8,'#4a2418'); sky.addColorStop(1,'#7a3a22');
      ctx.fillStyle = sky; ctx.fillRect(0,0,w,h);
      // arco de piedra al fondo, como la entrada a una cámara mas profunda
      ctx.fillStyle = 'rgba(15,9,10,.85)';
      const archY = h*.42, archW = w*.62, archX = w*.5;
      ctx.beginPath();
      ctx.moveTo(archX-archW/2, h*.7);
      ctx.lineTo(archX-archW/2, archY+40);
      ctx.quadraticCurveTo(archX-archW/2, archY, archX, archY);
      ctx.quadraticCurveTo(archX+archW/2, archY, archX+archW/2, archY+40);
      ctx.lineTo(archX+archW/2, h*.7);
      ctx.fill();
      // estalactitas colgando arriba
      ctx.fillStyle = '#1c1113';
      for(let i=0;i<14;i++){
        const x = (i/13)*w + (rand()-.5)*30;
        const len = 18+rand()*46;
        ctx.beginPath();
        ctx.moveTo(x-14,0); ctx.lineTo(x+14,0); ctx.lineTo(x,len); ctx.closePath(); ctx.fill();
      }
      // paredes laterales con textura de bloques, en perspectiva hacia el centro
      [-1,1].forEach(side=>{
        ctx.fillStyle = 'rgba(28,16,17,.9)';
        ctx.beginPath();
        ctx.moveTo(side<0?0:w, h*.2);
        ctx.lineTo(side<0?0:w, h*.85);
        ctx.lineTo(archX+side*archW*.55, h*.72);
        ctx.lineTo(archX+side*archW*.5, archY+30);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth=1.5;
        for(let r=0;r<8;r++){
          const yy = h*.22 + r*(h*.6/8);
          ctx.beginPath(); ctx.moveTo(side<0?0:w, yy); ctx.lineTo(archX+side*archW*.52, yy*.55+archY*.4); ctx.stroke();
        }
      });
      // manchas de luz calida de las antorchas, para que combine con las luces 3D reales
      [-1,1].forEach(side=>{
        const gx = w/2+side*w*.24, gy = h*.55;
        const glow = ctx.createRadialGradient(gx,gy,4,gx,gy,120);
        glow.addColorStop(0,'rgba(255,170,90,.35)'); glow.addColorStop(1,'rgba(255,170,90,0)');
        ctx.fillStyle = glow; ctx.fillRect(gx-120,gy-120,240,240);
      });
    } else if(theme==='arena'){
      // arena de piedra con arco central enmarcando un atardecer entre montañas, como las referencias que me diste
      const sky = ctx.createLinearGradient(0,0,0,h*.62);
      sky.addColorStop(0,'#2a2550'); sky.addColorStop(.35,'#6a4a78'); sky.addColorStop(.62,'#c98a6a'); sky.addColorStop(1,'#ffcf9a');
      ctx.fillStyle = sky; ctx.fillRect(0,0,w,h*.62);
      // sol grande y difuso justo en el centro del arco
      const sun = ctx.createRadialGradient(w*.5,h*.42,10,w*.5,h*.42,w*.22);
      sun.addColorStop(0,'rgba(255,240,210,.95)'); sun.addColorStop(1,'rgba(255,240,210,0)');
      ctx.fillStyle = sun; ctx.fillRect(w*.5-w*.22,h*.42-w*.22,w*.44,w*.44);
      // montañas lejanas, dos capas
      ctx.fillStyle = 'rgba(90,70,110,.55)';
      ctx.beginPath(); ctx.moveTo(0,h*.6);
      for(let x=0;x<=w;x+=w/12){ ctx.lineTo(x, h*.58 - Math.abs(Math.sin(x*.015+1))*h*.1); }
      ctx.lineTo(w,h*.62); ctx.lineTo(0,h*.62); ctx.fill();
      ctx.fillStyle = 'rgba(60,45,75,.7)';
      ctx.beginPath(); ctx.moveTo(0,h*.62);
      for(let x=0;x<=w;x+=w/16){ ctx.lineTo(x, h*.6 - Math.abs(Math.sin(x*.022+3))*h*.075); }
      ctx.lineTo(w,h*.62); ctx.lineTo(0,h*.62); ctx.fill();
      // suelo de losas, en degradado calido, con las lineas de las baldosas convergiendo al centro
      const floor = ctx.createLinearGradient(0,h*.6,0,h);
      floor.addColorStop(0,'#5a2a2e'); floor.addColorStop(.4,'#8a3a34'); floor.addColorStop(1,'#2a1216');
      ctx.fillStyle = floor; ctx.fillRect(0,h*.6,w,h*.4);
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.4;
      const vanishX = w*.5, vanishY = h*.6;
      for(let i=-8;i<=8;i++){
        ctx.beginPath(); ctx.moveTo(vanishX, vanishY); ctx.lineTo(vanishX+i*w*.16, h); ctx.stroke();
      }
      for(let r=0;r<7;r++){
        const t = r/6, yy = vanishY + t*t*(h-vanishY);
        ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(w,yy); ctx.stroke();
      }
      // muros oscuros a los lados, cada uno con un arco pequeño mostrando el mismo cielo
      const wallMat = 'rgba(20,10,16,.92)';
      [-1,1].forEach(side=>{
        ctx.fillStyle = wallMat;
        ctx.fillRect(side<0?0:w*.78, 0, w*.22, h);
        ctx.save();
        ctx.beginPath();
        const ax = side<0? w*.11 : w*.89, ay=h*.34, arx=w*.09, ary=h*.26;
        ctx.ellipse(ax,ay,arx,ary,0,Math.PI,0);
        ctx.lineTo(ax+arx, h*.62); ctx.lineTo(ax-arx, h*.62); ctx.closePath();
        ctx.clip();
        ctx.fillStyle = sky; ctx.fillRect(side<0?0:w*.78,0,w*.22,h);
        ctx.fillStyle = 'rgba(60,45,75,.6)';
        ctx.beginPath(); ctx.moveTo(side<0?0:w*.78,h*.55);
        ctx.lineTo(side<0?w*.22:w, h*.5); ctx.lineTo(side<0?w*.22:w,h*.62); ctx.lineTo(side<0?0:w*.78,h*.62); ctx.fill();
        ctx.restore();
      });
      // columnas centrales flanqueando el arco grande, con capitel
      [-1,1].forEach(side=>{
        const px = w*.5 + side*w*.235;
        ctx.fillStyle = '#3a2a30';
        ctx.fillRect(px-w*.028, h*.08, w*.056, h*.56);
        ctx.fillStyle = '#4a3238';
        ctx.fillRect(px-w*.042, h*.08, w*.084, h*.045);
        ctx.fillRect(px-w*.042, h*.56, w*.084, h*.045);
      });
      // estandartes colgando arriba del arco central
      [-1,-.33,.33,1].forEach(px=>{
        ctx.fillStyle = 'rgba(120,30,30,.8)';
        ctx.fillRect(w*.5+px*w*.16-6, 0, 12, h*.1+Math.abs(px)*h*.03);
      });
      // nubes finas cruzando el cielo, en varias capas de opacidad
      const rand2 = mulberry32(51);
      for(let i=0;i<6;i++){
        const cx = rand2()*w, cy = h*.12+rand2()*h*.28, cw = 60+rand2()*90;
        ctx.fillStyle = 'rgba(255,235,220,'+(.12+rand2()*.15).toFixed(2)+')';
        ctx.beginPath();
        for(let k=0;k<4;k++){ ctx.ellipse(cx+k*cw*.28, cy+Math.sin(k)*4, cw*.26, cw*.11, 0, 0, Math.PI*2); }
        ctx.fill();
      }
      // pajaros lejanos, un simple trazo en "M" repetido
      ctx.strokeStyle = 'rgba(30,20,30,.55)'; ctx.lineWidth = 1.6;
      for(let i=0;i<5;i++){
        const bx = w*.15+rand2()*w*.7, by = h*.16+rand2()*h*.18, bs = 4+rand2()*3;
        ctx.beginPath();
        ctx.moveTo(bx-bs,by); ctx.quadraticCurveTo(bx-bs*.4,by-bs*.8,bx,by);
        ctx.quadraticCurveTo(bx+bs*.4,by-bs*.8,bx+bs,by);
        ctx.stroke();
      }
      // braseros de fuego a los pies de cada columna central, para que combinen con las luces 3D reales
      [-1,1].forEach(side=>{
        const px = w*.5 + side*w*.235, py = h*.63;
        ctx.fillStyle = '#2a1c1c'; ctx.fillRect(px-10,py-6,20,10);
        const flameGlow = ctx.createRadialGradient(px,py-10,2,px,py-10,46);
        flameGlow.addColorStop(0,'rgba(255,180,80,.85)'); flameGlow.addColorStop(1,'rgba(255,140,50,0)');
        ctx.fillStyle = flameGlow; ctx.fillRect(px-46,py-56,92,92);
        ctx.fillStyle = '#ffcf6e';
        ctx.beginPath(); ctx.moveTo(px,py-24); ctx.quadraticCurveTo(px-7,py-12,px,py-6); ctx.quadraticCurveTo(px+7,py-12,px,py-24); ctx.fill();
      });
      // grietas y desgaste en las losas del suelo, para que no se vea tan limpio
      ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1;
      for(let i=0;i<10;i++){
        const sx = rand2()*w, sy = h*.68+rand2()*h*.28;
        ctx.beginPath(); ctx.moveTo(sx,sy);
        let cx2=sx, cy2=sy;
        for(let k=0;k<3;k++){ cx2 += (rand2()-.5)*30; cy2 += rand2()*14; ctx.lineTo(cx2,cy2); }
        ctx.stroke();
      }
      // penumbra en las esquinas para dar profundidad
      const vign = ctx.createRadialGradient(w*.5,h*.45,h*.2,w*.5,h*.45,h*.85);
      vign.addColorStop(0,'rgba(0,0,0,0)'); vign.addColorStop(1,'rgba(0,0,0,.5)');
      ctx.fillStyle = vign; ctx.fillRect(0,0,w,h);
    } else {
      // bosque: cielo de atardecer, montañas lejanas, varias filas de árboles con profundidad
      const sky = ctx.createLinearGradient(0,0,0,h);
      sky.addColorStop(0,'#160d24'); sky.addColorStop(.4,'#3a2050'); sky.addColorStop(.72,'#7a4a5a'); sky.addColorStop(1,'#c98a5a');
      ctx.fillStyle = sky; ctx.fillRect(0,0,w,h);
      // luna
      ctx.fillStyle = 'rgba(255,250,230,.9)';
      ctx.beginPath(); ctx.arc(w*.78, h*.18, 34, 0, Math.PI*2); ctx.fill();
      // estrellitas
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      for(let i=0;i<40;i++){ const x=rand()*w, y=rand()*h*.45; ctx.fillRect(x,y,1.6,1.6); }
      // montañas lejanas
      ctx.fillStyle = 'rgba(35,22,40,.75)';
      ctx.beginPath(); ctx.moveTo(0,h*.62);
      for(let x=0;x<=w;x+=w/10){ ctx.lineTo(x, h*.62 - Math.abs(Math.sin(x*.01+2))*h*.14); }
      ctx.lineTo(w,h*.7); ctx.lineTo(0,h*.7); ctx.fill();
      // tres filas de árboles, cada vez más cerca, oscuros y grandes
      const rows = [ {y:h*.66, s:.55, c:'#1c2a1e', n:16}, {y:h*.74, s:.8, c:'#152018', n:11}, {y:h*.85, s:1.15, c:'#0e1710', n:7} ];
      rows.forEach(row=>{
        for(let i=0;i<row.n;i++){
          const x = (i/(row.n-1))*w*1.15 - w*.07 + (rand()-.5)*30;
          const th = 70*row.s, tw=44*row.s;
          ctx.fillStyle = row.c;
          ctx.fillRect(x-4*row.s, row.y-th*.3, 8*row.s, th*.3);
          ctx.beginPath();
          ctx.moveTo(x, row.y-th); ctx.lineTo(x-tw/2, row.y-th*.35); ctx.lineTo(x+tw/2, row.y-th*.35); ctx.closePath(); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(x, row.y-th*.72); ctx.lineTo(x-tw*.4, row.y-th*.1); ctx.lineTo(x+tw*.4, row.y-th*.1); ctx.closePath(); ctx.fill();
        }
      });
      // niebla suave pegada al suelo
      const mist = ctx.createLinearGradient(0,h*.8,0,h);
      mist.addColorStop(0,'rgba(200,200,220,0)'); mist.addColorStop(1,'rgba(200,200,220,.18)');
      ctx.fillStyle = mist; ctx.fillRect(0,h*.8,w,h*.2);
    }
  }

  function buildDungeonEnvironment(scene){
    // dejo el fondo transparente a propósito — el paisaje detallado lo pinto aparte, en 2D, justo detrás
    scene.background = null;
    scene.fog = null;
    const ground = new THREE.Mesh(new THREE.CircleGeometry(9,28), new THREE.MeshStandardMaterial({color:0x3a2a24, roughness:.95, flatShading:true}));
    ground.rotation.x = -Math.PI/2; ground.position.y = -1.2;
    scene.add(ground);
    const pillarMat = new THREE.MeshStandardMaterial({color:0x2a1f1c, roughness:.9, flatShading:true});
    [-3.4,3.4].forEach(x=>{
      const pillar = new THREE.Mesh(new THREE.BoxGeometry(.6,4,.6), pillarMat);
      pillar.position.set(x,.8,-1.5);
      scene.add(pillar);
      const torch = new THREE.PointLight(0xffaa55, 1.1, 6);
      torch.position.set(x,1.6,-1.1);
      scene.add(torch);
      const flame = new THREE.Mesh(new THREE.SphereGeometry(.12,6,6), new THREE.MeshBasicMaterial({color:0xffcc66}));
      flame.position.copy(torch.position);
      scene.add(flame);
    });
    scene.add(new THREE.HemisphereLight(0xaa8866, 0x150a10, .6));
  }
  function initDungeonScene(theme){
    theme = theme || 'arena';
    const bgCanvas = document.getElementById('dg2dBg');
    if(bgCanvas) draw2DBattleBackdrop(bgCanvas, theme);
    const canvasEl = document.getElementById('dgCanvas');
    if(!canvasEl) return;
    const ctx2 = canvasEl.getContext('2d');
    ctx2.imageSmoothingEnabled = false;
    function resize(){
      const dpr = Math.min(window.devicePixelRatio||1, 2);
      canvasEl.width = Math.round(window.innerWidth*dpr);
      canvasEl.height = Math.round(window.innerHeight*dpr);
      ctx2.setTransform(dpr,0,0,dpr,0,0);
      const bg = document.getElementById('dg2dBg');
      if(bg) draw2DBattleBackdrop(bg, theme);
    }
    dungeonScene3D = { ctx2, canvasEl, meTraits:null, monTraits:null, bobT:0, raf:null, attack:null, particles:[], shields:[], charges:[], shake:null, onResize:resize };
    resize();
    window.addEventListener('resize', resize);
    function loop(){
      if(!dungeonScene3D) return;
      dungeonScene3D.bobT += .06;
      applyDungeonAttack();
      drawBattleFighters2D();
      dungeonScene3D.raf = requestAnimationFrame(loop);
    }
    loop();
  }
  function drawBattleFighters2D(){
    const s = dungeonScene3D;
    if(!s) return;
    const w = window.innerWidth, h = window.innerHeight;
    s.ctx2.clearRect(0,0,w,h);
    const groundY = h*.62;
    const scaleFactor = Math.min(w,h)/380; // referencia pensada para un móvil normal, escalo proporcional al resto
    const shakeOff = applyScreenShake();
    // avanzo los efectos antes de dibujar, para que salgan en la misma posición que los luchadores de este fotograma
    advanceHitParticles3D(); advanceShields3D(); advanceCharges3D();
    [['me',-1],['mon',1]].forEach(([side,dir])=>{
      const traits = side==='me' ? s.meTraits : s.monTraits;
      if(!traits) return;
      const bob = Math.sin(s.bobT + (side==='me'?0:1))*4;
      let lungeOff = 0, tiltOff = 0, chargeGlow = 0;
      if(s.attack && s.attack.side===side){
        const el = performance.now()-s.attack.start, t=Math.min(1,el/550);
        const lunge = Math.sin(t*Math.PI);
        lungeOff = -dir*lunge*46;
        if(s.attack.moveType==='Especial') chargeGlow = 1-t;
      }
      if(s.attack && s.attack.side!==side && s.defShakeUntil>performance.now()){
        tiltOff = Math.sin(performance.now()*.09)*4;
      }
      const baseX = w*.5 + dir*w*.22;
      const px2 = baseX + lungeOff + shakeOff.x + tiltOff;
      const py2 = groundY + bob + shakeOff.y;
      s.ctx2.save();
      s.ctx2.translate(px2, py2);
      s.ctx2.scale(dir<0?scaleFactor:-scaleFactor, scaleFactor); // el de la derecha mira hacia la izquierda, como cara a cara
      if(chargeGlow>0){
        s.ctx2.fillStyle = `rgba(255,207,94,${.35*chargeGlow})`;
        s.ctx2.beginPath(); s.ctx2.arc(0,-40,50+10*Math.sin(performance.now()*.02),0,Math.PI*2); s.ctx2.fill();
      }
      useCanvas(dummyCanvas2D);
      drawCreature({...traits, frame:pet.frame||0, sleeping:false, sick:false}, true, 12, 13.5);
      s.ctx2.drawImage(dummyCanvas2D, -dummyCanvas2D.width/(2*cell), -dummyCanvas2D.height/(1.55*cell), dummyCanvas2D.width/cell, dummyCanvas2D.height/cell);
      useScreenCanvas();
      s.ctx2.restore();
    });
    // partículas, escudos y destellos de carga, ya en coordenadas de pantalla
    s.particles.forEach(p=>{
      s.ctx2.fillStyle = p.color; s.ctx2.globalAlpha = Math.max(0,1-p.life/p.maxLife);
      s.ctx2.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    });
    s.ctx2.globalAlpha = 1;
    s.shields.forEach(sh=>{
      s.ctx2.strokeStyle = `rgba(111,216,255,${Math.max(0,.9-sh.life*.07)})`;
      s.ctx2.lineWidth = 3;
      s.ctx2.beginPath(); s.ctx2.arc(sh.x,sh.y,14+sh.life*3,0,Math.PI*2); s.ctx2.stroke();
    });
  }
  function setDungeonFighters(meTraits, monTraits){
    if(!dungeonScene3D) return;
    dungeonScene3D.meTraits = meTraits || {stage:0};
    dungeonScene3D.monTraits = monTraits;
  }
  function playDungeonAttack(side, moveType, damage, blocked){
    // ataca de verdad: se lanza hacia el rival, y en el instante del choque disparo números de daño,
    // partículas, temblor de cámara y destello — con su propio look según sea Ataque, Especial o un bloqueo
    if(!dungeonScene3D) return;
    dungeonScene3D.attack = { side, start:performance.now(), moveType, damage:Math.max(0,Math.round(damage||0)), blocked:!!blocked, impactDone:false };
  }
  function applyDungeonAttack(){
    if(!dungeonScene3D || !dungeonScene3D.attack) return;
    const atk = dungeonScene3D.attack;
    const el = performance.now() - atk.start;
    const dur = 550;
    if(el > dur){ dungeonScene3D.attack = null; return; }
    const t = el/dur;
    if(!atk.impactDone && t>=.48){
      atk.impactDone = true;
      const w = window.innerWidth, h = window.innerHeight;
      const defSide = atk.side==='me' ? 1 : -1;
      const impactX = w*.5 + defSide*w*.14, impactY = h*.62-40;
      dungeonScene3D.defShakeUntil = performance.now()+330;
      if(atk.blocked){
        spawnShieldBlock3D(impactX, impactY);
        sfx('hit');
        triggerScreenShake(3);
      } else {
        const isEspecial = atk.moveType==='Especial';
        spawnHitParticles3D(impactX, impactY, isEspecial?'#ffcf5e':'#ff5c5c', isEspecial?16:10);
        triggerImpactFlash(isEspecial ? 'rgba(255,207,94,.35)' : 'rgba(255,60,60,.3)');
        triggerScreenShake(isEspecial?9:5);
        spawnDamageNumber3D(impactX, impactY, atk.damage, isEspecial?'crit':'normal');
      }
    }
  }
  // ---------- efectos de combate: números de daño, partículas, temblor de cámara, destellos ----------
  function spawnDamageNumber3D(x, y, amount, kind){
    if(amount<=0) return;
    const el = document.createElement('div');
    el.className = 'dmg-number' + (kind==='crit' ? ' dmg-crit' : '') + (kind==='heal' ? ' dmg-heal' : '');
    el.textContent = (kind==='heal' ? '+' : '-') + amount;
    el.style.left = x+'px'; el.style.top = y+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 900);
  }
  function spawnHitParticles3D(x, y, color, count){
    if(!dungeonScene3D) return;
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2, spd = 1.5+Math.random()*3;
      dungeonScene3D.particles.push({ x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-1.5, color, size:3+Math.random()*3, life:0, maxLife:20+Math.random()*10 });
    }
  }
  function advanceHitParticles3D(){
    if(!dungeonScene3D) return;
    dungeonScene3D.particles = dungeonScene3D.particles.filter(p=>{
      p.life++; p.vy += .2; p.x += p.vx; p.y += p.vy;
      return p.life < p.maxLife;
    });
  }
  function triggerScreenShake(intensity){
    if(!dungeonScene3D) return;
    dungeonScene3D.shake = { intensity, start:performance.now(), dur:280 };
  }
  function applyScreenShake(){
    if(!dungeonScene3D || !dungeonScene3D.shake) return {x:0,y:0};
    const { intensity, start, dur } = dungeonScene3D.shake;
    const el = performance.now()-start;
    if(el>dur){ dungeonScene3D.shake=null; return {x:0,y:0}; }
    const decay = 1-(el/dur);
    return { x:(Math.random()-.5)*intensity*decay, y:(Math.random()-.5)*intensity*decay };
  }
  function triggerImpactFlash(color){
    const el = document.createElement('div');
    el.className = 'dg-impact-flash';
    el.style.background = color;
    document.body.appendChild(el);
    requestAnimationFrame(()=>{ el.style.opacity = '0'; });
    setTimeout(()=>el.remove(), 260);
  }
  function spawnShieldBlock3D(x, y){
    if(!dungeonScene3D) return;
    dungeonScene3D.shields.push({ x, y, life:0 });
    spawnHitParticles3D(x, y, '#9fe8ff', 8);
  }
  function advanceShields3D(){
    if(!dungeonScene3D) return;
    dungeonScene3D.shields = dungeonScene3D.shields.filter(s=>{ s.life++; return s.life<=13; });
  }
  function advanceCharges3D(){ /* la carga de Especial ahora se dibuja directamente en drawBattleFighters2D */ }

  function render3DMiniPreview(canvasEl, traitsOrNull){
    if(typeof THREE==='undefined' || !canvasEl) return;
    const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    const w = canvasEl.clientWidth||84, h = canvasEl.clientHeight||84;
    renderer.setSize(w, h, false);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, w/h, .1, 20);
    camera.position.set(0, .5, 4.7);
    camera.lookAt(0, .2, 0);
    scene.add(new THREE.HemisphereLight(0xbfe8ff, 0x201030, 1.1));
    const dir = new THREE.DirectionalLight(0xffffff, .9);
    dir.position.set(2,3,4);
    scene.add(dir);
    const seedForTheme = (traitsOrNull && traitsOrNull.bgSeed!=null) ? traitsOrNull.bgSeed : ((traitsOrNull && traitsOrNull.hue!=null) ? traitsOrNull.hue : 210);
    const miniTheme = pickEnvTheme(seedForTheme);
    const miniColors = ENV_COLORS[miniTheme];
    scene.background = new THREE.Color().setHSL(miniColors.sky[0]/360, miniColors.sky[1], miniColors.sky[2]);
    scene.fog = new THREE.Fog(scene.background.getHex(), 5, 11);
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(3.2, 24),
      new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(miniColors.ground[0]/360, miniColors.ground[1], miniColors.ground[2]), roughness:.9, flatShading:true })
    );
    ground.rotation.x = -Math.PI/2;
    ground.position.y = -1.2;
    scene.add(ground);
    const model = traitsOrNull ? build3DCreature(traitsOrNull) : build3DEgg();
    scene.add(model);
    const inst = { renderer, raf:null };
    let bobT = Math.random()*10;
    function loop(){
      bobT += 0.045;
      model.rotation.y = 0.42; // mirando de frente, ya no gira sin parar
      model.position.y = Math.sin(bobT)*0.05;
      renderer.render(scene, camera);
      inst.raf = requestAnimationFrame(loop);
    }
    loop();
    miniPreviewInstances.push(inst);
  }

      c.querySelectorAll('[data-mv]').forEach(btn=>{
        btn.onclick=async ()=>{
          sfx('tap');
          const mv = btn.getAttribute('data-mv');
          const MOVES3 = ['Ataque','Especial','Defensa'];
          const mmv = MOVES3[Math.floor(Math.random()*3)];
          const r = resolveMoves(mv, mmv, s.p1.power, s.m.power, s.p1.path, null);
          sfx('hit');
          playDungeonAttack('me', mv, r.dmgToB-r.healB, mmv==='Defensa' && mv!=='Defensa');
          await sleep(280);
          playDungeonAttack('mon', mmv, r.dmgToA-r.healA, mv==='Defensa' && mmv!=='Defensa');
          await sleep(400);
          s.p1.hp = Math.min(100, Math.max(0, s.p1.hp - r.dmgToA + r.healA));
          s.m.hp = Math.min(100, Math.max(0, s.m.hp - r.dmgToB + r.healB));
          s.log.push(s.p1.name+' usó '+mv+' · '+s.m.name+' usó '+mmv+' — '+r.text);
          if(s.p1.hp<=0 || s.m.hp<=0){
            if(s.m.hp<=0){
              sfx('win');
              pet.lastGoodTick = pet.ticks;
              const rew = dungeonRewards(s.m);
              gainXp(rew.xp);
              applyMonsterTypeReward(s.m.type, rew.statPts);
              if(!pet.dungeonDefeated) pet.dungeonDefeated=[];
              if(!pet.dungeonDefeated.includes(s.m.floor)) pet.dungeonDefeated.push(s.m.floor);
              if(s.m.floor===pet.dungeonFloor) pet.dungeonFloor += 1;
              s.log.push('¡Has ganado '+rew.xp+' XP y '+rew.statPts+' puntos de '+STAT_LABEL[s.m.type]+'!');
              savePet();
            } else {
              sfx('lose');
              pet.happy = clamp(pet.happy-10);
              savePet();
            }
          }
          renderDungeonBattle();
        };
      });
    } else if(s.m.hp<=0){
      document.getElementById('nextFloor').onclick=()=>{ sfx('tap'); dungeonState=null; renderDungeonHome(); };
      document.getElementById('rematchDg').onclick=()=>{ sfx('tap'); startDungeonBattle(s.m); };
    } else {
      document.getElementById('retryFloor').onclick=()=>{ sfx('tap'); dungeonState=null; renderDungeonHome(); };
    }
  }

  const LEADERBOARD_KEY = 'bytemon:leaderboard';
  async function recordWin(winnerName, winnerSpecies){
    let board = [];
    try{
      const res = await CloudAdapter.get(LEADERBOARD_KEY, true);
      if(res && res.value) board = JSON.parse(res.value);
    }catch(e){}
    const idx = board.findIndex(b=>b.name===winnerName && b.species===winnerSpecies);
    if(idx>=0) board[idx].wins++; else board.push({name:winnerName, species:winnerSpecies, wins:1});
    board.sort((a,b)=>b.wins-a.wins);
    board = board.slice(0,10);
    try{ await CloudAdapter.set(LEADERBOARD_KEY, JSON.stringify(board), true); }catch(e){}

  async function loadOpenChallenges(){
    const list = await getOpenList();
    const now = Date.now();
    const fresh = list.filter(c=>now-c.ts<10*60*1000);
    const box = document.getElementById('challengeList');
    if(!box) return;
    if(fresh.length===0){ box.innerHTML = '<p class="small-note">No hay retos abiertos ahora mismo. ¡Crea uno!</p>'; return; }
    box.innerHTML = fresh.map(ch => `<div class="challenge-item"><span>${ch.name} <small style="color:var(--muted)">(${ch.species})</small></span><button data-accept="${ch.id}">Aceptar</button></div>`).join('');
    box.querySelectorAll('[data-accept]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.getAttribute('data-accept');
        let openList = await getOpenList();
        const challenge = openList.find(x=>x.id===id);
        if(!challenge){ showToast('Ese reto ya no está disponible'); loadOpenChallenges(); return; }
        openList = openList.filter(x=>x.id!==id);
        await setOpenList(openList);
        const doc = {
          id, round:1, resolvedRound:0, finished:false, winner:null, log:[],
          p1:{ ...challenge, hp:100, move:null },
          p2:{ ...mySnapshot(), hp:100, move:null }
        };
        await CloudAdapter.set(battleKey(id), JSON.stringify(doc), true);
        enterOnlineBattle(id, 'p2');
      };
    });
  }

  function enterOnlineBattle(id, mySlot){
    lastOnlineShakeRound = -1;
    lastOnlineHp = {p1:100, p2:100};
    async function poll(){
      let doc;
      try{
        const res = await CloudAdapter.get(battleKey(id), true);
        if(!res || !res.value) return;
        doc = JSON.parse(res.value);
      }catch(e){ return; }

      if(!doc.finished && doc.p1.move && doc.p2.move && doc.resolvedRound < doc.round){
        const r = resolveMoves(doc.p1.move, doc.p2.move, doc.p1.power, doc.p2.power, doc.p1.path, doc.p2.path);
        doc.p1.hp = Math.min(100, Math.max(0, doc.p1.hp - r.dmgToA + r.healA));
        doc.p2.hp = Math.min(100, Math.max(0, doc.p2.hp - r.dmgToB + r.healB));
        doc.log.push(doc.p1.name+' usó '+doc.p1.move+' · '+doc.p2.name+' usó '+doc.p2.move+' — '+r.text);
        doc.lastMove1 = doc.p1.move; doc.lastMove2 = doc.p2.move;
        doc.p1.move=null; doc.p2.move=null;
        doc.resolvedRound = doc.round;
        doc.round += 1;
        sfx('hit');
        if(doc.p1.hp<=0 || doc.p2.hp<=0){
          doc.finished=true;
          doc.winner = doc.p1.hp<=0? doc.p2.name : doc.p1.name;
          const winnerSpecies = doc.p1.hp<=0 ? doc.p2.species : doc.p1.species;
          recordWin(doc.winner, winnerSpecies);
          const iWon = (mySlot==='p1' && doc.p2.hp<=0) || (mySlot==='p2' && doc.p1.hp<=0);
          if(iWon){ gainXp(8); savePet(); }
        }
        try{ await CloudAdapter.set(battleKey(id), JSON.stringify(doc), true); }catch(e){}
      }
      renderOnlineBattleUI(doc, mySlot, id);
    }
    poll();
    battleTimer = setInterval(poll, 2000);
  }

  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

  // esta es la animación de choque que uso en las 3 arenas (local, online, mazmorra):
  // hago que los dos se lancen el uno contra el otro, pongo el destello en medio,
  // y encima les saco el número de daño flotando antes de refrescar las barras de vida
  function spawnDmgFloat(fighterEl, dmg){
    if(!fighterEl || !dmg) return;
    const box = fighterEl.querySelector('.battle-sprite-box') || fighterEl;
    const el = document.createElement('div');
    el.className = 'dmg-float';
    el.textContent = '-'+dmg;

  function moveAnimClass(move, dir){
    if(move==='Ataque') return dir==='right' ? 'lunge-right' : 'lunge-left';
    if(move==='Especial') return 'special-glow';
    if(move==='Defensa') return 'defend-brace';
    return dir==='right' ? 'lunge-right' : 'lunge-left';
  }
  async function playBattleClash(id1, id2, dmg1, dmg2, move1, move2){
    const f1 = document.getElementById(id1);
    const f2 = document.getElementById(id2);
    if(!f1 || !f2) return;
    const cls1 = moveAnimClass(move1||'Ataque', 'right');
    const cls2 = moveAnimClass(move2||'Ataque', 'left');
    f1.classList.add(cls1);
    f2.classList.add(cls2);
    await sleep(260);
    const arena = f1.closest('.vs');
    if(arena){
      arena.classList.add('arena-shake');
      const flash = document.createElement('div');
      flash.className = 'arena-flash';
      arena.appendChild(flash);
      setTimeout(()=>flash.remove(), 300);
    }
    [f1, f2].forEach((f)=>{
      const box = f.querySelector('.battle-sprite-box');
      if(box){
        const impact = document.createElement('div');
        impact.className = 'clash-impact';
        box.appendChild(impact);
        setTimeout(()=>impact.remove(), 420);
      }
    });
    spawnDmgFloat(f1, dmg1);
    spawnDmgFloat(f2, dmg2);
    await sleep(280);
    f1.classList.remove(cls1);
    f2.classList.remove(cls2);
    if(arena) arena.classList.remove('arena-shake');
    await sleep(140);
  }

  // ---------- Esquiva en 3D de verdad: la propia mascota se mueve por el carril, no es un emoji plano ----------
  let dodgeScene3D = null;
  let catchScene3D = null;
  function stopCatchScene3D(){
    if(catchScene3D){
      if(catchScene3D.raf) cancelAnimationFrame(catchScene3D.raf);
      disposeThreeRenderer(catchScene3D.renderer);
      catchScene3D = null;
    }
  }
  function initCatchScene3D(canvasEl){
    if(typeof THREE==='undefined' || !canvasEl) return false;
    const renderer = new THREE.WebGLRenderer({ canvas:canvasEl, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    const w = canvasEl.clientWidth||300, h = canvasEl.clientHeight||300;
    renderer.setSize(w,h,false);
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x1a1030, 6, 16);
    const camera = new THREE.PerspectiveCamera(48, w/h, .1, 100);
    camera.position.set(0, 1.3, 5.6);
    camera.lookAt(0, .6, 0);
    scene.add(new THREE.HemisphereLight(0xbfe8ff, 0x201030, .95));
    const dir = new THREE.DirectionalLight(0xffffff, .8); dir.position.set(2,5,3); scene.add(dir);
    // una franja de suelo donde se para a recoger, con los limites marcados a cada lado
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(4.6,2.2), new THREE.MeshStandardMaterial({color:0x241c3a, roughness:.9, flatShading:true}));
    ground.rotation.x = -Math.PI/2; ground.position.set(0,-.9,0);
    scene.add(ground);
    [-1.85,1.85].forEach(x=>{
      const post = new THREE.Mesh(new THREE.BoxGeometry(.08,1.6,.08), new THREE.MeshStandardMaterial({color:0x7d5dff, emissive:0x2a1a5a}));
      post.position.set(x,-.1,0);
      scene.add(post);
    });
    const model = pet.stage===0 ? build3DEgg() : build3DCreature(snapshotVisual(pet));
    const scale = (model.userData.baseScale||1)*.55;
    model.scale.setScalar(scale);
    model.position.set(0,-.35,.3);
    scene.add(model);
    catchScene3D = { renderer, scene, camera, model, fruits:[], bobT:0, raf:null, x:0 };
    function loop(){
      if(!catchScene3D) return;
      catchScene3D.bobT += .05;
      catchScene3D.model.position.y = -.35 + Math.sin(catchScene3D.bobT)*.05;
      renderer.render(scene, camera);
      catchScene3D.raf = requestAnimationFrame(loop);
    }
    loop();
    return true;
  }
  function setCatchBasketX3D(x){
    if(!catchScene3D) return;
    catchScene3D.x = x;
    catchScene3D.model.position.x = x;
  }
  const CATCH_FRUIT_COLORS = [0xff4d6d, 0xffd23f, 0x8a3fff, 0xff8a3f, 0x4dff9e];
  function spawnCatchFruit3D(x){
    if(!catchScene3D) return;
    const color = CATCH_FRUIT_COLORS[Math.floor(Math.random()*CATCH_FRUIT_COLORS.length)];
    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(.16,1), new THREE.MeshStandardMaterial({color, flatShading:true}));
    mesh.position.set(x, 2.6, .1);
    catchScene3D.scene.add(mesh);
    catchScene3D.fruits.push({ mesh, x, caught:false });
  }
  function advanceCatchFruits3D(speed){
    if(!catchScene3D) return { caught:0, missed:0 };
    let caught=0, missed=0;
    const remaining = [];
    catchScene3D.fruits.forEach(f=>{
      f.mesh.position.y -= speed;
      f.mesh.rotation.x += .1; f.mesh.rotation.y += .08;
      if(f.mesh.position.y < -.15 && f.mesh.position.y > -.55 && Math.abs(f.x-catchScene3D.x) < .55){
        caught++; catchScene3D.scene.remove(f.mesh);
      } else if(f.mesh.position.y < -.9){
        missed++; catchScene3D.scene.remove(f.mesh);
      } else {
        remaining.push(f);
      }
    });
    catchScene3D.fruits = remaining;
    return { caught, missed };
  }
  function stopDodgeScene3D(){
    if(dodgeScene3D){
      if(dodgeScene3D.raf) cancelAnimationFrame(dodgeScene3D.raf);
      disposeThreeRenderer(dodgeScene3D.renderer);
      dodgeScene3D = null;
    }
  }
  function initDodgeScene3D(canvasEl){
    if(typeof THREE==='undefined' || !canvasEl) return false;
    const renderer = new THREE.WebGLRenderer({ canvas:canvasEl, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    const w = canvasEl.clientWidth||300, h = canvasEl.clientHeight||300;
    renderer.setSize(w,h,false);
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x1a1030, 5, 15);
    const camera = new THREE.PerspectiveCamera(55, w/h, .1, 100);
    camera.position.set(0, 2.5, 4.4);
    camera.lookAt(0, .1, -3);
    scene.add(new THREE.HemisphereLight(0xbfe8ff, 0x201030, .9));
    const dir = new THREE.DirectionalLight(0xffffff, .8); dir.position.set(2,5,3); scene.add(dir);
    // el carril por el que corre, alejándose hacia el fondo, con dos líneas marcando las calles
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(3.2,30), new THREE.MeshStandardMaterial({color:0x241c3a, roughness:.9, flatShading:true}));
    ground.rotation.x = -Math.PI/2; ground.position.set(0,-.6,-8);
    scene.add(ground);
    [-.75,.75].forEach(x=>{
      const line = new THREE.Mesh(new THREE.PlaneGeometry(.05,30), new THREE.MeshBasicMaterial({color:0x7d5dff}));
      line.rotation.x = -Math.PI/2; line.position.set(x,-.59,-8);
      scene.add(line);
    });
    const model = pet.stage===0 ? build3DEgg() : build3DCreature(snapshotVisual(pet));
    const scale = (model.userData.baseScale||1)*.5;
    model.scale.setScalar(scale);
    model.position.set(.75,-.2,0);
    scene.add(model);
    dodgeScene3D = { renderer, scene, camera, model, obstacles:[], bobT:0, raf:null, lane:1 };
    function loop(){
      if(!dodgeScene3D) return;
      dodgeScene3D.bobT += .05;
      dodgeScene3D.model.position.y = -.2 + Math.sin(dodgeScene3D.bobT)*.06;
      renderer.render(scene, camera);
      dodgeScene3D.raf = requestAnimationFrame(loop);
    }
    loop();
    return true;
  }
  function setDodgeLane3D(lane){
    if(!dodgeScene3D) return;
    dodgeScene3D.lane = lane;
    dodgeScene3D.model.position.x = lane===0 ? -.75 : .75;
  }
  function spawnDodgeObstacle3D(lane){
    if(!dodgeScene3D) return;
    const kinds = [ {color:0x9a8a72, emissive:0x000000}, {color:0xff8844, emissive:0x552200}, {color:0xff4444, emissive:0x550000} ];
    const k = kinds[Math.floor(Math.random()*kinds.length)];
    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(.22,0), new THREE.MeshStandardMaterial({color:k.color, emissive:k.emissive, emissiveIntensity:.6, flatShading:true}));
    mesh.position.set(lane===0?-.75:.75, .05, -13);
    dodgeScene3D.scene.add(mesh);
    dodgeScene3D.obstacles.push({ mesh, lane, hit:false });
  }
  function advanceDodgeObstacles3D(speed){
    if(!dodgeScene3D) return [];
    const hits = [];
    dodgeScene3D.obstacles.forEach(o=>{
      o.mesh.position.z += speed;
      o.mesh.rotation.x += .08; o.mesh.rotation.y += .06;
      if(!o.hit && o.mesh.position.z > -.3 && o.mesh.position.z < .5 && o.lane===dodgeScene3D.lane){
        o.hit = true; hits.push(o);
      }
    });
    dodgeScene3D.obstacles = dodgeScene3D.obstacles.filter(o=>{
      if(o.mesh.position.z > 1.5){ dodgeScene3D.scene.remove(o.mesh); return false; }
      return true;
    });
    return hits;
  }

  function startRhythmGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Toca justo cuando el círculo llegue al aro. 8 golpes, encadena combo.</p>
      <div class="game-hud"><span>Combo: <b id="rhCombo">0</b></span><span>Golpe: <b id="rhBeat">1</b>/8</span></div>
      <div class="game-area" id="rhArea" style="display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">
        <div id="rhRing" style="position:absolute;width:56px;height:56px;border-radius:50%;border:4px solid rgba(125,255,179,.5);"></div>
        <div id="rhBall" style="position:absolute;width:22px;height:22px;border-radius:50%;background:#7dffb3;box-shadow:0 0 10px #7dffb3;"></div>
      </div>
    `;
    const area = document.getElementById('rhArea');
    let beat=0, combo=0, score=0, over=false;
    function playBeat(){
      if(over) return;
      const ball = document.getElementById('rhBall');
      const areaRect = area.getBoundingClientRect();
      const cx = areaRect.width/2, cy = areaRect.height/2;
      const radius = Math.min(areaRect.width, areaRect.height)*0.36;
      const dur = 1000;
      const start = performance.now();
      let hitWindowOpen = true;
      function step(){
        if(over) return;
        const t = (performance.now()-start)/dur;
        if(t>=1){
          if(hitWindowOpen){ missBeat(); }
          return;
        }
        const ang = t*Math.PI*2 - Math.PI/2;
        ball.style.left = (cx + Math.cos(ang)*radius*(1-t*0.001) - 11)+'px';
        ball.style.top = (cy + Math.sin(ang)*radius*(1-t*0.001) - 11)+'px';
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
      area.onclick = ()=>{
        if(!hitWindowOpen || over) return;
        const t = (performance.now()-start)/dur;
        const dist = Math.abs(t-0.85); // el aro está a un 85% del recorrido, cerca del punto de partida otra vez
        hitWindowOpen = false;
        if(dist < 0.09){
          combo++; score += 3+combo;
          document.getElementById('rhRing').style.borderColor = '#7dffb3';
          spawnFloatingEmoji('🥁');
        } else {
          combo = 0;
          document.getElementById('rhRing').style.borderColor = '#ff5c5c';
        }
        document.getElementById('rhCombo').textContent = combo;
        sfx(dist<0.09?'tap':'hit');
        nextBeat();
      };
    }
    function missBeat(){
      combo = 0;
      document.getElementById('rhCombo').textContent = combo;
      nextBeat();
    }
    function nextBeat(){
      beat++;
      if(beat>8){ endRhythm(); return; }
      document.getElementById('rhBeat').textContent = Math.min(beat,8);
      setTimeout(playBeat, 260);
    }
    nextBeat();
    function endRhythm(){
      over = true;
      area.onclick = null;
      const gain = Math.min(28, Math.round(score*0.9));
      finishMinigame(gain, 6, '¡'+pet.name+' siguió el ritmo! +'+gain+' de ánimo');
      showGameResult('🥁 Ritmo', score+' puntos conseguidos', gain);
    }
  }

      const el = document.getElementById('timRing');

        size += 1.6;
        if(size>=120){ endAttempt(0); return; }
      }
      el.style.width = size+'px'; el.style.height = size+'px';
      const sweet = size<=48 && size>=28;
      el.style.borderColor = sweet ? '#5eff9e' : '#ff5c5c';
      raf = requestAnimationFrame(step);
    }
    function endAttempt(pts){
      cancelAnimationFrame(raf);
      score += pts;
      document.getElementById('timScore').textContent = score;
      sfx(pts>0?'tap':'hit');
      if(tries>=5){
        const gain = Math.min(28, score);
        finishMinigame(gain, 5, '¡'+pet.name+' consiguió '+score+' puntos de precisión! +'+gain+' de ánimo');

      const el = document.getElementById('timRing');
      if(!el) return;
      const sweet = size<=48 && size>=28;
      endAttempt(sweet ? 6 : 1);

  function startMemoryGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    const ICONS = ['🍓','🐸','🎈','⭐','🍩','🚀'];
    let deck = [...ICONS, ...ICONS];
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
    let flipped=[], matched=new Set(), moves=0, lock=false;

    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Encuentra las 6 parejas con el menor número de intentos.</p>
      <div class="game-hud"><span>Intentos: <b id="memMoves">0</b></span><span>Parejas: <b id="memPairs">0</b>/6</span></div>
      <div class="memgrid" id="memGrid"></div>
    `;
    const grid = document.getElementById('memGrid');
    deck.forEach((icon,idx)=>{
      const b = document.createElement('button');
      b.className='memcard'; b.dataset.idx=idx; b.dataset.icon=icon;
      b.textContent='❔';
      b.onclick=()=>{
        if(lock || b.classList.contains('matched') || flipped.includes(b)) return;
        sfx('tap');
        b.textContent = icon;
        flipped.push(b);
        if(flipped.length===2){
          moves++; document.getElementById('memMoves').textContent=moves;
          lock=true;
          const [a,bb]=flipped;
          if(a.dataset.icon===bb.dataset.icon){
            a.classList.add('matched'); bb.classList.add('matched');
            matched.add(a.dataset.idx); matched.add(bb.dataset.idx);
            document.getElementById('memPairs').textContent=matched.size/2;
            flipped=[]; lock=false;
            if(matched.size===deck.length){
              const gain = Math.max(10, 30-moves);
              finishMinigame(gain, 6, '¡'+pet.name+' completó la memoria en '+moves+' intentos! +'+gain+' de ánimo');
              setTimeout(()=>showGameResult('🧠 Memoria', moves+' intentos', gain), 300);
            }
          } else {
            setTimeout(()=>{ a.textContent='❔'; bb.textContent='❔'; flipped=[]; lock=false; }, 700);
          }
        }
      };
      grid.appendChild(b);
    });
  }

    c.innerHTML = `

    async function nextRound(){
      accepting=false;
      level++; document.getElementById('simonLevel').textContent=level;
      sequence.push(COLOR_IDS[Math.floor(Math.random()*4)]);
      await sleep(500);
      for(const col of sequence){
        btns[col].classList.add('lit'); sfx('tap'); await sleep(420);

      }
      playerIdx=0; accepting=true;

      if(!accepting) return;
      btns[col].classList.add('lit'); setTimeout(()=>btns[col].classList.remove('lit'),150);
      sfx('tap');
      if(sequence[playerIdx]===col){
        playerIdx++;
        if(playerIdx===sequence.length){ accepting=false; setTimeout(nextRound, 700); }
      } else {
        accepting=false;
        const gain = Math.min(26, (level-1)*4);
        finishMinigame(gain, 5, '¡'+pet.name+' llegó a la ronda '+(level-1)+' en Simón dice! +'+gain+' de ánimo');

      }
    }
    nextRound();
  }

  // ---------- mi visor 3D, primera fase: construyo la mascota en 3D de verdad a partir de sus mismos rasgos ----------
  let three3D = null; // {renderer, scene, camera, group, raf, dragging, lastX, lastY, rotY, rotX}

  const skinTextureCache = {};
  function makeSkinTexture(variant){
    // textura real de piel — antes todo era un color liso sin ningún grano ni patrón encima
    if(skinTextureCache[variant]) return skinTextureCache[variant];
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,64,64); // blanco de base — se multiplica por el color real del material
    if(variant==='pelo'){
      for(let i=0;i<260;i++){
        const x = Math.random()*64, y=Math.random()*64, len=2+Math.random()*4;
        ctx.strokeStyle = 'rgba(0,0,0,'+(0.07+Math.random()*.09).toFixed(2)+')';
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+(Math.random()-.5)*1.5, y+len); ctx.stroke();
      }
    } else if(variant==='escama'){
      for(let row=0; row<9; row++){
        for(let col=0; col<9; col++){
          const x = col*7.2 + (row%2)*3.6, y = row*7.2;
          ctx.strokeStyle = 'rgba(0,0,0,.14)';
          ctx.beginPath(); ctx.arc(x,y,3.6,0,Math.PI); ctx.stroke();
        }
      }
    } else if(variant==='caparazon'){
      for(let i=0;i<40;i++){
        const x = Math.random()*64, y=Math.random()*64;
        ctx.fillStyle = 'rgba(255,255,255,'+(.08+Math.random()*.1).toFixed(2)+')';
        ctx.beginPath(); ctx.ellipse(x,y,3+Math.random()*3,1.5,Math.random()*Math.PI,0,Math.PI*2); ctx.fill();
      }
    } else {
      for(let i=0;i<480;i++){
        const x=Math.random()*64, y=Math.random()*64;
        ctx.fillStyle = Math.random()<.5? 'rgba(0,0,0,.05)':'rgba(255,255,255,.05)';
        ctx.fillRect(x,y,1.6,1.6);
      }
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(2.5,2.5);
    skinTextureCache[variant] = tex;
    return tex;
  }

  function hueToThreeColor(hue, sat, light){
    const c = new THREE.Color();
    c.setHSL(hue/360, sat, light);
    return c;
  }

  const BODY_SHAPE_DEPTH = { redondo:1, alargado:.78, compacto:1.12, esbelto:.62, macizo:1.25, ovalado:.85, anguloso:1, triangular:1 };
  function build3DBody(pal, bodyShape){
    // construyo el cuerpo apilando "lonchas" de cubos, igual que en 2D relleno fila a fila —
    // así se nota que es la misma mascota, no una figura suave sin relación con el pixel art.
    // le sumo una barriguita clara y bracitos/piecitos cortos, para que tenga la silueta de
    // criatura chibi de tus referencias, no un blob liso sin ninguna forma reconocible
    const group = new THREE.Group();
    const profileMap = {
      redondo:['round',1,1,1], alargado:['round',.78,1.32,.78], compacto:['round',1.22,.8,1.12],
      esbelto:['round',.62,1.5,.62], macizo:['round',1.35,.7,1.25], ovalado:['round',.85,1.15,.85],
      anguloso:['diamond',1,1,1], triangular:['wedge',1,1,1]
    };
    const [style, sx, sy, sz] = profileMap[bodyShape] || ['round',1,1,1];
    const rows = style==='diamond' ? 6 : 9;
    const mat = new THREE.MeshStandardMaterial({ color: pal.body, roughness:.8, flatShading:true, map: makeSkinTexture('piel') });
    for(let i=0;i<rows;i++){
      const yNorm = (i/(rows-1))*2-1;
      let widthFactor;
      if(style==='wedge') widthFactor = Math.max(0, 1-(yNorm*.5+.5));
      else if(style==='diamond') widthFactor = Math.max(0, 1-Math.abs(yNorm));
      else widthFactor = Math.sqrt(Math.max(0, 1-yNorm*yNorm));
      if(widthFactor<=0.06) continue;
      const boxW = widthFactor*1.5*sx, boxD = widthFactor*1.5*sz, boxH = (2/rows)*sy*1.08;
      const box = new THREE.Mesh(new THREE.BoxGeometry(boxW, boxH, boxD), mat);
      box.position.y = yNorm*sy;
      group.add(box);
    }
    // barriguita clara, pegada al frente, como en los chibis de referencia (cerdito, pajarito...)
    const bellyMat = new THREE.MeshStandardMaterial({ color: pal.belly, roughness:.75, flatShading:true });
    const belly = new THREE.Mesh(new THREE.BoxGeometry(.62*sx,.7*sy,.32*sz), bellyMat);
    belly.position.set(0,-sy*.18,.68*sz);
    group.add(belly);
    // bracitos cortos a los lados y piecitos debajo, para que no se quede en un blob sin extremidades
    [-1,1].forEach(s=>{
      const arm = new THREE.Mesh(new THREE.BoxGeometry(.14*sx,.32*sy,.16*sz), mat);
      arm.position.set(s*.82*sx,-.05*sy,.15*sz);
      arm.rotation.z = s*-.35;
      group.add(arm);
      const foot = new THREE.Mesh(new THREE.BoxGeometry(.24*sx,.16*sy,.3*sz), mat);
      foot.position.set(s*.32*sx,-1.02*sy,.28*sz);
      group.add(foot);
    });
    return group;
  }

  function build3DFeature(pal, featureType, rx, ry){
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: pal.accent, roughness:.8, flatShading:true });
    function cone(r,h){ return new THREE.Mesh(new THREE.ConeGeometry(r,h,4), mat); } // 4 caras = pirámide, no cono liso
    function sphere(r){ return new THREE.Mesh(new THREE.BoxGeometry(r*1.6,r*1.6,r*1.6), mat); } // cubo en vez de esfera
    function box(w,h,d){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); }
    function cyl(r1,r2,h){ return new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,4), mat); }
    if(featureType==='alas'){
      [-1,1].forEach(side=>{
        const wing = box(.07, ry*.85, rx*.8);
        wing.position.set(side*rx*.78, -ry*.08, -rx*.12);
        wing.rotation.z = side*0.4;
        g.add(wing);
      });
    } else if(featureType==='cuernos'){
      [-1,1].forEach(side=>{
        const horn = cone(.16, ry*.9);
        horn.position.set(side*rx*.45, ry*1.05, 0);
        horn.rotation.z = side*0.3;
        g.add(horn);
      });
    } else if(featureType==='orejas'){
      [-1,1].forEach(side=>{
        const ear = sphere(rx*.28);
        ear.position.set(side*rx*.7, ry*.9, 0);
        g.add(ear);
      });
    } else if(featureType==='aletas'){
      [-1,1].forEach(side=>{
        const fin = box(.06, ry*.6, rx*.6);
        fin.position.set(side*rx*.68, -ry*.1, 0);
        fin.rotation.z = side*0.5;
        g.add(fin);
      });
    } else if(featureType==='antenas'){
      [-1,1].forEach(side=>{
        const stalk = cyl(.03,.05, ry*.8);
        stalk.position.set(side*rx*.35, ry*1.15, 0);
        const tip = sphere(.09);
        tip.position.set(side*rx*.35, ry*1.55, 0);
        g.add(stalk); g.add(tip);
      });
    } else if(featureType==='pinchos'){
      for(let i=-1;i<=1;i++){
        const spike = cone(.14, .5);
        spike.position.set(i*rx*.4, ry*1.05, 0);
        g.add(spike);
      }
    } else if(featureType==='espinas'){
      for(let i=0;i<5;i++){
        const t = i/4;
        const spike = cone(.09,.34);
        spike.position.set(-rx*.6+t*rx*1.2, ry*.75+Math.sin(t*Math.PI)*.25, 0);
        g.add(spike);
      }
    } else if(featureType==='cresta'){
      for(let i=0;i<3;i++){
        const spike = cone(.13-i*.03, .55-i*.12);
        spike.position.set(-.1+i*.15, ry*1.0+i*.12, 0);
        g.add(spike);
      }
    } else if(featureType==='cola'){
      const tail = cyl(.18,.08, ry*1.1);
      tail.position.set(0, -ry*.1, rx*1.1);
      tail.rotation.x = Math.PI/2.4;
      g.add(tail);
    } else if(featureType==='caparazon'){
      for(let i=0;i<3;i++){
        const w = rx*(1.6-i*.4);
        const shell = box(w, .28, w);
        shell.position.set(0, ry*.85+i*.22, 0);
        g.add(shell);
      }
    }
    return g;
  }

  function build3DFace(rx, ry, maturity){
    // boca y cejas — de cría se ven redondas y el sonrojo bien marcado; de adulta la boca se afina
    // y el sonrojo casi desaparece, para que se note que ya no es un bebé
    maturity = maturity||0;
    const g = new THREE.Group();
    const mouthMat = new THREE.MeshStandardMaterial({ color:0x5a2530, roughness:.45, flatShading:true });
    const blushMat = new THREE.MeshBasicMaterial({ color:0xff9ec4, transparent:true, opacity:.55*(1-maturity*.75) });
    const ez = rx*.82;
    const mouthScale = 1 - maturity*.22;
    // boca de 5 tramos pegados entre sí, para que se lea como una curva continua y no como rayitas sueltas
    const segW = rx*.075*mouthScale;
    for(let i=0;i<5;i++){
      const idx = i-2; // -2,-1,0,1,2
      const seg = new THREE.Mesh(new THREE.BoxGeometry(segW*1.05, ry*.055*mouthScale, .055), mouthMat);
      seg.position.set(idx*segW*.92, -ry*.28, ez);
      seg.userData.isMouthSeg = true;
      seg.userData.segIndex = idx;
      seg.userData.baseY = seg.position.y;
      g.add(seg);
    }
    // una naricita pequeña entre los ojos y la boca, para que la cara se lea bien y no haya dudas de qué es qué
    const nose = new THREE.Mesh(new THREE.BoxGeometry(rx*.055,ry*.045,.045), mouthMat);
    nose.position.set(0, ry*.02, ez*1.03);
    g.add(nose);
    // cejas: de cría, finas y altas (dulces); de adulta, algo más gruesas y bajas (seria)
    [-1,1].forEach(s=>{
      const browH = ry*.035 + maturity*ry*.02;
      const brow = new THREE.Mesh(new THREE.BoxGeometry(rx*.16,browH,.05), mouthMat);
      brow.position.set(s*rx*.32, ry*.44 - maturity*ry*.09, ez*.98);
      brow.userData.isBrow = true;
      brow.userData.side = s;
      brow.userData.baseY = brow.position.y;
      g.add(brow);
    });
    // mejillas sonrojadas — de adulta casi transparentes, ya no se sonroja tanto
    if(maturity < .92){
      [-1,1].forEach(s=>{
        const blush = new THREE.Mesh(new THREE.CircleGeometry(rx*.15*(1-maturity*.3), 10), blushMat);
        blush.position.set(s*rx*.52, -ry*.04, ez*1.03);
        g.add(blush);
      });
    }
    return g;
  }

  function build3DEyes(eyeStyle, rx, ry, sleeping, maturity, archetype){
    maturity = maturity||0;
    archetype = archetype||'criatura';
    // de cría, la bola kawaii con brillo doble que ya teníamos. De ahí en adelante (todo lo que no sea
    // infantil), un ojo rasgado con la esquina en punta y una línea de párpado marcada, como en las
    // hojas de referencia de ojos anime — no es solo "la misma bola pero más pequeña"
    const g = new THREE.Group();
    const dark = new THREE.MeshStandardMaterial({ color:0x1a1a2a, roughness:.35, flatShading:true });
    const glow = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x66ffcc, emissiveIntensity:.8, flatShading:true });
    const sparkleMat = new THREE.MeshBasicMaterial({ color:0xffffff });
    const slitMat = new THREE.MeshBasicMaterial({ color:0x0a0a0a });
    const lidMat = new THREE.MeshBasicMaterial({ color:0x0a0a0a });
    function tagEye(mesh){ mesh.userData.isEye = true; mesh.userData.baseScale = mesh.scale.clone(); return mesh; }
    const isBaby = maturity < .32;
    function kawaiiEye(size, mat, addSparkle){
      const grp = new THREE.Group();
      const ball = new THREE.Mesh(new THREE.SphereGeometry(size, 9, 8), mat);
      if(archetype==='bestia'){

      } else if(archetype==='fantasia'){
        ball.scale.set(1.15, .95, .48); // afilados, con porte de reptil
      } else if(archetype==='bicho'){

      } else if(archetype==='humanoide'){
        ball.scale.set(1, 1.05, .48); // más contenidos, menos exagerados que el resto
      } else {
        ball.scale.set(1, 1.3, .5); // el ovalado kawaii clásico de la criatura
      }
      grp.add(ball);
      if(archetype==='fantasia'){
        const slit = new THREE.Mesh(new THREE.BoxGeometry(size*.22, size*1.3, size*.1), slitMat);
        slit.position.set(0,0,size*.42);
        grp.add(slit);
        if(addSparkle){ const sp = new THREE.Mesh(new THREE.SphereGeometry(size*.16,5,5), sparkleMat); sp.position.set(size*.22, size*.32, size*.4); grp.add(sp); }
      } else if(archetype==='bestia'){
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(size*.5,6,6), slitMat);
        pupil.scale.set(.7,1,.6); pupil.position.set(0,0,size*.28);
        grp.add(pupil);
        if(addSparkle){ const sp = new THREE.Mesh(new THREE.SphereGeometry(size*.15,5,5), sparkleMat); sp.position.set(size*.2,size*.22,size*.4); grp.add(sp); }
      } else if(addSparkle){
        const sp1 = new THREE.Mesh(new THREE.SphereGeometry(size*(archetype==='bicho'?.28:.34),6,6), sparkleMat);
        sp1.position.set(size*.32, size*.4, size*.32);
        grp.add(sp1);
        const sp2 = new THREE.Mesh(new THREE.SphereGeometry(size*.17,5,5), sparkleMat);
        sp2.position.set(-size*.18, -size*.12, size*.34);
        grp.add(sp2);
      }
      return grp;
    }
    function animeEye(size, mat){
      // ojo rasgado tipo anime: forma alargada, punta afilada en la esquina exterior, y una línea
      // de párpado gruesa y oscura por encima — el estilo "serio" que pediste para todo lo que no
      // sea una cría
      const grp = new THREE.Group();
      let sx=1.4, sy=.76, sz=.4, tilt=.1;
      if(archetype==='bestia'){ sx=1.5; sy=.62; sz=.42; tilt=.22; }
      else if(archetype==='fantasia'){ sx=1.35; sy=.58; sz=.4; tilt=.28; }
      else if(archetype==='bicho'){ sx=1.15; sy=.95; sz=.55; tilt=.05; }
      else if(archetype==='humanoide'){ sx=1.25; sy=.68; sz=.36; tilt=.06; }
      const lens = new THREE.Mesh(new THREE.SphereGeometry(size,8,6), mat);
      lens.scale.set(sx,sy,sz);
      grp.add(lens);
      // punta afilada en la esquina exterior — el "rasgado" característico
      const corner = new THREE.Mesh(new THREE.ConeGeometry(size*.42,size*.5,3), mat);
      corner.rotation.z = -Math.PI/2;
      corner.scale.set(.8,1,sz/.4);
      corner.position.set(size*sx*.92, size*sy*.15, 0);
      grp.add(corner);
      // línea de párpado: un trazo oscuro y grueso justo encima del ojo, inclinado como en las referencias
      const lid = new THREE.Mesh(new THREE.BoxGeometry(size*(sx*2+.5), size*.22, size*.16), lidMat);
      lid.position.set(-size*.08, size*sy*.85, size*sz*.55);
      lid.rotation.z = tilt;
      grp.add(lid);
      if(archetype==='fantasia'){
        const slit = new THREE.Mesh(new THREE.BoxGeometry(size*.16, size*.9, size*.08), slitMat);
        slit.position.set(0,0,size*sz*.85);
        grp.add(slit);
      } else if(archetype==='bestia'){
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(size*.4,6,6), slitMat);
        pupil.scale.set(.65,1,.5); pupil.position.set(0,0,size*sz*.7);
        grp.add(pupil);
      }
      // un solo brillo, pequeño y anguloso — nada del doble destello de cría
      const sp = new THREE.Mesh(new THREE.SphereGeometry(size*.16,5,5), sparkleMat);
      sp.position.set(size*.18, -size*.1, size*sz*.9);
      grp.add(sp);
      return grp;
    }
    function eyeShape(size, mat, addSparkle){ return isBaby ? kawaiiEye(size, mat, addSparkle) : animeEye(size, mat); }
    const eyeMul = isBaby ? 1 : (1 - Math.min(maturity,1)*.22); // ya no encojo tanto — el cambio real ahora es de forma, no solo de tamaño
    const ez = rx*.82, ey = ry*.15;
    if(sleeping){
      [-1,1].forEach(s=>{ const e=tagEye(new THREE.Mesh(new THREE.BoxGeometry(rx*.26,.05,.05), dark)); e.position.set(s*rx*.32, ey, ez); g.add(e); });
      return g;
    }
    if(eyeStyle==='ciclope'){
      const e = tagEye(eyeShape(rx*.26*eyeMul, dark, true)); e.position.set(0, ey, ez); g.add(e);
    } else if(eyeStyle==='trio'){
      [-1,1].forEach(s=>{ const e=tagEye(eyeShape(rx*.16*eyeMul,dark,true)); e.position.set(s*rx*.32, ey, ez); g.add(e); });
      // el tercer ojo va arriba, en la frente — así se lee claramente como un tercer ojo y no como nariz
      const e3 = tagEye(eyeShape(rx*.13*eyeMul,dark,true)); e3.position.set(0, ey+ry*.4, ez*.92); g.add(e3);
    } else if(eyeStyle==='brillantes'){
      [-1,1].forEach(s=>{ const e=tagEye(eyeShape(rx*.19*eyeMul, glow, true)); e.position.set(s*rx*.32, ey, ez); g.add(e); });
    } else if(eyeStyle==='dormidos'){
      [-1,1].forEach(s=>{ const e=tagEye(new THREE.Mesh(new THREE.BoxGeometry(rx*.24,.04,.04), dark)); e.position.set(s*rx*.32, ey, ez); g.add(e); });
    } else if(eyeStyle==='rasgados'){
      [-1,1].forEach(s=>{ const e=tagEye(eyeShape(rx*.16*eyeMul, dark, true)); e.scale.set(1,1.15,.6); e.userData.baseScale = e.scale.clone(); e.position.set(s*rx*.32, ey, ez); g.add(e); });
    } else {
      [-1,1].forEach(s=>{ const e=tagEye(eyeShape(rx*.2*eyeMul, dark, true)); e.position.set(s*rx*.32, ey, ez); g.add(e); });
    }
    return g;
  }

  function build3DHumanoid(pal){
    // cabeza, torso y las cuatro extremidades por separado, de pie sobre dos piernas — le añado pelo
    // en la cabeza, un peto en el pecho y botas, para que no se quede en cuatro cajas desnudas

    const mat = new THREE.MeshStandardMaterial({ color: pal.body, roughness:.8, flatShading:true, map: makeSkinTexture('piel') });
    const hairMat = new THREE.MeshStandardMaterial({ color: pal.dark, roughness:.7, flatShading:true });
    const head = new THREE.Mesh(new THREE.BoxGeometry(.62,.6,.56), mat);
    head.position.y = 1.05;
    g.add(head);
    // pelo: una capa por encima de la cabeza más un flequillo hacia delante
    const hairTop = new THREE.Mesh(new THREE.BoxGeometry(.66,.16,.6), hairMat);
    hairTop.position.set(0, 1.38, .0);
    g.add(hairTop);
    const fringe = new THREE.Mesh(new THREE.BoxGeometry(.6,.12,.15), hairMat);
    fringe.position.set(0, 1.27, .27);
    g.add(fringe);
    [-1,1].forEach(s=>{
      const sideHair = new THREE.Mesh(new THREE.BoxGeometry(.08,.35,.5), hairMat);
      sideHair.position.set(s*.33, 1.12, 0);

    });
    const torso = new THREE.Mesh(new THREE.BoxGeometry(.78,.9,.46), mat);
    torso.position.y = .32;
    g.add(torso);
    // peto/pechera, un tono más oscuro que el cuerpo, para que se lea como ropa y no piel desnuda
    const vest = new THREE.Mesh(new THREE.BoxGeometry(.66,.7,.1), new THREE.MeshStandardMaterial({color:pal.dark, roughness:.7, flatShading:true}));
    vest.position.set(0,.36,.28);
    g.add(vest);
    [-1,1].forEach(side=>{
      const arm = new THREE.Mesh(new THREE.BoxGeometry(.22,.85,.24), mat);
      arm.position.set(side*.52, .28, 0);
      arm.rotation.z = side*-.12;
      g.add(arm);
      // hombrera, mas oscura, marcando donde termina el brazo y empieza el torso
      const pauldron = new THREE.Mesh(new THREE.BoxGeometry(.28,.16,.3), hairMat);
      pauldron.position.set(side*.5,.68,0);
      g.add(pauldron);
      // guante en la mano, mismo tono que las botas
      const glove = new THREE.Mesh(new THREE.BoxGeometry(.24,.2,.26), hairMat);
      glove.position.set(side*.56,-.16,0);
      g.add(glove);
      const leg = new THREE.Mesh(new THREE.BoxGeometry(.26,.85,.28), mat);
      leg.position.set(side*.24, -.68, 0);
      g.add(leg);
      // botas, mas oscuras, en la base de cada pierna
      const boot = new THREE.Mesh(new THREE.BoxGeometry(.3,.24,.34), hairMat);
      boot.position.set(side*.24, -1.06, .03);
      g.add(boot);
    });
    // cinturon marcando la cintura, y un pequeño emblema en el centro del peto
    const belt = new THREE.Mesh(new THREE.BoxGeometry(.7,.1,.42), hairMat);
    belt.position.set(0,-.14,.28);
    g.add(belt);
    const emblem = new THREE.Mesh(new THREE.BoxGeometry(.14,.14,.04), new THREE.MeshStandardMaterial({color:pal.accent, roughness:.4, metalness:.3, flatShading:true}));
    emblem.position.set(0,.42,.34);
    g.add(emblem);
    return { group:g, headAnchor:{y:1.05, rx:.55, ry:.5, z:0} };
  }
  function build3DBeast(pal){
    // torso horizontal a cuatro patas — ahora con careta clara en el hocico (como en las referencias de
    // lobo), hocico que sobresale de verdad, garras individuales en cada pata, y una marca de "silla"
    // más oscura en el lomo — antes era una caja lisa sin ninguna de estas marcas de verdad
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: pal.body, roughness:.8, flatShading:true, map: makeSkinTexture('pelo') });
    const furMat = new THREE.MeshStandardMaterial({ color: pal.dark, roughness:.9, flatShading:true });
    const maskMat = new THREE.MeshStandardMaterial({ color: pal.belly, roughness:.75, flatShading:true, map: makeSkinTexture('pelo') });
    const clawMat = new THREE.MeshStandardMaterial({ color: 0xf0ead8, roughness:.4, flatShading:true });
    const torso = new THREE.Mesh(new THREE.BoxGeometry(.8,.72,1.5), mat);
    torso.position.y = -.05;
    g.add(torso);
    // marca de "silla" más oscura sobre el lomo, pegada al cuerpo, no flotando
    const saddle = new THREE.Mesh(new THREE.BoxGeometry(.62,.1,1.2), furMat);
    saddle.position.set(0,.32,-.05);
    g.add(saddle);
    const head = new THREE.Mesh(new THREE.BoxGeometry(.6,.56,.55), mat);
    head.position.set(0, .12, .92);
    g.add(head);
    // hocico: sobresale de verdad al frente de la cabeza, con la careta clara característica
    const muzzle = new THREE.Mesh(new THREE.BoxGeometry(.4,.34,.32), maskMat);
    muzzle.position.set(0,-.08,1.28);
    g.add(muzzle);
    const noseTip = new THREE.Mesh(new THREE.BoxGeometry(.13,.1,.06), new THREE.MeshStandardMaterial({color:0x1a1210, flatShading:true}));
    noseTip.position.set(0,-.02,1.45);
    g.add(noseTip);
    // orejas puntiagudas con un mechón en la punta y el interior más claro
    [-1,1].forEach(s=>{
      const ear = new THREE.Mesh(new THREE.ConeGeometry(.09,.22,5), mat);
      ear.position.set(s*.22, .48, .95);
      g.add(ear);
      const earInner = new THREE.Mesh(new THREE.ConeGeometry(.05,.14,5), maskMat);
      earInner.position.set(s*.22, .43, 1.0);
      g.add(earInner);
      const tuft = new THREE.Mesh(new THREE.ConeGeometry(.05,.1,4), furMat);
      tuft.position.set(s*.22, .6, .95);
      g.add(tuft);
    });
    // melena de mechones a lo largo del lomo, del cuello a media espalda
    for(let i=0;i<5;i++){
      const tuft = new THREE.Mesh(new THREE.ConeGeometry(.11,.24,4), furMat);
      tuft.position.set(0, .38, .68-i*.28);
      tuft.rotation.x = -.3;
      g.add(tuft);
    }
    // pelaje del pecho, mas claro, a juego con la careta del hocico
    const chestFur = new THREE.Mesh(new THREE.BoxGeometry(.5,.4,.15), maskMat);
    chestFur.position.set(0,-.15,1.15);
    g.add(chestFur);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
      const leg = new THREE.Mesh(new THREE.BoxGeometry(.22,.62,.22), mat);
      leg.position.set(sx*.32, -.66, sz*.5);
      g.add(leg);
      // "calcetín" de pelo mas oscuro en la pata
      const paw = new THREE.Mesh(new THREE.BoxGeometry(.24,.14,.24), furMat);
      paw.position.set(sx*.32, -.94, sz*.5);
      g.add(paw);
      // dedos y garras individuales, en vez de una pata lisa de un solo bloque
      for(let t=-1;t<=1;t++){
        const toe = new THREE.Mesh(new THREE.BoxGeometry(.06,.05,.09), furMat);
        toe.position.set(sx*.32+t*.07, -1.01, sz*.5+.11);
        g.add(toe);
        const claw = new THREE.Mesh(new THREE.ConeGeometry(.025,.06,4), clawMat);
        claw.position.set(sx*.32+t*.07, -1.03, sz*.5+.16);
        claw.rotation.x = Math.PI/2.2;
        g.add(claw);
      }
    });
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(.1,.2,.9,5), mat);
    tail.position.set(0,.05,-.95);
    tail.rotation.x = Math.PI/2.3;
    g.add(tail);
    // borla de pelo en la punta de la cola
    const tailTuft = new THREE.Mesh(new THREE.SphereGeometry(.16,7,6), furMat);
    tailTuft.position.set(0,.42,-1.35);
    g.add(tailTuft);
    return { group:g, headAnchor:{y:.12, rx:.5, ry:.45, z:.95} };
  }
  function build3DFantasy(pal){
    // dragón de verdad: un torso grande y compacto, cuello fino que se curva hacia la cabeza por
    // separado (no un cuerpo que se va estrechando poco a poco), alas grandes anclas arriba del lomo,
    // y patas en dos tramos con garras — calcado de la anatomía de dragón de las referencias, no una
    // serpiente con alas pegadas encima
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: pal.body, roughness:.75, flatShading:true, map: makeSkinTexture('escama') });
    const spikeMat = new THREE.MeshStandardMaterial({ color: pal.dark, roughness:.6, flatShading:true });
    const bellyMat = new THREE.MeshStandardMaterial({ color: pal.belly, roughness:.6, flatShading:true });
    const membraneMat = new THREE.MeshStandardMaterial({ color: pal.belly, roughness:.5, flatShading:true, side:THREE.DoubleSide, transparent:true, opacity:.88 });
    const clawMat = new THREE.MeshStandardMaterial({ color:0xf0ead8, roughness:.4, flatShading:true });
    // torso: un bloque grande y compacto, no segmentos que se van estrechando
    const torso = new THREE.Mesh(new THREE.BoxGeometry(.85,.62,.95), mat);
    torso.position.set(0,.08,-.05);
    g.add(torso);
    const bellyTorso = new THREE.Mesh(new THREE.BoxGeometry(.5,.22,.85), bellyMat);
    bellyTorso.position.set(0,-.18,-.05);
    g.add(bellyTorso);
    // púas a lo largo del lomo del torso
    for(let i=0;i<3;i++){
      const spike = new THREE.Mesh(new THREE.ConeGeometry(.07,.18,4), spikeMat);
      spike.position.set(0,.42,.28-i*.28);
      g.add(spike);
    }
    // cuello: dos tramos finos que se curvan hacia arriba y adelante, separados del torso — así se
    // lee como cuello de verdad, no como el cuerpo que sigue estrechándose
    const neckBase = new THREE.Group();
    neckBase.position.set(0,.28,.42);
    neckBase.rotation.x = -.3;
    const neck1 = new THREE.Mesh(new THREE.BoxGeometry(.36,.36,.4), mat);
    neck1.position.set(0,0,.18);
    neckBase.add(neck1);
    const neckSpike1 = new THREE.Mesh(new THREE.ConeGeometry(.05,.14,4), spikeMat);
    neckSpike1.position.set(0,.24,.18);
    neckBase.add(neckSpike1);
    g.add(neckBase);
    const neckTip = new THREE.Group();
    neckTip.position.set(0,.1,.32);
    neckTip.rotation.x = -.22;
    const neck2 = new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.36), mat);
    neck2.position.set(0,0,.16);
    neckTip.add(neck2);
    neckBase.add(neckTip);
    // cabeza, al final del cuello, con hocico marcado y dientes
    const head = new THREE.Group();
    head.position.set(0,.05,.34);
    const skull = new THREE.Mesh(new THREE.BoxGeometry(.32,.28,.3), mat);
    head.add(skull);
    const snout = new THREE.Mesh(new THREE.BoxGeometry(.2,.16,.26), mat);
    snout.position.set(0,-.06,.24);
    head.add(snout);
    const jaw = new THREE.Mesh(new THREE.BoxGeometry(.17,.06,.24), bellyMat);
    jaw.position.set(0,-.14,.24);
    head.add(jaw);
    for(let t=-1;t<=1;t+=2){
      const tooth = new THREE.Mesh(new THREE.ConeGeometry(.015,.05,3), clawMat);
      tooth.position.set(t*.06,-.1,.35);
      tooth.rotation.x = Math.PI;
      head.add(tooth);
    }
    [-1,1].forEach(s=>{
      const crest = new THREE.Mesh(new THREE.ConeGeometry(.05,.16,4), spikeMat);
      crest.position.set(s*.1,.16,.06);
      crest.rotation.z = s*.35;
      head.add(crest);
    });
    neckTip.add(head);
    // alas grandes, ancladas arriba del torso (como en las referencias, no a media espalda)
    [-1,1].forEach(side=>{
      const wingFrame = new THREE.Mesh(new THREE.BoxGeometry(.07,1.1,.18), spikeMat);
      wingFrame.position.set(side*.48,.55,-.15);
      wingFrame.rotation.z = side*.55;
      wingFrame.rotation.y = side*.18;
      g.add(wingFrame);
      const wingMembrane = new THREE.Mesh(new THREE.PlaneGeometry(1.0,1.25), membraneMat);
      wingMembrane.position.set(side*.52,.5,-.15);
      wingMembrane.rotation.z = side*.55;
      wingMembrane.rotation.y = side*(.18+1.5708);
      g.add(wingMembrane);
      for(let r=0;r<3;r++){
        const rib = new THREE.Mesh(new THREE.BoxGeometry(.02,1.0-r*.2,.05), spikeMat);
        rib.position.set(side*(.48+.03),.55-r*.06,-.15+.36-r*.32);
        rib.rotation.z = side*.55;
        g.add(rib);
      }
    });
    // patas en dos tramos (muslo + espinilla), con garras — en vez de una sola caja recta por pata
    [[-1,-1,'front'],[1,-1,'front'],[-1,1,'back'],[1,1,'back']].forEach(([sx,sz])=>{
      const legX = sx*.42, legZ = sz<0 ? .28 : -.35;
      const thigh = new THREE.Mesh(new THREE.BoxGeometry(.2,.32,.22), mat);
      thigh.position.set(legX,-.28,legZ);

      const shin = new THREE.Mesh(new THREE.BoxGeometry(.16,.3,.18), mat);
