<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BYTEMON — Tu mascota digital</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
  :root{
    --shell:#1c1c1e;
    --shell-hi:#2c2c30;
    --shell-lo:#0a0a0b;
    --screen:#0a1712;
    --ink:#eaf2ee;
    --muted:#8592a0;
    --luz:#5eff9e;
    --sombra:#ff4d8d;
    --equilibrio:#ffb84d;
    --accent:#8fe3a0;
    --danger:#ff5c5c;
    --devred:#d81c2b;
    --devred-dk:#7a0f18;
    --devred-lt:#f04552;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 0%,#2a3142,#0d0f16 70%);
    font-family:'Nunito',sans-serif;color:var(--ink);padding:18px;
  }
  .device{
    width:100%;max-width:380px;background:linear-gradient(160deg,var(--shell-hi),var(--shell) 40%,var(--shell-lo));
    border-radius:26px;padding:18px 18px 22px;box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    border:1px solid #000;position:relative;
  }
  .device-top{display:flex;justify-content:space-between;align-items:center;padding:0 10px 10px;}
  .device-top .knob{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3a3e,#0a0a0b);box-shadow:inset 0 0 0 1px #000;}
  .device-top .slider{width:26px;height:8px;border-radius:4px;background:linear-gradient(90deg,#0a0a0b,#2c2c30);box-shadow:inset 0 0 0 1px #000;}
  .keyring{
    position:absolute;top:-11px;right:26px;width:20px;height:20px;border-radius:50%;
    border:3px solid #9aa0a6;box-shadow:0 1px 2px rgba(0,0,0,.5);background:transparent;
  }
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 14px;}
  .brand{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;color:var(--accent2,var(--ink));}
  .brand span{color:var(--luz);}
  .agebadge{font-size:11px;color:var(--muted);font-weight:700;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .mutebtn{font-size:15px;cursor:pointer;user-select:none;line-height:1;}
  .screen-bezel{
    position:relative;border-radius:16px;padding:15px;
    background:
      radial-gradient(circle 4px at 15px 15px, #1a1a1a 95%, transparent 97%),
      radial-gradient(circle 4px at calc(100% - 15px) 15px, #1a1a1a 95%, transparent 97%),
      radial-gradient(circle 4px at 15px calc(100% - 15px), #1a1a1a 95%, transparent 97%),
      radial-gradient(circle 4px at calc(100% - 15px) calc(100% - 15px), #1a1a1a 95%, transparent 97%),
      linear-gradient(160deg,var(--devred-lt),var(--devred) 45%,var(--devred-dk));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 0 3px 8px rgba(0,0,0,.4);
  }
  .screen-inner{position:relative;border-radius:10px;overflow:hidden;background:var(--screen);}
  canvas#screen{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;}
  .scanlines{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 4px);
    mix-blend-mode:multiply;
  }
  .glowring{
    position:absolute;inset:-2px;border-radius:12px;pointer-events:none;
    box-shadow:0 0 22px 2px var(--glow, transparent) inset;transition:box-shadow .6s;
  }
  .hud{
    position:absolute;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;
    font-family:'Press Start 2P',monospace;font-size:8px;color:var(--luz);text-shadow:0 0 4px rgba(0,0,0,.9);
  }
  .pathtag{position:absolute;bottom:6px;right:8px;font-family:'Press Start 2P',monospace;font-size:7px;
    color:var(--tagcolor,#666);text-shadow:0 0 4px rgba(0,0,0,.9);}
  .stats{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
  .stat-row{display:flex;align-items:center;gap:8px;}
  .stat-icon{font-size:14px;width:18px;text-align:center;}
  .bar-track{flex:1;height:9px;border-radius:5px;background:#000;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;transition:width .4s ease;}
  .fill-sac{background:linear-gradient(90deg,#ffb84d,#ffd98a);}
  .fill-happy{background:linear-gradient(90deg,#ff8fd0,#ffc2e8);}
  .fill-energy{background:linear-gradient(90deg,#5ec8ff,#a7e6ff);}
  .fill-health{background:linear-gradient(90deg,#5eff9e,#baffcf);}
  .fill-hyg{background:linear-gradient(90deg,#c9a0ff,#e6d3ff);}
  .effects-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:0;}
  .effect-chip{font-size:10px;font-weight:800;padding:4px 9px;border-radius:8px;}
  .effect-empacho{background:rgba(255,184,77,.15);color:#ffb84d;border:1px solid rgba(255,184,77,.4);}
  .effect-letargo{background:rgba(255,92,92,.15);color:#ff5c5c;border:1px solid rgba(255,92,92,.4);}
  .effect-racha{background:rgba(94,255,158,.15);color:#5eff9e;border:1px solid rgba(94,255,158,.4);}
  .controls{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  button{
    font-family:'Nunito',sans-serif;font-weight:800;font-size:7.5px;letter-spacing:.2px;color:#fff;
    background:linear-gradient(160deg,var(--devred-lt),var(--devred-dk));border:2px solid #4a0810;
    border-radius:50%;aspect-ratio:1/1;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 4px 0 #4a0810, inset 0 1px 0 rgba(255,255,255,.3);
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #4a0810;}
  button:disabled{opacity:.35;filter:grayscale(.6);}
  button .ico{font-size:19px;}
  .status-btn{
    grid-column:span 3;aspect-ratio:auto;border-radius:24px;flex-direction:row;gap:8px;padding:11px;font-size:12px;
  }
  .status-btn .ico{font-size:16px;}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#0d0f16;border:1px solid #333;color:var(--ink);padding:9px 16px;border-radius:10px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(5,6,10,.7);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:20;
  }
  .modal{background:var(--shell);border-radius:20px;padding:20px;max-width:340px;width:100%;border:1px solid #000;
    box-shadow:0 20px 50px rgba(0,0,0,.6);}
  .modal h3{margin:0 0 12px;font-family:'Press Start 2P',monospace;font-size:12px;color:var(--luz);}
  .modal-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);}
  .modal-row b{color:var(--ink);}
  .modal-row span{color:var(--muted);}
  .modal input[type=text]{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid #000;background:#11141c;color:var(--ink);
    font-family:'Nunito';font-weight:700;margin-top:8px;font-size:13px;
  }
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;}
  .close-x{background:none;border:none;box-shadow:none;color:var(--muted);font-size:20px;position:absolute;top:14px;right:16px;padding:0;}
  .modal{position:relative;}
  .gameover{text-align:center;}
  .gameover .ico{font-size:40px;}
  .footnote{font-size:10.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5;}
  .tabrow{display:flex;gap:8px;margin-bottom:14px;}
  .tabrow button{flex:1;padding:8px;}
  .tabrow button.active{background:linear-gradient(160deg,var(--luz),#2a9);color:#0a1712;}
  .vs{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .fighter{flex:1;text-align:center;}
  .fighter b{display:block;font-size:13px;}
  .fighter small{color:var(--muted);}
  .hpbar{height:10px;border-radius:5px;background:#000;margin-top:6px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);}
  .hpfill{height:100%;background:linear-gradient(90deg,#5eff9e,#baffcf);transition:width .4s;}
  .vslabel{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--muted);}
  .movegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .battlelog{background:#0a1712;border-radius:10px;padding:10px;font-size:12px;color:var(--muted);
    max-height:110px;overflow-y:auto;margin-top:12px;line-height:1.5;}
  .challenge-item{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;
    border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;}
  .challenge-item button{padding:6px 12px;}
  .small-note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .game-hud{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;}
  .game-area{position:relative;height:210px;background:#0a1712;border-radius:10px;overflow:hidden;margin-top:8px;border:1px solid #000;}
  .game-item{position:absolute;font-size:22px;transform:translate(-50%,-50%);pointer-events:none;}
  .game-basket{position:absolute;bottom:6px;width:15%;height:20px;background:var(--devred);border-radius:6px;transform:translateX(-50%);box-shadow:0 0 0 2px #000;}
  .game-zone{position:absolute;top:0;bottom:0;width:50%;}
  .memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;}
  .memcard{aspect-ratio:1/1;font-size:20px;border-radius:8px;background:linear-gradient(160deg,#333a4d,#20242f);border:1px solid #000;color:#fff;}
  .memcard.matched{opacity:.5;}
  .simon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}
  .simon-btn{aspect-ratio:1/1;border-radius:14px;opacity:.5;transition:opacity .15s, transform .1s;border:2px solid #000;box-shadow:none;}
  .simon-btn.lit{opacity:1;transform:scale(1.05);}
  .simon-red{background:#ff4d4d;} .simon-green{background:#4dff88;} .simon-blue{background:#4d9dff;} .simon-yellow{background:#ffe14d;}
</style>

<script>
(function(){
  // =======================================================================
  // Esto es lo que tengo que rellenar si algún día alojo esto fuera de Claude
  // Si lo abro dentro de Claude no toco nada, usa su propio almacenamiento.
  // Si lo subo a mi hosting (Netlify, GitHub Pages...), pongo aquí los datos
  // de mi proyecto Firebase gratuito (ya lo tengo hecho, es el "vpet")
  // =======================================================================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyA9ugnLWynAjK4TpFnHwWW-BkXfo_ljWsA",
    authDomain: "vpet-77c73.firebaseapp.com",
    projectId: "vpet-77c73",
    storageBucket: "vpet-77c73.firebasestorage.app",
    messagingSenderId: "556197497383",
    appId: "1:556197497383:web:cbf509f199450fa04a9c02"
  };

  // ---------- cómo guardo los datos ----------
  // Dentro de Claude uso window.storage, ya viene separado por usuario solo.
  // Si lo tengo alojado fuera, uso Firestore + login anónimo: cada móvil o
  // navegador saca su propio uid, así mis datos nunca se mezclan entre
  // dispositivos. Lo "shared" (arena, ranking) sí lo ve todo el mundo,
  // igual que pasaba dentro de Claude.
  const CloudAdapter = (function(){
    const hasClaudeStorage = typeof window !== 'undefined' && !!window.storage;
    let fbReady = null;
    let uid = null;

    function initFirebase(){
      if(fbReady) return fbReady;
      fbReady = new Promise((resolve)=>{
        if(typeof firebase === 'undefined'){ resolve(false); return; }
        try{
          firebase.initializeApp(FIREBASE_CONFIG);
          const auth = firebase.auth();
          auth.onAuthStateChanged((user)=>{
            if(user){ uid = user.uid; resolve(true); }
            else { auth.signInAnonymously().catch(()=>resolve(false)); }
          });
        }catch(e){ console.error('Firebase no configurado o inválido:', e); resolve(false); }
      });
      return fbReady;
    }

    function docRef(db, key, shared){
      if(shared) return db.collection('shared_kv').doc(key);
      return db.collection('users').doc(uid).collection('data').doc(key);
    }

    async function get(key, shared){
      if(hasClaudeStorage){
        try{ return await window.storage.get(key, !!shared); }catch(e){ return null; }
      }
      const ok = await initFirebase();
      if(!ok) return null;
      const db = firebase.firestore();
      try{
        const doc = await docRef(db, key, shared).get();
        if(!doc.exists) return null;
        return { key, value: doc.data().value, shared: !!shared };
      }catch(e){ return null; }
    }

    async function set(key, value, shared){
      if(hasClaudeStorage){
        try{ return await window.storage.set(key, value, !!shared); }catch(e){ return null; }
      }
      const ok = await initFirebase();
      if(!ok) return null;
      const db = firebase.firestore();
      try{
        await docRef(db, key, shared).set({ value, updatedAt: Date.now() });
        return { key, value, shared: !!shared };
      }catch(e){ return null; }
    }

    return { get, set };
  })();

  const STORAGE_KEY = 'bytemon:pet';
  const GRID = 24;
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const cell = canvas.width / GRID;

  // ---------- mis sonidos, los genero yo mismo con osciladores (nada de archivos de audio) ----------
  let audioCtx = null;
  let soundOn = true;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); }
  }
  function beep(freq, duration, type, delay, peakGain){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay||0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peakGain!==undefined?peakGain:0.15, t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+duration+0.03);
  }
  function sfx(name){
    if(!soundOn) return;
    ensureAudio();
    if(!audioCtx) return;
    switch(name){
      case 'tap':     beep(700,0.05,'square',0,0.07); break;
      case 'feed':    beep(520,0.09,'square',0); beep(760,0.09,'square',0.08); break;
      case 'play':    beep(600,0.07,'square',0); beep(760,0.07,'square',0.08); beep(940,0.09,'square',0.16); break;
      case 'clean':   beep(300,0.12,'sawtooth',0,0.08); beep(520,0.1,'sawtooth',0.08,0.08); break;
      case 'sleep':   beep(520,0.12,'sine',0,0.08); beep(360,0.18,'sine',0.1,0.08); break;
      case 'wake':    beep(360,0.1,'sine',0,0.08); beep(560,0.14,'sine',0.09,0.08); break;
      case 'heal':    beep(700,0.08,'triangle',0); beep(900,0.08,'triangle',0.08); beep(1100,0.12,'triangle',0.16); break;
      case 'hatch':   beep(500,0.1,'square',0); beep(700,0.1,'square',0.1); beep(950,0.18,'square',0.2); break;
      case 'evolve':  beep(400,0.1,'square',0); beep(600,0.1,'square',0.1); beep(800,0.1,'square',0.2); beep(1050,0.22,'square',0.3); break;
      case 'mistake': beep(220,0.16,'sawtooth',0,0.09); break;
      case 'hit':     beep(150,0.1,'square',0,0.12); break;
      case 'win':     beep(600,0.1,'square',0); beep(800,0.1,'square',0.1); beep(1000,0.1,'square',0.2); beep(1300,0.22,'square',0.3); break;
      case 'lose':    beep(500,0.15,'sawtooth',0); beep(380,0.15,'sawtooth',0.15); beep(260,0.28,'sawtooth',0.3); break;
      case 'death':   beep(300,0.2,'sawtooth',0); beep(200,0.2,'sawtooth',0.2); beep(120,0.38,'sawtooth',0.4); break;
    }
  }

  const STAGE_NAMES = ['HUEVO','CRÍA','PEQUEÑO','JOVEN','PERFECTO','SUPREMO'];
  const PATH_LABEL = {luz:'SENDA: LUZ', sombra:'SENDA: SOMBRA', equilibrio:'SENDA: EQUILIBRIO'};
  const PATH_COLOR = {luz:'#5eff9e', sombra:'#ff4d8d', equilibrio:'#ffb84d'};
  // ---------- generador de especies (mi PRNG con semilla, para que cada mascota sea consistente) ----------
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const SYLLABLES = {
    luz:        ['Ae','Vel','Ser','Lir','Or','Wyn','Ith','Cel','Ael','Nyra','Sol','Ily'],
    sombra:     ['Fang','Grim','Vex','Drak','Nox','Krev','Zhul','Morg','Ash','Rax','Vor','Sker'],
    equilibrio: ['Tan','Kai','Doro','Bal','Sen','Mira','Tazu','Ren','Vio','Tol','Nim','Quor']
  };
  function proceduralName(path, temperament, seed){
    const rand = mulberry32(seed);
    const pool = SYLLABLES[path];
    const preferLong = temperament==='Tranquilo';
    const count = rand() < (preferLong ? 0.4 : 0.7) ? 2 : 3;
    let parts=[], last=null;
    for(let i=0;i<count;i++){
      let s;
      do{ s = pool[Math.floor(rand()*pool.length)]; } while(s===last && pool.length>1);
      parts.push(s.toLowerCase());
      last = s;
    }
    let name = parts.join('');
    return name.charAt(0).toUpperCase()+name.slice(1);
  }
  function speciesDisplay(pet){
    if(!pet.speciesName) return STAGE_NAMES[pet.stage];
    if(pet.stage===4) return pet.speciesName+' Mayor';
    if(pet.stage===5) return pet.speciesName+' Supremo';
    return pet.speciesName;
  }

  const AGE_HATCH = 3;
  const LEVEL_CHILD = 3;
  const LEVEL_ADULT = 8;
  const LEVEL_PERFECT = 15;
  const LEVEL_ULTIMATE = 25;
  const TICK_MS = 4000;
  const SICK_DEATH_TICKS = 14;

  function freshPet(){
    return {
      name:'Compi', stage:0, path:null,
      sac:80, happy:80, energy:80, health:100, hyg:100,
      poops:0, poopTimer:0,
      age:0, mistakes:0, sick:false, sickTicks:0, sleeping:false, alive:true,
      sumHappy:0, sumSac:0, sumHyg:0, ticks:0,
      lastMistakeFlags:{sac:false,happy:false,hyg:false},
      temperament:null, feedCount:0, playCount:0, speciesName:null,
      empachoTicks:0, activeEffects:[],
      speciesSeed:null, hue:0, bodyShape:'redondo', featureType:'alas', eyeStyle:'redondos', pattern:'liso',
      level:1, xp:0, xpNext:10, stats:{atq:5, def:5, mag:5, res:5, vel:5}, affinity:null,
      lastSaved: Date.now(), frame:0
    };
  }

  let pet = freshPet();
  let hasLoaded = false;

  async function loadPet(){
    try{
      const res = await CloudAdapter.get(STORAGE_KEY, false);
      if(res && res.value){
        const loaded = JSON.parse(res.value);
        pet = Object.assign(freshPet(), loaded);
        catchUp();
      }
    }catch(e){ /* no había mascota guardada, me quedo con el huevo nuevo */ }
    hasLoaded = true;
    render();
  }

  async function savePet(){
    pet.lastSaved = Date.now();
    try{ await CloudAdapter.set(STORAGE_KEY, JSON.stringify(pet), false); }catch(e){ /* si falla el guardado no pasa nada, lo intento en el siguiente tick */ }
  }

  function catchUp(){
    if(!pet.alive) return;
    const elapsedMs = Date.now() - (pet.lastSaved || Date.now());
    let missedTicks = Math.floor(elapsedMs / TICK_MS);
    missedTicks = Math.max(0, Math.min(missedTicks, 60));
    for(let i=0;i<missedTicks;i++){ tick(false); }
  }

  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function computePath(){
    const avgHappy = pet.ticks ? pet.sumHappy/pet.ticks : pet.happy;
    if(pet.mistakes <= 2 && avgHappy >= 70) return 'luz';
    if(pet.mistakes >= 6 || avgHappy < 40) return 'sombra';
    return 'equilibrio';
  }

  function weightedPick(rand, options, weights){
    const total = weights.reduce((a,b)=>a+b,0);
    let r = rand()*total;
    for(let i=0;i<options.length;i++){
      r -= weights[i];
      if(r<=0) return options[i];
    }
    return options[options.length-1];
  }

  function checkEvolution(){
    if(pet.stage===0 && pet.age>=AGE_HATCH){ pet.stage=1; showToast('¡El huevo ha eclosionado!'); sfx('hatch'); }
    else if(pet.stage===1 && pet.level>=LEVEL_CHILD){
      pet.temperament = pet.playCount > pet.feedCount ? 'Activo' : 'Tranquilo';
      pet.stage=2;
      showToast(pet.name+' ha crecido — temperamento '+pet.temperament);
      sfx('evolve');
    }
    else if(pet.stage===2 && pet.level>=LEVEL_ADULT){
      pet.path = computePath();
      pet.affinity = computeAffinity();
      pet.speciesSeed = Math.floor(Math.random()*4294967295);
      pet.speciesName = proceduralName(pet.path, pet.temperament, pet.speciesSeed);
      const rand2 = mulberry32(pet.speciesSeed+1);
      pet.hue = Math.floor(rand2()*360);

      const shapeOpts = ['redondo','anguloso','alargado','compacto'];
      const featOpts = ['alas','cuernos','orejas','aletas','antenas','pinchos'];
      const AFFINITY_WEIGHTS = {
        atq:        { shape:[1,2.2,0.6,1.6], feat:[0.5,2.2,0.8,1,0.5,2] },
        def:        { shape:[1.4,0.8,0.5,2.2], feat:[0.5,1,2,2,0.5,1.4] },
        mag:        { shape:[1.6,0.5,2,0.6], feat:[2.2,0.5,0.8,0.6,2.2,0.5] },
        res:        { shape:[2,0.6,0.8,1.4], feat:[1.4,0.6,2.2,1,1,0.6] },
        vel:        { shape:[1,0.6,2.2,0.8], feat:[2,0.5,0.6,1.4,2,0.5] },
        equilibrado:{ shape:[1,1,1,1], feat:[1,1,1,1,1,1] }
      };
      const w = AFFINITY_WEIGHTS[pet.affinity] || AFFINITY_WEIGHTS.equilibrado;
      pet.bodyShape = weightedPick(rand2, shapeOpts, w.shape);
      pet.featureType = weightedPick(rand2, featOpts, w.feat);
      pet.eyeStyle = ['redondos','rasgados','ciclope','trio'][Math.floor(rand2()*4)];
      pet.pattern = ['liso','manchas','rayas','estrellado'][Math.floor(rand2()*4)];
      pet.stage=3;
      showToast(pet.name+' ha digievolucionado en '+pet.speciesName+' — '+PATH_LABEL[pet.path]);
      sfx('evolve');
    }
    else if(pet.stage===3 && pet.level>=LEVEL_PERFECT){ pet.stage=4; showToast(pet.name+' alcanzó su forma Perfecta.'); sfx('evolve'); }
    else if(pet.stage===4 && pet.level>=LEVEL_ULTIMATE){ pet.stage=5; showToast(pet.name+' alcanzó su forma Suprema.'); sfx('evolve'); }
  }

  const STAT_KEYS = ['atq','def','mag','res','vel'];
  const STAT_LABEL = {atq:'Ataque', def:'Defensa', mag:'Magia', res:'Resistencia', vel:'Velocidad'};
  function gainXp(amount){
    if(pet.stage===0 || !pet.alive) return;
    pet.xp += amount;
    while(pet.xp >= pet.xpNext){
      pet.xp -= pet.xpNext;
      pet.level += 1;
      pet.xpNext = Math.round(pet.xpNext*1.35 + 5);
      const gains = STAT_KEYS.map(k=>{
        const up = 1+Math.floor(Math.random()*4);
        pet.stats[k] += up;
        return up;
      });
      const best = STAT_KEYS.reduce((a,b,i)=>gains[i]>gains[STAT_KEYS.indexOf(a)]?b:a, STAT_KEYS[0]);
      showToast('¡'+pet.name+' subió a nivel '+pet.level+'! ('+STAT_LABEL[best]+' +'+gains[STAT_KEYS.indexOf(best)]+')');
    }
  }
  function computeAffinity(){
    const s = pet.stats;
    let best = STAT_KEYS[0];
    STAT_KEYS.forEach(k=>{ if(s[k]>s[best]) best=k; });
    const tiedTop = STAT_KEYS.filter(k=>s[k]===s[best]);
    return tiedTop.length>1 ? 'equilibrado' : best;
  }

  function tick(doRender){
    if(!pet.alive) return;
    pet.age += 1;
    pet.ticks += 1;
    pet.sumHappy += pet.happy;
    pet.sumSac += pet.sac;
    pet.sumHyg += pet.hyg;

    if(pet.stage>0){
      if(pet.sleeping){
        pet.energy = clamp(pet.energy + 6);
        pet.sac = clamp(pet.sac - 1);
        pet.happy = clamp(pet.happy - 1);
        pet.activeEffects = [];
      } else {
        const isEmpacho = pet.empachoTicks>0;
        const isLetargo = pet.energy<=5;
        const isRacha = pet.sac>60 && pet.happy>60 && pet.hyg>60 && pet.health>=80;

        // el hambre y el ánimo casi no bajan: solo se mueven de verdad cada 3 turnos
        if(pet.ticks % 3 === 0 || isLetargo){
          const sacDecay = 1 + (isLetargo?2:0);
          const happyDecay = 1 + (isEmpacho?2:0) + (isLetargo?1:0) - (isRacha?3:0);
          pet.sac = clamp(pet.sac - sacDecay);
          pet.happy = clamp(pet.happy - happyDecay);
        }
        if(pet.ticks % 2 === 0){ pet.energy = clamp(pet.energy - 1); }
        if(isRacha){ pet.health = clamp(pet.health + 2); }
        if(pet.empachoTicks>0){ pet.empachoTicks--; }

        pet.activeEffects = [];
        if(isEmpacho) pet.activeEffects.push('empacho');
        if(isLetargo) pet.activeEffects.push('letargo');
        if(isRacha) pet.activeEffects.push('racha');
      }

      if(pet.poopTimer>0){
        pet.poopTimer -= 1;
        if(pet.poopTimer===0 && pet.poops<4){ pet.poops += 1; }
      }
      pet.hyg = clamp(100 - pet.poops*14);

      // aquí cuento los fallos de cuidado, solo una vez cada vez que la barra toca fondo
      const flags = pet.lastMistakeFlags;
      if(pet.sac<=0 && !flags.sac){ pet.mistakes++; pet.health=clamp(pet.health-10); flags.sac=true; sfx('mistake'); }
      if(pet.sac>10) flags.sac=false;
      if(pet.happy<=0 && !flags.happy){ pet.mistakes++; pet.health=clamp(pet.health-10); flags.happy=true; sfx('mistake'); }
      if(pet.happy>10) flags.happy=false;
      if(pet.hyg<=0 && !flags.hyg){ pet.mistakes++; pet.health=clamp(pet.health-10); flags.hyg=true; sfx('mistake'); }
      if(pet.hyg>10) flags.hyg=false;

      if(pet.health<=0 && !pet.sick){ pet.sick=true; pet.sickTicks=0; }
      if(pet.sick){
        pet.sickTicks++;
        if(pet.sickTicks>=SICK_DEATH_TICKS){
          pet.alive=false;
          sfx('death');
        }
      }
    }
    checkEvolution();

    if(doRender!==false){ render(); savePet(); }
  }

  // ---------- aquí dibujo el bicho en pixel art ----------
  function px(gx,gy,color,w,h){
    w=w||1; h=h||1;
    ctx.fillStyle=color;
    ctx.fillRect(Math.round(gx*cell), Math.round(gy*cell), Math.ceil(w*cell), Math.ceil(h*cell));
  }
  function ellipseCells(cx,cy,rx,ry){
    const out=[];
    for(let gy=Math.floor(cy-ry-1);gy<=Math.ceil(cy+ry+1);gy++){
      for(let gx=Math.floor(cx-rx-1);gx<=Math.ceil(cx+rx+1);gx++){
        const dx=(gx-cx)/rx, dy=(gy-cy)/ry;
        if(dx*dx+dy*dy<=1) out.push([gx,gy]);
      }
    }
    return out;
  }

  function palette(stage, hue){
    if(stage<=2){ return {body:'#8fe3a0', belly:'#eafff0', dark:'#4fae6c', accent:'#c8ffd6'}; }
    const h = hue||0;
    return {
      body:  `hsl(${h}, 68%, 62%)`,
      belly: `hsl(${h}, 55%, 87%)`,
      dark:  `hsl(${h}, 60%, 30%)`,
      accent:`hsl(${(h+35)%360}, 75%, 65%)`
    };
  }

  function drawEgg(frame){
    const cx=12, cy=13;
    ctx.fillStyle='#0a1712'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const cells = ellipseCells(cx,cy,5.2,6.6);
    cells.forEach(([gx,gy])=>px(gx,gy,'#fff3d6'));
    // manchitas del cascarón
    const spots=[[cx-2,cy-3],[cx+2,cy-1],[cx-1,cy+3],[cx+3,cy+2]];
    spots.forEach(([gx,gy])=>px(gx,gy,'#ffd98a',1.3,1.3));
    // grieta que aparece cuando ya casi va a eclosionar
    if(frame%2===0){
      px(cx-0.5,cy-4,'#caa15a'); px(cx,cy-3,'#caa15a'); px(cx+0.7,cy-2,'#caa15a');
    }
    // la sombrita en el suelo, para que no parezca que flota
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(cx*cell, (cy+7)*cell, 5*cell,1.1*cell,0,0,Math.PI*2); ctx.fill();
  }

  function drawCreature(pet){
    const {stage, frame, sick, sleeping, temperament} = pet;
    ctx.fillStyle='#0a1712'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const cx=12, cy=13.5;
    const sizes = {1:[4.6,4.2],2:[5.6,5.0],3:[6.8,6.2],4:[7.8,7.2],5:[8.8,8.2]};
    let [rx,ry] = sizes[stage];
    if(stage>=3){
      const shape = pet.bodyShape||'redondo';
      if(shape==='anguloso'){ rx*=0.92; ry*=1.08; }
      else if(shape==='alargado'){ rx*=0.8; ry*=1.28; }
      else if(shape==='compacto'){ rx*=1.18; ry*=0.82; }
    }
    const pal = palette(stage, pet.hue);
    const bob = (frame%8<4)?0:0.4;
    const bcy = cy+bob;

    ctx.filter = sick? 'saturate(0.35) brightness(0.85)' : 'none';

    // otra vez la sombrita del suelo, pero pegada al bicho ya crecido
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(cx*cell, (cy+ry+2)*cell, (rx*0.9)*cell,1.1*cell,0,0,Math.PI*2); ctx.fill();

    // esto va detrás del cuerpo: el rasgo que le tocó a esta especie, no depende de la senda
    if(stage>=3){
      const featScale = stage===3?1:(stage===4?1.35:1.7);
      const feat = pet.featureType||'alas';
      if(feat==='alas') drawWings(cx,bcy,rx,ry,featScale,pal.accent);
      else if(feat==='cuernos') drawHorns(cx,bcy,rx,ry,featScale,pal.accent);
      else if(feat==='orejas') drawEars(cx,bcy,rx,ry,featScale,pal.accent);
      else if(feat==='aletas') drawFins(cx,bcy,rx,ry,featScale,pal.accent);
      else if(feat==='antenas') drawAntennas(cx,bcy,rx,ry,featScale,pal.accent);
      else if(feat==='pinchos') drawSpikes(cx,bcy,rx,ry,featScale,pal.accent);
    }

    // el cuerpo
    ellipseCells(cx,bcy,rx,ry).forEach(([gx,gy])=>px(gx,gy,pal.body));
    // la barriguita más clara
    ellipseCells(cx,bcy+ry*0.28,rx*0.62,ry*0.5).forEach(([gx,gy])=>px(gx,gy,pal.belly));
    // el patrón propio de esta especie (liso, manchas, rayas o estrellado), desde Joven en adelante
    if(stage>=3 && pet.pattern && pet.pattern!=='liso'){
      drawPattern(cx,bcy,rx,ry,pet.pattern,pal.dark);
    }

    // patitas cortas, desde que es Pequeño en adelante
    if(stage>=2 && stage<=2){
      px(cx-rx*0.55,bcy+ry*0.85,pal.dark,1.4,1.1);
      px(cx+rx*0.15,bcy+ry*0.85,pal.dark,1.4,1.1);
    }
    if(stage>=3){
      px(cx-rx*0.55,bcy+ry*0.9,pal.dark,1.6,1.3);
      px(cx+rx*0.2,bcy+ry*0.9,pal.dark,1.6,1.3);
    }

    // en Supremo le añado el aura de chispas y la coronita
    if(stage===5){
      const spark = pal.accent;
      const sparklePts = [[cx-rx-1.5,bcy-2],[cx+rx+1,bcy-3],[cx-rx-0.5,bcy+3],[cx+rx+1.5,bcy+2],[cx-2,bcy-ry-2.5],[cx+3,bcy-ry-2]];
      sparklePts.forEach(([gx,gy])=>{ if((frame+Math.round(gx))%6<3) px(gx,gy,spark,0.9,0.9); });
      px(cx-1.6,bcy-ry-1.2,pal.accent,3.2,0.9);
      px(cx-0.7,bcy-ry-2,pal.accent,1.4,0.9);
    }

    // los ojos, con el estilo propio de esta especie
    const eyeStyle = stage>=3 ? (pet.eyeStyle||'redondos') : 'redondos';
    const eyeY = bcy - ry*0.12;
    const eyeDX = eyeStyle==='ciclope' ? 0 : rx*0.42;
    if(sleeping){
      if(eyeStyle==='ciclope'){ px(cx-0.8,eyeY,'#1a2620',1.6,0.5); }
      else{ px(cx-eyeDX-0.6,eyeY,'#1a2620',1.6,0.5); px(cx+eyeDX-0.6,eyeY,'#1a2620',1.6,0.5); }
      ctx.fillStyle='#dfeee6';
      ctx.font='700 22px monospace';
      ctx.fillText('Z', (cx+rx+1)*cell, (bcy-ry-2+((frame%16<8)?0:-1))*cell);
    } else if(sick){
      // ojos huecos/mareados, para cuando está enfermo
      px(cx-eyeDX-0.6,eyeY-0.6,'#1a2620',1.6,1.6);
      px(cx-eyeDX-0.1,eyeY-0.1,pal.body,0.6,0.6);
      px(cx+eyeDX-0.6,eyeY-0.6,'#1a2620',1.6,1.6);
      px(cx+eyeDX-0.1,eyeY-0.1,pal.body,0.6,0.6);
    } else {
      const blink = frame%20>=18;
      const eh = blink?0.4:1.5;
      if(eyeStyle==='ciclope'){
        px(cx-1.1,eyeY+(2.2-eh)/2,'#1a2620',2.2,eh+0.7);
      } else if(eyeStyle==='rasgados'){
        px(cx-eyeDX-0.4,eyeY+(1.5-eh)/2,'#1a2620',1.1,eh);
        px(cx+eyeDX-0.8,eyeY+(1.5-eh)/2,'#1a2620',1.1,eh);
      } else if(eyeStyle==='trio'){
        px(cx-eyeDX-0.6,eyeY+(1.5-eh)/2,'#1a2620',1.4,eh);
        px(cx+eyeDX-0.6,eyeY+(1.5-eh)/2,'#1a2620',1.4,eh);
        px(cx-0.5,eyeY+ry*0.35,'#1a2620',1.0,eh*0.7);
      } else {
        px(cx-eyeDX-0.6,eyeY+(1.5-eh)/2,'#1a2620',1.6,eh);
        px(cx+eyeDX-0.6,eyeY+(1.5-eh)/2,'#1a2620',1.6,eh);
      }
    }

    // la boquita
    if(!sleeping){
      px(cx-0.7,bcy+ry*0.42,'#1a2620',1.4,0.5);
    }

    // el detallito del temperamento, desde que es Pequeño
    if(stage>=2 && temperament){
      const mx = cx+rx*0.55, my = bcy-ry-1.4;
      if(temperament==='Activo'){
        px(mx,my,'#ffe066',0.8,0.8); px(mx-0.6,my+0.7,'#ffe066',0.7,0.7); px(mx+0.5,my+1.1,'#ffe066',0.6,0.6);
      } else {
        px(mx,my,'#bfe8ff',0.9,0.9); px(mx-0.3,my+0.8,'#bfe8ff',0.6,0.6);
      }
    }

    ctx.filter='none';
  }

  function drawWings(cx,cy,rx,ry,scale,color){
    const w=1.6*scale, h=3.2*scale;
    px(cx-rx-w*0.9, cy-h*0.3, color, w, h*0.5);
    px(cx-rx-w*0.5, cy-h*0.55, color, w*0.7, h*0.4);
    px(cx+rx-w*0.1, cy-h*0.3, color, w, h*0.5);
    px(cx+rx+w*0.35, cy-h*0.55, color, w*0.7, h*0.4);
  }
  function drawHorns(cx,cy,rx,ry,scale,color){
    const h=2.6*scale;
    px(cx-rx*0.55,cy-ry-h,color,1.1,h);
    px(cx-rx*0.55-0.4,cy-ry-h*0.5,color,0.7,h*0.5);
    px(cx+rx*0.45,cy-ry-h,color,1.1,h);
    px(cx+rx*0.45+0.4,cy-ry-h*0.5,color,0.7,h*0.5);
  }
  function drawEars(cx,cy,rx,ry,scale,color){
    const r=1.5*scale;
    ellipseCells(cx-rx*0.65,cy-ry*0.85,r*0.6,r).forEach(([gx,gy])=>px(gx,gy,color));
    ellipseCells(cx+rx*0.65,cy-ry*0.85,r*0.6,r).forEach(([gx,gy])=>px(gx,gy,color));
  }
  function drawFins(cx,cy,rx,ry,scale,color){
    const w=1.3*scale, h=2.2*scale;
    px(cx-rx-w*0.7, cy+ry*0.1, color, w, h*0.5);
    px(cx-rx-w*0.3, cy+ry*0.5, color, w*0.6, h*0.4);
    px(cx+rx-w*0.3, cy+ry*0.1, color, w, h*0.5);
    px(cx+rx-w*0.3+w*0.3, cy+ry*0.5, color, w*0.6, h*0.4);
    px(cx-0.6, cy-ry-h*0.6, color, 1.2, h*0.7);
  }
  function drawAntennas(cx,cy,rx,ry,scale,color){
    const h=2.8*scale;
    px(cx-rx*0.4-0.2, cy-ry-h, color, 0.5, h);
    px(cx-rx*0.4-0.6, cy-ry-h-0.7, color, 1.2, 1.2);
    px(cx+rx*0.4-0.3, cy-ry-h*0.8, color, 0.5, h*0.8);
    px(cx+rx*0.4-0.7, cy-ry-h*0.8-0.7, color, 1.2, 1.2);
  }
  function drawSpikes(cx,cy,rx,ry,scale,color){
    const n=3, s=1.3*scale;
    for(let i=0;i<n;i++){
      const gx = cx - rx*0.5 + i*(rx*0.5);
      px(gx, cy-ry-s*(1-i*0.15), color, s*0.7, s*(1+i*0.15));
    }
  }
  function drawPattern(cx,cy,rx,ry,pattern,color){
    if(pattern==='manchas'){
      const spots=[[cx-rx*0.35,cy-ry*0.15],[cx+rx*0.3,cy-ry*0.3],[cx-rx*0.1,cy+ry*0.3],[cx+rx*0.35,cy+ry*0.05]];
      spots.forEach(([gx,gy])=>px(gx,gy,color,1,1));
    } else if(pattern==='rayas'){
      for(let i=-1;i<=1;i++){ px(cx+i*rx*0.4-0.25, cy-ry*0.55, color, 0.5, ry*1.05); }
    } else if(pattern==='estrellado'){
      const flecks=[[cx-rx*0.5,cy-ry*0.4],[cx+rx*0.2,cy-ry*0.55],[cx-rx*0.2,cy+ry*0.1],[cx+rx*0.45,cy+ry*0.25],[cx-rx*0.05,cy-ry*0.05],[cx+rx*0.05,cy+ry*0.45]];
      flecks.forEach(([gx,gy])=>px(gx,gy,color,0.5,0.5));
    }
  }

  function render(){
    if(!hasLoaded) return;
    document.getElementById('hudName').textContent = pet.name.toUpperCase();
    document.getElementById('hudStage').textContent = speciesDisplay(pet);
    document.getElementById('ageBadge').textContent = 'Edad: '+pet.age+'h · Nv.'+pet.level;
    const tag = document.getElementById('pathTag');

  // ---------- el sistema de batallas ----------
  const BASE_POWER = {0:0,1:4,2:7,3:14,4:19,5:24};
  const BEATS = {Ataque:'Especial', Especial:'Defensa', Defensa:'Ataque'};

  function powerOf(p){
    const statBonus = p.stats ? Math.round((p.stats.atq + p.stats.mag)/6) : 0;
    return BASE_POWER[p.stage] + (p.path?2:0) + statBonus + Math.round((p.health!==undefined?p.health:100)/100*4);
  }
  function mySnapshot(){
    return { name:pet.name, species:speciesDisplay(pet), stage:pet.stage, path:pet.path, power:powerOf(pet) };
  }
  function resolveMoves(moveA, moveB, powA, powB, pathA, pathB){
    let dmgToA=0, dmgToB=0, text='';
    if(moveA===moveB){
      dmgToA = 9+Math.round(powB*0.6); dmgToB = 9+Math.round(powA*0.6);
      text = 'Ambos usan '+moveA+' — chocan de igual a igual.';
    } else if(BEATS[moveA]===moveB){
      dmgToB = 17+powA; dmgToA = 5+Math.round(powB*0.4);
      text = moveA+' vence a '+moveB+'.';
    } else {
      dmgToA = 17+powB; dmgToB = 5+Math.round(powA*0.4);
      text = moveB+' vence a '+moveA+'.';
    }

    let healA=0, healB=0;
    const extra=[];
    if(moveA==='Especial'){
      if(pathA==='luz'){ healA+=8; extra.push('la Senda Luz cura un poco de vida.'); }
      else if(pathA==='sombra'){ dmgToB+=5; dmgToA+=3; extra.push('la Senda Sombra añade daño extra con retroceso.'); }
      else if(pathA==='equilibrio'){ dmgToA=Math.max(0,dmgToA-5); extra.push('la Senda Equilibrio amortigua el golpe recibido.'); }
    }
    if(moveB==='Especial'){
      if(pathB==='luz'){ healB+=8; extra.push('la Senda Luz rival cura algo de vida.'); }
      else if(pathB==='sombra'){ dmgToA+=5; dmgToB+=3; extra.push('la Senda Sombra rival añade daño extra con retroceso.'); }
      else if(pathB==='equilibrio'){ dmgToB=Math.max(0,dmgToB-5); extra.push('la Senda Equilibrio rival amortigua el golpe.'); }
    }
    if(extra.length) text += ' Además, '+extra.join(' Y ');
    return {dmgToA, dmgToB, healA, healB, text};
  }

  let battleTimer = null;
  function stopBattlePoll(){ if(battleTimer){ clearInterval(battleTimer); battleTimer=null; } }

  function openBattleModal(){
    if(pet.stage===0 || !pet.alive){ showToast('Tu mascota necesita nacer primero 🥚'); return; }
    const el = document.createElement('div');

  function renderLocalSetup(){
    const c = document.getElementById('battleContent');
    c.innerHTML = `
      <p class="small-note">Combate local — pasad el mismo móvil entre los dos jugadores, sin conexión.</p>

        <option value="1">Cría</option><option value="2">Pequeño</option>
        <option value="3" selected>Joven</option><option value="4">Perfecto</option><option value="5">Supremo</option>
      </select>

  let localState = null;
  function startLocalBattle(p1, p2){
    localState = { p1:{...p1,hp:100,move:null}, p2:{...p2,hp:100,move:null}, log:[], turnOf:1 };
    renderLocalBattle();
  }
  function renderLocalBattle(){
    const c = document.getElementById('battleContent');
    const s = localState;
    if(!s) return;
    const active = s.turnOf===1?s.p1:s.p2;
    const finished = s.p1.hp<=0 || s.p2.hp<=0;
    c.innerHTML = `
      <div class="vs">
        <div class="fighter"><b>${s.p1.name}</b><small>${s.p1.species}</small><div class="hpbar"><div class="hpfill" style="width:${Math.max(0,s.p1.hp)}%"></div></div></div>
        <div class="vslabel">VS</div>
        <div class="fighter"><b>${s.p2.name}</b><small>${s.p2.species}</small><div class="hpbar"><div class="hpfill" style="width:${Math.max(0,s.p2.hp)}%"></div></div></div>
      </div>
      ${finished ? `<p style="text-align:center;font-weight:800;">${s.p1.hp<=0?s.p2.name:s.p1.name} gana la batalla 🏆</p>
        <div class="modal-actions"><button id="againLocal">Volver a jugar</button></div>`
      : `<p class="small-note" style="text-align:center;">Turno de <b>${active.name}</b> — elige movimiento:</p>
        <div class="movegrid">
          <button data-mv="Ataque">⚔️<br>Ataque</button>
          <button data-mv="Especial">✨<br>Especial</button>
          <button data-mv="Defensa">🛡️<br>Defensa</button>
        </div>`}
      <div class="battlelog">${s.log.slice().reverse().map(l=>'<div>'+l+'</div>').join('') || 'El combate comienza...'}</div>
    `;
    if(!finished){
      c.querySelectorAll('[data-mv]').forEach(btn=>{
        btn.onclick=()=>{
          sfx('tap');
          const mv = btn.getAttribute('data-mv');
          if(s.turnOf===1){ s.p1.move=mv; s.turnOf=2; renderLocalBattle(); }
          else {
            s.p2.move=mv;
            const r = resolveMoves(s.p1.move, s.p2.move, s.p1.power, s.p2.power, s.p1.path, s.p2.path);
            s.p1.hp = Math.min(100, Math.max(0, s.p1.hp - r.dmgToA + r.healA));
            s.p2.hp = Math.min(100, Math.max(0, s.p2.hp - r.dmgToB + r.healB));
            s.log.push(s.p1.name+' usó '+s.p1.move+' · '+s.p2.name+' usó '+s.p2.move+' — '+r.text);
            s.p1.move=null; s.p2.move=null; s.turnOf=1;
            sfx('hit');
            if(s.p1.hp<=0 || s.p2.hp<=0){ sfx('win'); if(s.p2.hp<=0){ gainXp(6); savePet(); } }
            renderLocalBattle();
          }
        };
      });
    } else {
      document.getElementById('againLocal').onclick=()=>{ sfx('tap'); renderLocalSetup(); };
    }
  }

  // ---- la arena online (con almacenamiento compartido) ----
  const ARENA_OPEN_KEY = 'bytemon:arena:open';
  function battleKey(id){ return 'bytemon:arena:battle:'+id; }

  async function getOpenList(){
    try{
      const res = await CloudAdapter.get(ARENA_OPEN_KEY, true);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){}
    return [];
  }
  async function setOpenList(list){
    try{ await CloudAdapter.set(ARENA_OPEN_KEY, JSON.stringify(list), true); }catch(e){}
  }

  const LEADERBOARD_KEY = 'bytemon:leaderboard';
  async function recordWin(winnerName, winnerSpecies){
    let board = [];
    try{
      const res = await CloudAdapter.get(LEADERBOARD_KEY, true);
      if(res && res.value) board = JSON.parse(res.value);
    }catch(e){}
    const idx = board.findIndex(b=>b.name===winnerName && b.species===winnerSpecies);
    if(idx>=0) board[idx].wins++; else board.push({name:winnerName, species:winnerSpecies, wins:1});
    board.sort((a,b)=>b.wins-a.wins);
    board = board.slice(0,10);
    try{ await CloudAdapter.set(LEADERBOARD_KEY, JSON.stringify(board), true); }catch(e){}
  }
  async function renderLeaderboard(){
    const box = document.getElementById('leaderboardBox');
    if(!box) return;
    box.innerHTML = '<p class="small-note">Cargando ranking...</p>';
    let board = [];
    try{
      const res = await CloudAdapter.get(LEADERBOARD_KEY, true);
      if(res && res.value) board = JSON.parse(res.value);
    }catch(e){}
    if(board.length===0){ box.innerHTML = '<p class="small-note">Aún no hay victorias registradas. ¡Sé el primero!</p>'; return; }
    box.innerHTML = board.map((b,i)=>`<div class="challenge-item"><span>#${i+1} ${b.name} <small style="color:var(--muted)">(${b.species})</small></span><b>${b.wins} 🏆</b></div>`).join('');
  }

  async function renderOnlineHome(){
    const c = document.getElementById('battleContent');
    c.innerHTML = `<p class="small-note">Combate online — cualquiera que abra este mismo VPET puede retarte, esté donde esté. Tu nombre y tu especie serán visibles para otros jugadores mientras el reto esté abierto.</p>
      <div class="modal-actions">
        <button id="createChallengeBtn">📣 Crear reto</button>
        <button id="refreshChallengesBtn">🔄 Ver retos</button>
      </div>
      <div id="challengeList"></div>
      <h3 style="font-size:11px;margin-top:18px;">🏆 RANKING GLOBAL</h3>
      <div id="leaderboardBox"></div>`;
    document.getElementById('createChallengeBtn').onclick = createChallenge;
    document.getElementById('refreshChallengesBtn').onclick = loadOpenChallenges;
    loadOpenChallenges();
    renderLeaderboard();
  }

  async function createChallenge(){
    let list = await getOpenList();
    const now = Date.now();
    list = list.filter(c => now - c.ts < 10*60*1000 && c.name);
    const id = 'b'+now+Math.random().toString(36).slice(2,7);
    const mine = mySnapshot();
    list.push({ id, ...mine, ts: now });
    await setOpenList(list);
    showToast('Reto publicado — esperando rival...');
    waitForOpponent(id, mine);
  }

  function waitForOpponent(id, mineSnapshot){
    const c = document.getElementById('battleContent');
    c.innerHTML = `<p style="text-align:center;">Esperando que alguien acepte tu reto...</p>
      <div class="battlelog">Tu reto: <b>${mineSnapshot.name}</b> (${mineSnapshot.species})</div>
      <div class="modal-actions"><button id="cancelChallenge">Cancelar</button></div>`;
    document.getElementById('cancelChallenge').onclick = async ()=>{
      stopBattlePoll();
      let list = await getOpenList();
      list = list.filter(x=>x.id!==id);
      await setOpenList(list);
      renderOnlineHome();
    };
    battleTimer = setInterval(async ()=>{
      try{
        const res = await CloudAdapter.get(battleKey(id), true);
        if(res && res.value){
          stopBattlePoll();
          enterOnlineBattle(id, 'p1');
        }
      }catch(e){}
    }, 2500);
  }

  async function loadOpenChallenges(){
    const list = await getOpenList();
    const now = Date.now();
    const fresh = list.filter(c=>now-c.ts<10*60*1000);
    const box = document.getElementById('challengeList');
    if(!box) return;
    if(fresh.length===0){ box.innerHTML = '<p class="small-note">No hay retos abiertos ahora mismo. ¡Crea uno!</p>'; return; }
    box.innerHTML = fresh.map(ch => `<div class="challenge-item"><span>${ch.name} <small style="color:var(--muted)">(${ch.species})</small></span><button data-accept="${ch.id}">Aceptar</button></div>`).join('');
    box.querySelectorAll('[data-accept]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.getAttribute('data-accept');
        let openList = await getOpenList();
        const challenge = openList.find(x=>x.id===id);
        if(!challenge){ showToast('Ese reto ya no está disponible'); loadOpenChallenges(); return; }
        openList = openList.filter(x=>x.id!==id);
        await setOpenList(openList);
        const doc = {
          id, round:1, resolvedRound:0, finished:false, winner:null, log:[],
          p1:{ name:challenge.name, species:challenge.species, power:challenge.power, path:challenge.path, hp:100, move:null },
          p2:{ name:mySnapshot().name, species:mySnapshot().species, power:mySnapshot().power, path:mySnapshot().path, hp:100, move:null }
        };
        await CloudAdapter.set(battleKey(id), JSON.stringify(doc), true);
        enterOnlineBattle(id, 'p2');
      };
    });
  }

  function enterOnlineBattle(id, mySlot){
    async function poll(){
      let doc;
      try{
        const res = await CloudAdapter.get(battleKey(id), true);
        if(!res || !res.value) return;
        doc = JSON.parse(res.value);
      }catch(e){ return; }

      if(!doc.finished && doc.p1.move && doc.p2.move && doc.resolvedRound < doc.round){
        const r = resolveMoves(doc.p1.move, doc.p2.move, doc.p1.power, doc.p2.power, doc.p1.path, doc.p2.path);
        doc.p1.hp = Math.min(100, Math.max(0, doc.p1.hp - r.dmgToA + r.healA));
        doc.p2.hp = Math.min(100, Math.max(0, doc.p2.hp - r.dmgToB + r.healB));
        doc.log.push(doc.p1.name+' usó '+doc.p1.move+' · '+doc.p2.name+' usó '+doc.p2.move+' — '+r.text);
        doc.p1.move=null; doc.p2.move=null;
        doc.resolvedRound = doc.round;
        doc.round += 1;
        sfx('hit');
        if(doc.p1.hp<=0 || doc.p2.hp<=0){
          doc.finished=true;
          doc.winner = doc.p1.hp<=0? doc.p2.name : doc.p1.name;
          const winnerSpecies = doc.p1.hp<=0 ? doc.p2.species : doc.p1.species;
          recordWin(doc.winner, winnerSpecies);
          const iWon = (mySlot==='p1' && doc.p2.hp<=0) || (mySlot==='p2' && doc.p1.hp<=0);
          if(iWon){ gainXp(8); savePet(); }
        }
        try{ await CloudAdapter.set(battleKey(id), JSON.stringify(doc), true); }catch(e){}
      }
      renderOnlineBattleUI(doc, mySlot, id);
    }
    poll();
    battleTimer = setInterval(poll, 2000);
  }

  function renderOnlineBattleUI(doc, mySlot, id){
    const c = document.getElementById('battleContent');
    const me = doc[mySlot];
    const opp = doc[mySlot==='p1'?'p2':'p1'];
    const myMoveSet = !!me.move;
    c.innerHTML = `
      <div class="vs">
        <div class="fighter"><b>${doc.p1.name}</b><small>${doc.p1.species}</small><div class="hpbar"><div class="hpfill" style="width:${Math.max(0,doc.p1.hp)}%"></div></div></div>
        <div class="vslabel">VS</div>
        <div class="fighter"><b>${doc.p2.name}</b><small>${doc.p2.species}</small><div class="hpbar"><div class="hpfill" style="width:${Math.max(0,doc.p2.hp)}%"></div></div></div>
      </div>
      ${doc.finished ? `<p style="text-align:center;font-weight:800;">${doc.winner} gana la batalla 🏆</p>
        <div class="modal-actions"><button id="backOnline">Volver a la arena</button></div>`
      : myMoveSet ? `<p class="small-note" style="text-align:center;">Esperando el movimiento de ${opp.name}...</p>`
      : `<p class="small-note" style="text-align:center;">Elige tu movimiento:</p>
        <div class="movegrid">
          <button data-mv="Ataque">⚔️<br>Ataque</button>
          <button data-mv="Especial">✨<br>Especial</button>
          <button data-mv="Defensa">🛡️<br>Defensa</button>
        </div>`}
      <div class="battlelog">${(doc.log||[]).slice().reverse().map(l=>'<div>'+l+'</div>').join('') || 'El combate comienza...'}</div>
    `;
    if(!doc.finished && !myMoveSet){
      c.querySelectorAll('[data-mv]').forEach(btn=>{
        btn.onclick = async ()=>{
          sfx('tap');
          try{
            const res = await CloudAdapter.get(battleKey(id), true);
            const fresh = JSON.parse(res.value);
            fresh[mySlot].move = btn.getAttribute('data-mv');
            await CloudAdapter.set(battleKey(id), JSON.stringify(fresh), true);
            renderOnlineBattleUI(fresh, mySlot, id);
          }catch(e){}
        };
      });
    }
    if(doc.finished){
      stopBattlePoll();
      if(lastAnnouncedBattleId!==id){
        lastAnnouncedBattleId = id;
        sfx(doc.winner===me.name ? 'win' : 'lose');
      }
      const backBtn = document.getElementById('backOnline');
      if(backBtn) backBtn.onclick = ()=>{ sfx('tap'); renderOnlineHome(); };
    }
  }
  let lastAnnouncedBattleId = null;

  // ---------- mis minijuegos, todos originales, para subir el cariño jugando ----------
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  let minigameTimers = [];
  function stopMinigameTimers(){ minigameTimers.forEach(t=>clearInterval(t)); minigameTimers=[]; }

  function canPlayGames(){
    if(pet.stage===0 || !pet.alive){ showToast('Tu mascota necesita nacer primero 🥚'); return false; }
    if(pet.sleeping){ showToast(pet.name+' está durmiendo, despiértalo primero'); return false; }
    if(pet.energy<10){ showToast(pet.name+' está muy cansado para jugar'); return false; }
    return true;
  }

  function finishMinigame(gain, energyCost, toastMsg){
    pet.happy = clamp(pet.happy+gain);
    pet.energy = clamp(pet.energy-energyCost);
    gainXp(Math.max(2, Math.round(gain/2)));
    sfx('play');
    showToast(toastMsg);
    render(); savePet();
  }

  function showGameResult(title, scoreText, gain){
    const c = document.getElementById('gamesContent');
    c.innerHTML = `
      <p style="text-align:center;font-weight:800;">${title}</p>
      <p class="small-note" style="text-align:center;">${scoreText} — +${gain} de ánimo 💗</p>
      <div class="modal-actions"><button class="status-btn" id="backToGames">Volver a minijuegos</button></div>
    `;
    document.getElementById('backToGames').onclick=()=>{ sfx('tap'); renderGamesMenu(); };
  }

  function openGamesModal(){
    if(!canPlayGames()) return;
    const el = document.createElement('div');
    el.className='modal-backdrop'; el.id='gamesModal';
    el.innerHTML = `<div class="modal">
      <button class="close-x" id="closeGames">✕</button>
      <h3>MINIJUEGOS</h3>
      <div id="gamesContent"></div>
    </div>`;
    document.getElementById('modalRoot').appendChild(el);
    document.getElementById('closeGames').onclick=()=>{ stopMinigameTimers(); el.remove(); };
    el.addEventListener('click',(e)=>{ if(e.target===el){ stopMinigameTimers(); el.remove(); } });
    renderGamesMenu();
  }

  function renderGamesMenu(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    c.innerHTML = `
      <p class="small-note">Jugar sube el ánimo de ${pet.name}, pero gasta algo de energía.</p>
      <div class="modal-actions" style="flex-direction:column;gap:10px;">
        <button class="status-btn" id="gameCatch">🍓 Atrapa la fruta</button>
        <button class="status-btn" id="gameMemory">🧠 Memoria</button>
        <button class="status-btn" id="gameSimon">🎵 Simón dice</button>
      </div>
    `;
    document.getElementById('gameCatch').onclick = ()=>{ sfx('tap'); if(canPlayGames()) startCatchGame(); };
    document.getElementById('gameMemory').onclick = ()=>{ sfx('tap'); if(canPlayGames()) startMemoryGame(); };
    document.getElementById('gameSimon').onclick = ()=>{ sfx('tap'); if(canPlayGames()) startSimonGame(); };
  }

  function startCatchGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Toca la izquierda o la derecha para mover la cesta. ¡20 segundos!</p>
      <div class="game-hud"><span>Puntos: <b id="catchScore">0</b></span><span>Tiempo: <b id="catchTime">20</b>s</span></div>
      <div class="game-area" id="catchArea">
        <div class="game-zone" style="left:0;" id="zoneLeft"></div>
        <div class="game-zone" style="right:0;" id="zoneRight"></div>
        <div class="game-basket" id="basket" style="left:50%;"></div>
      </div>
    `;
    let score=0, timeLeft=20, basketPos=50;
    const area = document.getElementById('catchArea');
    const basket = document.getElementById('basket');
    const items = [];
    const FRUITS=['🍓','🍎','🍇','🍊','🍋'];

    document.getElementById('zoneLeft').onclick=()=>{ basketPos=Math.max(8,basketPos-14); basket.style.left=basketPos+'%'; };
    document.getElementById('zoneRight').onclick=()=>{ basketPos=Math.min(92,basketPos+14); basket.style.left=basketPos+'%'; };

    const spawnT = setInterval(()=>{
      const itEl = document.createElement('div');
      itEl.className='game-item';
      itEl.textContent = FRUITS[Math.floor(Math.random()*FRUITS.length)];
      const leftPct = 8+Math.random()*84;
      itEl.style.left = leftPct+'%';
      itEl.style.top = '0%';
      area.appendChild(itEl);
      items.push({el:itEl, left:leftPct, top:0});
    }, 850);

    const moveT = setInterval(()=>{
      for(let i=items.length-1;i>=0;i--){
        const it = items[i];
        it.top += 4;
        it.el.style.top = it.top+'%';
        if(it.top>=88){
          if(Math.abs(it.left-basketPos)<12){ score++; document.getElementById('catchScore').textContent=score; sfx('tap'); }
          it.el.remove(); items.splice(i,1);
        }
      }
    }, 60);

    const timerT = setInterval(()=>{
      timeLeft--;
      document.getElementById('catchTime').textContent = timeLeft;
      if(timeLeft<=0){
        clearInterval(spawnT); clearInterval(moveT); clearInterval(timerT);
        items.forEach(it=>it.el.remove());
        const gain = Math.min(28, score*3);
        finishMinigame(gain, 8, '¡'+pet.name+' atrapó '+score+' frutas! +'+gain+' de ánimo');
        showGameResult('🍓 Atrapa la fruta', score+' frutas atrapadas', gain);
      }
    }, 1000);

    minigameTimers.push(spawnT, moveT, timerT);
  }

  function startMemoryGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    const ICONS = ['🍓','🐸','🎈','⭐','🍩','🚀'];
    let deck = [...ICONS, ...ICONS];
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
    let flipped=[], matched=new Set(), moves=0, lock=false;

    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Encuentra las 6 parejas con el menor número de intentos.</p>
      <div class="game-hud"><span>Intentos: <b id="memMoves">0</b></span><span>Parejas: <b id="memPairs">0</b>/6</span></div>
      <div class="memgrid" id="memGrid"></div>
    `;
    const grid = document.getElementById('memGrid');
    deck.forEach((icon,idx)=>{
      const b = document.createElement('button');
      b.className='memcard'; b.dataset.idx=idx; b.dataset.icon=icon;
      b.textContent='❔';
      b.onclick=()=>{
        if(lock || b.classList.contains('matched') || flipped.includes(b)) return;
        sfx('tap');
        b.textContent = icon;
        flipped.push(b);
        if(flipped.length===2){
          moves++; document.getElementById('memMoves').textContent=moves;
          lock=true;
          const [a,bb]=flipped;
          if(a.dataset.icon===bb.dataset.icon){
            a.classList.add('matched'); bb.classList.add('matched');
            matched.add(a.dataset.idx); matched.add(bb.dataset.idx);
            document.getElementById('memPairs').textContent=matched.size/2;
            flipped=[]; lock=false;
            if(matched.size===deck.length){
              const gain = Math.max(10, 30-moves);
              finishMinigame(gain, 6, '¡'+pet.name+' completó la memoria en '+moves+' intentos! +'+gain+' de ánimo');
              setTimeout(()=>showGameResult('🧠 Memoria', moves+' intentos', gain), 300);
            }
          } else {
            setTimeout(()=>{ a.textContent='❔'; bb.textContent='❔'; flipped=[]; lock=false; }, 700);
          }
        }
      };
      grid.appendChild(b);
    });
  }

  function startSimonGame(){
    stopMinigameTimers();
    const c = document.getElementById('gamesContent');
    const COLOR_IDS = ['red','green','blue','yellow'];
    let sequence=[], level=0, playerIdx=0, accepting=false;

    c.innerHTML = `
      <p class="small-note" style="text-align:center;">Memoriza y repite la secuencia de colores.</p>
      <div class="game-hud"><span>Ronda: <b id="simonLevel">0</b></span></div>
      <div class="simon-grid">
        <button class="simon-btn simon-red" data-c="red"></button>
        <button class="simon-btn simon-green" data-c="green"></button>
        <button class="simon-btn simon-blue" data-c="blue"></button>
        <button class="simon-btn simon-yellow" data-c="yellow"></button>
      </div>
    `;
    const btns = {};
    c.querySelectorAll('.simon-btn').forEach(b=>{ btns[b.dataset.c]=b; b.onclick=()=>handlePress(b.dataset.c); });

    async function nextRound(){
      accepting=false;
      level++; document.getElementById('simonLevel').textContent=level;
      sequence.push(COLOR_IDS[Math.floor(Math.random()*4)]);
      await sleep(500);
      for(const col of sequence){
        btns[col].classList.add('lit'); sfx('tap'); await sleep(420);
        btns[col].classList.remove('lit'); await sleep(220);
      }
      playerIdx=0; accepting=true;
    }
    function handlePress(col){
      if(!accepting) return;
      btns[col].classList.add('lit'); setTimeout(()=>btns[col].classList.remove('lit'),150);
      sfx('tap');
      if(sequence[playerIdx]===col){
        playerIdx++;
        if(playerIdx===sequence.length){ accepting=false; setTimeout(nextRound, 700); }
      } else {
        accepting=false;
        const gain = Math.min(26, (level-1)*4);
        finishMinigame(gain, 5, '¡'+pet.name+' llegó a la ronda '+(level-1)+' en Simón dice! +'+gain+' de ánimo');
        setTimeout(()=>showGameResult('🎵 Simón dice', 'Llegaste a la ronda '+(level-1), gain), 300);
      }
    }
    nextRound();
  }

  document.getElementById('btnBattle').onclick = ()=>{ sfx('tap'); openBattleModal(); };
  document.getElementById('btnGames').onclick = ()=>{ sfx('tap'); openGamesModal(); };
  document.getElementById('btnMute').onclick = ()=>{
    ensureAudio();
    soundOn = !soundOn;
    document.getElementById('btnMute').textContent = soundOn ? '🔊' : '🔇';
    if(soundOn) sfx('tap');
  };

  loadPet().then(()=>{
    setInterval(()=>tick(true), TICK_MS);
    setInterval(()=>{ if(pet.alive && pet.stage>0){ render(); } }, 550); // idle animation refresh
  });
})();
</script>
