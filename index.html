      const foot = new THREE.Mesh(new THREE.BoxGeometry(.19,.1,.24), spikeMat);
      foot.position.set(legX,-.73,legZ+.08);
      g.add(foot);
      for(let t=-1;t<=1;t++){
        const claw = new THREE.Mesh(new THREE.ConeGeometry(.028,.09,4), clawMat);
        claw.position.set(legX+t*.055,-.76,legZ+.19);
        claw.rotation.x = Math.PI/2.3;
        g.add(claw);
      }
    });
    // cola larga, con púas, saliendo de la parte de atrás del torso
    const tailBase = new THREE.Group();
    tailBase.position.set(0,.02,-.5);
    tailBase.rotation.x = .35;
    const tailSeg1 = new THREE.Mesh(new THREE.CylinderGeometry(.16,.25,.75,6), mat);
    tailSeg1.position.set(0,0,-.38);
    tailSeg1.rotation.x = Math.PI/2;
    tailBase.add(tailSeg1);
    g.add(tailBase);
    const tailTip = new THREE.Group();
    tailTip.position.set(0,0,-.75);
    tailTip.rotation.x = .5; // la segunda mitad se curva mas, para que la cola se levante del suelo y se vea bien
    tailBase.add(tailTip);
    const tailSeg2 = new THREE.Mesh(new THREE.CylinderGeometry(.03,.16,.7,6), mat);
    tailSeg2.position.set(0,0,-.35);
    tailSeg2.rotation.x = Math.PI/2;
    tailTip.add(tailSeg2);
    // púas a lo largo de toda la cola, siguiendo la curva de los dos tramos
    for(let i=0;i<3;i++){
      const spike = new THREE.Mesh(new THREE.ConeGeometry(.05,.13,4), spikeMat);
      spike.position.set(0,.16,-.2-i*.24);
      tailBase.add(spike);
    }
    for(let i=0;i<3;i++){
      const spike = new THREE.Mesh(new THREE.ConeGeometry(.035,.1,4), spikeMat);
      spike.position.set(0,.13,-.15-i*.2);
      tailTip.add(spike);
    }
    return { group:g, headAnchor:{y:.68, rx:.28, ry:.24, z:.97} };
  }
  function build3DOrientalDragon(pal){
    // dragón oriental: cuerpo largo y serpenteante en una curva suave, sin alas, con melena de
    // púas en el cuello y bigotes largos — muy distinto del dragón occidental de cuatro patas robustas
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: pal.body, roughness:.7, flatShading:true, map: makeSkinTexture('escama') });
    const maneMat = new THREE.MeshStandardMaterial({ color: pal.dark, roughness:.6, flatShading:true });
    const bellyMat = new THREE.MeshStandardMaterial({ color: pal.belly, roughness:.6, flatShading:true });
    const clawMat = new THREE.MeshStandardMaterial({ color:0xf0ead8, roughness:.4, flatShading:true });
    const segCount = 7;
    const positions = [];
    for(let i=0;i<segCount;i++){
      const t = i/(segCount-1);
      positions.push({
        x: Math.sin(t*Math.PI*1.25)*.48,
        y: .08 + Math.sin(t*Math.PI*.55)*.16,
        z: .85 - t*1.85,
        t
      });
    }
    positions.forEach((p,i)=>{
      const radius = .27 - p.t*.15;
      const seg = new THREE.Mesh(new THREE.SphereGeometry(radius,7,6), mat);
      seg.scale.set(1,.85,1.3);
      seg.position.set(p.x,p.y,p.z);
      g.add(seg);
      const bellySeg = new THREE.Mesh(new THREE.BoxGeometry(radius*1.1,radius*.5,radius*1.6), bellyMat);
      bellySeg.position.set(p.x,p.y-radius*.75,p.z);
      g.add(bellySeg);
      if(i>0){
        const spike = new THREE.Mesh(new THREE.ConeGeometry(radius*.4,radius*1.1,4), maneMat);
        spike.position.set(p.x,p.y+radius*.85,p.z);
        g.add(spike);
      }
      // patas pequeñas y finas cada dos segmentos, con garras — un dragón oriental apenas se apoya en ellas
      if(i%2===1 && i<segCount-1){
        [-1,1].forEach(side=>{
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(.05,.06,.3,4), mat);
          leg.position.set(p.x+side*radius*.95,p.y-.24,p.z);
          g.add(leg);
          for(let c=-1;c<=1;c++){
            const claw = new THREE.Mesh(new THREE.ConeGeometry(.02,.06,3), clawMat);
            claw.position.set(p.x+side*radius*.95+c*.035,p.y-.39,p.z+.06);
            claw.rotation.x = Math.PI/2.3;
            g.add(claw);
          }
        });
      }
    });
    // cabeza al frente del primer segmento (el mas ancho)
    const hp = positions[0];
    const head = new THREE.Group();
    head.position.set(hp.x, hp.y+.05, hp.z+.32);
    const skull = new THREE.Mesh(new THREE.BoxGeometry(.34,.28,.32), mat);
    head.add(skull);
    const snout = new THREE.Mesh(new THREE.BoxGeometry(.2,.16,.22), mat);
    snout.position.set(0,-.05,.24);
    head.add(snout);
    const jaw = new THREE.Mesh(new THREE.BoxGeometry(.17,.06,.2), bellyMat);
    jaw.position.set(0,-.13,.22);
    head.add(jaw);
    // melena de púas sobre la cabeza y el arranque del cuello
    for(let i=0;i<3;i++){
      const spike = new THREE.Mesh(new THREE.ConeGeometry(.045,.16,4), maneMat);
      spike.position.set(0,.16+i*.01,-.02-i*.11);
      spike.rotation.x = -.3;
      head.add(spike);
    }
    // bigotes largos y finos, el rasgo distintivo del dragón oriental
    [-1,1].forEach(s=>{
      const whisker = new THREE.Mesh(new THREE.CylinderGeometry(.012,.02,.5,4), maneMat);
      whisker.position.set(s*.12,-.08,.42);
      whisker.rotation.z = s*.5;
      whisker.rotation.x = .3;
      head.add(whisker);
    });
    g.add(head);
    return { group:g, headAnchor:{y:hp.y+.05, rx:.3, ry:.26, z:hp.z+.44} };
  }
  function build3DBug(pal){
    // cuerpo de insecto en tres partes (cabeza, tórax, abdomen), seis patas articuladas y antenas —
    // un caparazón brillante en vez de piel, para que se note de un vistazo que es un bicho de verdad
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: pal.body, roughness:.35, metalness:.15, flatShading:true, map: makeSkinTexture('caparazon') });
    const shellMat = new THREE.MeshStandardMaterial({ color: pal.dark, roughness:.3, metalness:.2, flatShading:true, map: makeSkinTexture('caparazon') });
    const head = new THREE.Mesh(new THREE.SphereGeometry(.26,7,6), mat);
    head.position.set(0,.06,.88);
    g.add(head);
    const thorax = new THREE.Mesh(new THREE.SphereGeometry(.34,8,6), shellMat);
    thorax.position.set(0,.08,.46);
    g.add(thorax);
    const abdomen = new THREE.Mesh(new THREE.SphereGeometry(.48,9,7), shellMat);
    abdomen.scale.set(1,.82,1.5);
    abdomen.position.set(0,0,-.32);
    g.add(abdomen);
    // bandas del caparazón marcando los segmentos del abdomen, como en un escarabajo de verdad
    const bandMat = new THREE.MeshStandardMaterial({ color: pal.dark, roughness:.25, metalness:.25, flatShading:true });
    for(let i=0;i<3;i++){
      const band = new THREE.Mesh(new THREE.TorusGeometry(.4-i*.04,.018,5,10), bandMat);
      band.rotation.y = Math.PI/2;
      band.position.set(0,0,-.05-i*.28);
      band.scale.set(1,.82,1);
      g.add(band);
    }
    // linea central del caparazón, como la separación de las élitros de un escarabajo
    const midline = new THREE.Mesh(new THREE.BoxGeometry(.02,.06,1.1), bandMat);
    midline.position.set(0,.32,-.35);
    g.add(midline);
    // seis patas finas y anguladas, en tres pares a lo largo del cuerpo
    for(let i=0;i<3;i++){
      const zPos = .55-i*.35;
      [-1,1].forEach(side=>{
        const legGroup = new THREE.Group();
        const upper = new THREE.Mesh(new THREE.CylinderGeometry(.025,.03,.34,4), shellMat);
        upper.rotation.z = side*1.1;
        upper.position.set(side*.17,0,0);
        legGroup.add(upper);
        const lower = new THREE.Mesh(new THREE.CylinderGeometry(.02,.025,.3,4), shellMat);
        lower.position.set(side*.34,-.17,0);
        lower.rotation.z = side*1.85;
        legGroup.add(lower);
        legGroup.position.set(0,.04,zPos);
        legGroup.userData.isBugLeg = true;
        legGroup.userData.legSide = side;
        legGroup.userData.legIndex = i;
        g.add(legGroup);
      });
    }
    // antenas largas y finas, saliendo de la cabeza
    [-1,1].forEach(s=>{
      const ant = new THREE.Mesh(new THREE.CylinderGeometry(.018,.03,.42,4), shellMat);
      ant.position.set(s*.12,.3,1.08);
      ant.rotation.x = -.35;
      ant.rotation.z = s*.25;
      g.add(ant);
    });
    return { group:g, headAnchor:{y:.06, rx:.32, ry:.3, z:.88} };
  }

  function build3DCreature(traits){
    const group = new THREE.Group();
    const hue = traits.hue||0;
    const pal = {
      body: hueToThreeColor(hue, .55, .58),
      belly: hueToThreeColor(hue, .4, .82),
      dark: hueToThreeColor(hue, .55, .28),
      accent: hueToThreeColor((hue+35)%360, .7, .6)
    };
    const archetype = traits.archetype || 'criatura';
    let headAnchor = {y:0, rx:1, ry:1, z:.88};
    if(archetype==='humanoide'){
      const r = build3DHumanoid(pal); group.add(r.group); headAnchor = r.headAnchor;
    } else if(archetype==='bestia'){
      const r = build3DBeast(pal); group.add(r.group); headAnchor = r.headAnchor;
    } else if(archetype==='fantasia'){
      // cuerpo esbelto o alargado = dragón oriental (sin alas, serpenteante); el resto = dragón occidental de cuatro patas
      const r = (traits.bodyShape==='esbelto' || traits.bodyShape==='alargado') ? build3DOrientalDragon(pal) : build3DFantasy(pal);
      group.add(r.group); headAnchor = r.headAnchor;
    } else if(archetype==='bicho'){
      const r = build3DBug(pal); group.add(r.group); headAnchor = r.headAnchor;
    } else {
      const body = build3DBody(pal, traits.bodyShape||'redondo');
      group.add(body);
      const belly = new THREE.Mesh(new THREE.BoxGeometry(1.05,1.1,.55), new THREE.MeshStandardMaterial({color:pal.belly, roughness:.75, flatShading:true}));
      belly.position.set(0,-.25,.55);
      group.add(belly);
      // contorno oscuro tipo "cartoon" para que se note el borde, como el pixel art recortado — solo en la criatura
      // clásica; a las otras formas (con brazos, patas, alas...) no les hace falta, ya se distinguen bien solas
      const outlineMat = new THREE.MeshBasicMaterial({ color:0x0a1712, side:THREE.BackSide });
      const bodyOutline = build3DBody({body:0x0a1712}, traits.bodyShape||'redondo');
      bodyOutline.traverse(o=>{ if(o.isMesh){ o.material = outlineMat; o.scale.multiplyScalar(1.08); } });
      group.add(bodyOutline);
    }
    const feat = build3DFeature(pal, traits.featureType||'alas', headAnchor.rx, headAnchor.ry);
    const isBackFeature = (traits.featureType==='alas' || traits.featureType==='aletas');
    const skipFeature = (archetype==='fantasia' && traits.featureType==='alas'); // la fantasía ya trae sus propias alas de dragón — no le sumo un segundo par
    const criaturaDepth = BODY_SHAPE_DEPTH[traits.bodyShape] || 1; // cada forma de criatura es mas o menos profunda — sin esto, los ojos quedaban hundidos en formas anchas como "macizo"
    if(skipFeature){
      // no añado nada — evito el par de alas genérico duplicado sobre el que ya trae el cuerpo
    } else if(isBackFeature && archetype==='bestia'){
      // en una bestia, alas/aletas van sobre el lomo, en el centro del cuerpo — no pegadas al cuello como si fueran parte de la cabeza
      feat.position.y += .1;
      feat.position.z += -.05;
      group.add(feat);
    } else if(isBackFeature && archetype==='fantasia'){
      feat.position.y += .15;
      feat.position.z += -.5; // el cuerpo es largo, así que lo centro más atrás, sobre el lomo de verdad
      group.add(feat);
    } else {
      feat.position.y += headAnchor.y;
      feat.position.z += (archetype==='criatura') ? (headAnchor.z*criaturaDepth - .88) : headAnchor.z;
      group.add(feat);
    }
    const maturity = Math.max(0, Math.min(1, ((traits.stage!=null?traits.stage:3)-1)/4)); // 0 = cría recién nacida, 1 = forma Suprema
    const eyes = build3DEyes(traits.eyeStyle||'redondos', headAnchor.rx, headAnchor.ry, !!traits.sleeping, maturity, archetype);
    eyes.position.y += headAnchor.y;
    eyes.position.z += (archetype==='criatura') ? (headAnchor.z*criaturaDepth - .88 + .1*(criaturaDepth-1)) : headAnchor.z;
    group.add(eyes);
    if(!traits.sleeping){
      const face = build3DFace(headAnchor.rx, headAnchor.ry, maturity);
      face.position.y += headAnchor.y;
      face.position.z += (archetype==='criatura') ? (headAnchor.z*criaturaDepth - .88 + .1*(criaturaDepth-1)) : headAnchor.z;
      group.add(face);
    }
    // manchas y rayas: cada arquetipo tiene un cuerpo con una forma y un tamaño muy distintos, así que
    // coloco los adornos según la silueta real de cada uno — antes usaba una sola posición fija pensada
    // solo para el cuerpo redondo de la criatura, y en el resto de formas quedaban flotando en el aire
    const spotBounds = {
      criatura: {x:1.2, y:.8, z:[.62,.8]},
      humanoide:{x:.5, y:[-.15,.75], z:[.24,.3]},
      bestia:   {x:.55, y:[-.35,.15], z:[-.6,.6]},
      fantasia: {x:.4, y:[-.1,.5], z:[-1.1,.6]},
      bicho:    {x:.35, y:[-.15,.2], z:[-.7,.7]}
    }[archetype] || {x:1.2, y:.8, z:[.7,.9]};
    function pickSpotPos(){
      const zRange = spotBounds.z;
      const z = Array.isArray(zRange) ? zRange[0]+Math.random()*(zRange[1]-zRange[0]) : zRange;
      const yRange = spotBounds.y;
      const y = Array.isArray(yRange) ? yRange[0]+Math.random()*(yRange[1]-yRange[0]) : (Math.random()-.5)*yRange;
      return { x:(Math.random()-.5)*spotBounds.x, y, z };
    }
    if(traits.pattern==='manchas'){
      for(let i=0;i<4;i++){
        const p = pickSpotPos();
        const spot = new THREE.Mesh(new THREE.BoxGeometry(.16,.16,.12), new THREE.MeshStandardMaterial({color:pal.dark, flatShading:true}));
        spot.position.set(p.x, p.y, p.z);
        group.add(spot);
      }
    } else if(traits.pattern==='rayas'){
      const zMid = Array.isArray(spotBounds.z) ? (spotBounds.z[0]+spotBounds.z[1])/2 : spotBounds.z;
      const yMid = Array.isArray(spotBounds.y) ? (spotBounds.y[0]+spotBounds.y[1])/2 : 0;
      const yLen = Array.isArray(spotBounds.y) ? (spotBounds.y[1]-spotBounds.y[0])*1.1 : .85;
      for(let i=-1;i<=1;i++){
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(.1,yLen,.1), new THREE.MeshStandardMaterial({color:pal.dark, flatShading:true}));
        stripe.position.set(i*spotBounds.x*.55, yMid, zMid);
        group.add(stripe);
      }
    }
    // crece de verdad con las etapas, igual que hacía en pixel art — antes se quedaba siempre del mismo
    // tamaño y por eso una Cría se veía igual de grande que una Suprema, ocupando de más en pantalla
    const STAGE_SCALE = {0:.55, 1:.676, 2:.824, 3:1, 4:1.147, 5:1.294};
    group.userData.baseScale = STAGE_SCALE[traits.stage!=null?traits.stage:3] || 1;
    return group;
  }

  function open3DModal(){
    if(pet.stage===0 || !pet.alive){ showToast('Tu mascota necesita nacer primero 🥚'); return; }
    if(typeof THREE === 'undefined'){ showToast('No se ha podido cargar el visor 3D — revisa tu conexión'); return; }
    sfx('tap');
    const el = document.createElement('div');
    el.className='modal-backdrop'; el.id='modal3D';
    el.innerHTML = `<div class="modal">
      <button class="close-x" id="close3D">✕</button>
      <h3>${speciesDisplay(pet)} EN 3D</h3>
      <p class="small-note">Arrastra para girarla. Este es el primer paso hacia una versión completa en 3D.</p>
      <div id="three-wrap" style="width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#0a1712;margin-top:10px;touch-action:none;">
        <canvas id="three-canvas" style="display:block;width:100%;height:100%;"></canvas>
      </div>

    try{ init3DScene(); }catch(e){ showToast('Tu dispositivo no puede mostrar el visor 3D'); console.error('3D init failed:', e); }
  }

  function stop3D(){
    if(three3D && three3D.raf){ cancelAnimationFrame(three3D.raf); }
    three3D = null;
  }

  function init3DScene(){
    const wrap = document.getElementById('three-wrap');
    const canvasEl = document.getElementById('three-canvas');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    renderer.setSize(w, h, false);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, w/h, 0.1, 100);
    camera.position.set(0, 0.5, 4.2);
    const hemi = new THREE.HemisphereLight(0xbfe8ff, 0x201030, .8);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, .9);
    dir.position.set(2,3,4);
    scene.add(dir);
    const group = build3DCreature(snapshotVisual(pet));
    scene.add(group);

    three3D = { renderer, scene, camera, group, raf:null, dragging:false, lastX:0, lastY:0, rotY:0.4, rotX:0 };
    group.rotation.y = three3D.rotY;

    function onDown(x,y){ three3D.dragging=true; three3D.lastX=x; three3D.lastY=y; }
    function onMove(x,y){
      if(!three3D || !three3D.dragging) return;
      const dx = x-three3D.lastX, dy = y-three3D.lastY;
      three3D.rotY += dx*0.01;
      three3D.rotX = Math.max(-0.6, Math.min(0.6, three3D.rotX + dy*0.01));
      three3D.group.rotation.y = three3D.rotY;
      three3D.group.rotation.x = three3D.rotX;
      three3D.lastX=x; three3D.lastY=y;
    }
    function onUp(){ if(three3D) three3D.dragging=false; }
    canvasEl.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
    window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY));
    window.addEventListener('mouseup', onUp);
    canvasEl.addEventListener('touchstart', e=>{ const t=e.touches[0]; onDown(t.clientX,t.clientY); }, {passive:true});
    canvasEl.addEventListener('touchmove', e=>{ const t=e.touches[0]; onMove(t.clientX,t.clientY); }, {passive:true});
    canvasEl.addEventListener('touchend', onUp);

    let autoSpin = true;
    canvasEl.addEventListener('mousedown', ()=>{ autoSpin=false; });
    canvasEl.addEventListener('touchstart', ()=>{ autoSpin=false; }, {passive:true});

    function loop(){
      if(!three3D) return;
      if(autoSpin && !three3D.dragging){ three3D.rotY += 0.005; three3D.group.rotation.y = three3D.rotY; }
      renderer.render(scene, camera);
      three3D.raf = requestAnimationFrame(loop);
    }
    loop();
  }

  // ---------- mi escena 3D principal, la vista de siempre ahora en 3D de verdad, no un botón aparte ----------
  let mainScene3D = null; // {renderer, scene, camera, group, groundColor, raf, dragging, lastX, lastY, rotY, rotX, bobT}
  let mainSceneSignature = '';

  // ---------- mis entornos: cada mascota vive en el suyo propio, elegido por su semilla ----------
  const ENV_THEMES = ['bosque','parque','galaxia','playa','digital','cueva','volcan','nieve','desierto','otonio'];
  const ENV_COLORS = {
    bosque:  { sky:[110,.42,.13], ground:[105,.38,.2] },
    parque:  { sky:[100,.5,.6],  ground:[95,.42,.42] },
    galaxia: { sky:[255,.5,.05], ground:[255,.3,.11] },
    playa:   { sky:[42,.65,.62], ground:[42,.5,.55] },
    digital: { sky:[160,.65,.05],ground:[160,.4,.09] },
    cueva:   { sky:[275,.4,.05], ground:[275,.3,.09] },
    volcan:  { sky:[10,.55,.13], ground:[8,.4,.14] },
    nieve:   { sky:[205,.35,.62], ground:[200,.15,.82] },
    desierto:{ sky:[35,.55,.55], ground:[38,.5,.58] },
    otonio:  { sky:[28,.45,.35], ground:[25,.4,.22] }
  };
  function pickEnvTheme(seed){
    const rand = mulberry32((seed||1)+41);
    return ENV_THEMES[Math.floor(rand()*ENV_THEMES.length)];
  }
  function decorAngle(rand){
    // dejo libre un arco de cara a la cámara (+Z) para que nunca me plante un árbol justo delante de la
    // mascota tapándola — reparto el resto del círculo (260°) para toda la decoración del entorno
    const clearArc = Math.PI*.56; // unos 100 grados despejados de cara a la cámara
    const cameraDir = Math.PI/2;
    const usable = Math.PI*2 - clearArc;
    return cameraDir + clearArc/2 + rand()*usable;
  }
  function build3DPalm(rand){
    // tronco curvado por segmentos, con un anillo marcado entre cada uno, y hojas con hojuelas puntiagudas
    // a los lados como un peine — antes era una tira lisa sin ninguna de las dos cosas
    const g = new THREE.Group();
    const trunkMat = new THREE.MeshStandardMaterial({color:0x9a7a52, flatShading:true});
    const ringMat = new THREE.MeshStandardMaterial({color:0x6b4a30, flatShading:true});
    const segments = 6;
    const totalHeight = .95;
    const segH = totalHeight/segments;
    let curveX = 0, curveZ = 0;
    const bendDir = rand()*Math.PI*2, bendAmount = .1+rand()*.16; // hacia donde se inclina el tronco, y cuánto
    let topX=0, topZ=0, topY=0;
    for(let i=0;i<segments;i++){
      const t = (i+1)/segments;
      const radius = .095-t*.045;
      const segGroup = new THREE.Group();
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(radius*.9, radius, segH*1.15, 7), trunkMat);
      seg.position.y = segH/2;
      segGroup.add(seg);
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(radius*.96,radius*.96,segH*.14,7), ringMat);
      ring.position.y = segH;
      segGroup.add(ring);
      segGroup.position.set(curveX, i*segH, curveZ);
      // cada segmento se inclina un poco mas que el anterior, para que el tronco curve poco a poco, no en linea recta
      const bendHere = bendAmount * (t*t);
      segGroup.rotation.x = Math.sin(bendDir)*bendHere;
      segGroup.rotation.z = Math.cos(bendDir)*bendHere;
      g.add(segGroup);
      curveX += Math.cos(bendDir)*bendHere*segH;
      curveZ += Math.sin(bendDir)*bendHere*segH;
      topX = curveX; topZ = curveZ; topY = (i+1)*segH;
    }
    // la copa nace justo donde termina el ultimo segmento del tronco, ya inclinado
    const crown = new THREE.Group();
    crown.position.set(topX, topY, topZ);
    const frondMat = new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL((100+rand()*24)/360,.5,.34), flatShading:true, side:THREE.DoubleSide});
    const frondCount = 7+Math.floor(rand()*2);
    for(let f=0; f<frondCount; f++){
      const wrap = new THREE.Group();
      wrap.rotation.y = (f/frondCount)*Math.PI*2 + rand()*.25;
      const frondLen = .5+rand()*.14;
      const rib = new THREE.Group();
      rib.rotation.x = -.3-rand()*.2; // sale de la copa apuntando algo hacia arriba, como en las referencias
      const spine = new THREE.Mesh(new THREE.BoxGeometry(.025,.02,frondLen), frondMat);
      spine.position.z = frondLen/2;
      rib.add(spine);
      const tipSpine = new THREE.Mesh(new THREE.BoxGeometry(.02,.018,frondLen*.7), frondMat);
      tipSpine.position.z = frondLen*.7/2;
      tipSpine.rotation.x = .85; // la punta ya cae hacia abajo, como en las fotos
      spine.add(tipSpine);
      // hojuelas puntiagudas a los dos lados de la nervadura, como dientes de peine
      const leafletRows = 6;
      for(let i=1;i<=leafletRows;i++){
        const lt = i/leafletRows, lz = lt*frondLen;
        const leafletLen = .22*(1-lt*.35);
        [-1,1].forEach(side=>{
          const leaflet = new THREE.Mesh(new THREE.ConeGeometry(.028, leafletLen, 4), frondMat);
          leaflet.position.set(side*leafletLen*.42, .01, lz);
          leaflet.rotation.z = side*1.25;
          leaflet.rotation.y = side*.15;
          spine.add(leaflet);
        });
      }
      rib.add(spine);
      wrap.add(rib);
      crown.add(wrap);
    }
    // un par de cocos colgando del centro de la copa
    for(let i=0;i<2;i++){
      const coco = new THREE.Mesh(new THREE.SphereGeometry(.05,6,5), new THREE.MeshStandardMaterial({color:0x5a4028, flatShading:true}));
      coco.position.set((i-.5)*.07, -.06, .05);
      crown.add(coco);
    }
    g.add(crown);
    return g;
  }

  function build3DTree(rand){
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.BoxGeometry(.14,.55,.14), new THREE.MeshStandardMaterial({color:0x6b4a34, flatShading:true}));
    trunk.position.y = .27;
    g.add(trunk);
    const leafColor = new THREE.Color().setHSL((100+rand()*40)/360, .5, .32);
    for(let i=0;i<3;i++){
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(.42-i*.08, .5, 5), new THREE.MeshStandardMaterial({color:leafColor, flatShading:true}));
      leaf.position.y = .55+i*.32;
      g.add(leaf);
    }
    const s = .8+rand()*.6;
    g.scale.set(s,s,s);
    return g;
  }
  function buildEnvDecor(theme, seed){
    const group = new THREE.Group();
    const rand = mulberry32((seed||1)+77);
    if(theme==='bosque'){
      for(let i=0;i<10;i++){
        const tree = build3DTree(rand);
        const angle = decorAngle(rand), dist = 2.3+rand()*2.9;
        tree.position.set(Math.cos(angle)*dist, -1.2, Math.sin(angle)*dist);
        group.add(tree);
      }
      // setas de colores repartidas por el suelo
      for(let i=0;i<6;i++){
        const mush = new THREE.Group();
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(.03,.04,.12,5), new THREE.MeshStandardMaterial({color:0xf0e6d0, flatShading:true}));
        stem.position.y = .06; mush.add(stem);
        const cap = new THREE.Mesh(new THREE.SphereGeometry(.08,7,5,0,Math.PI*2,0,Math.PI/2), new THREE.MeshStandardMaterial({color: i%2? 0xd4433f : 0xe8a33f, flatShading:true}));
        cap.position.y = .12; mush.add(cap);
        const angle=decorAngle(rand), dist=1.6+rand()*3;
        mush.position.set(Math.cos(angle)*dist, -1.2, Math.sin(angle)*dist);
        group.add(mush);
      }
      // troncos caidos
      for(let i=0;i<3;i++){
        const log = new THREE.Mesh(new THREE.CylinderGeometry(.13,.15,1.1,6), new THREE.MeshStandardMaterial({color:0x5a4230, flatShading:true}));
        log.rotation.z = Math.PI/2; log.rotation.y = rand()*Math.PI;
        const angle=decorAngle(rand), dist=2+rand()*2.3;
        log.position.set(Math.cos(angle)*dist, -1.28, Math.sin(angle)*dist);
        group.add(log);
      }
      // luciernagas: puntitos que brillan sin necesitar animación por fotograma
      for(let i=0;i<14;i++){
        const bug = new THREE.Mesh(new THREE.SphereGeometry(.025,5,5), new THREE.MeshBasicMaterial({color:0xd7ff8a}));
        const angle=decorAngle(rand), dist=1.8+rand()*3.2;
        bug.position.set(Math.cos(angle)*dist, -.4+rand()*1.4, Math.sin(angle)*dist);
        group.add(bug);
      }
    } else if(theme==='parque'){
      for(let i=0;i<16;i++){
        const flower = new THREE.Mesh(new THREE.BoxGeometry(.09,.09,.09), new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(rand(),.75,.62), flatShading:true}));
        const angle = decorAngle(rand), dist = 2+rand()*2.9;
        flower.position.set(Math.cos(angle)*dist, -1.12, Math.sin(angle)*dist);
        group.add(flower);
      }
      [-3,3.4].forEach(x=>{ const tree = build3DTree(rand); tree.position.set(x, -1.2, -2-rand()); group.add(tree); });
      // banco de parque

  function makeSkyTexture(hue, sat, light){
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    const top = new THREE.Color().setHSL(hue/360, sat, Math.max(0,light-.13));
    const mid = new THREE.Color().setHSL(hue/360, sat*.92, light);
    const bottom = new THREE.Color().setHSL(((hue+18)%360)/360, sat*.7, Math.min(1,light+.24));
    const grad = ctx.createLinearGradient(0,0,0,128);
    grad.addColorStop(0, '#'+top.getHexString());
    grad.addColorStop(.62, '#'+mid.getHexString());
    grad.addColorStop(1, '#'+bottom.getHexString());
    ctx.fillStyle = grad; ctx.fillRect(0,0,128,128);
    // unas nubes finas, para que el cielo no se quede completamente vacío
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    for(let i=0;i<5;i++){
      const cx = Math.random()*128, cy = 20+Math.random()*35, cw=18+Math.random()*20;
      ctx.beginPath(); ctx.ellipse(cx,cy,cw,cw*.35,0,0,Math.PI*2); ctx.fill();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    return tex;
  }
  function makeGroundTexture(hue, sat, light){
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const base = new THREE.Color().setHSL(hue/360, sat, light);
    ctx.fillStyle = '#'+base.getHexString(); ctx.fillRect(0,0,256,256);
    // motas de ruido sutil para que no se vea liso de plástico, más manchas oscuras que claras
    for(let i=0;i<450;i++){
      const x = Math.random()*256, y = Math.random()*256, dark = Math.random()<0.6;
      ctx.fillStyle = dark ? 'rgba(0,0,0,'+(Math.random()*.09).toFixed(2)+')' : 'rgba(255,255,255,'+(Math.random()*.06).toFixed(2)+')';
      const s = 2+Math.random()*5;
      ctx.fillRect(x,y,s,s);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(5,5);
    tex.needsUpdate = true;
    return tex;
  }

  function seededHslColor(seed, satBase, lightBase){
    const rand = mulberry32(seed);
    const hue = Math.floor(rand()*360);
    return new THREE.Color().setHSL(hue/360, satBase, lightBase);
  }

  function build3DEgg(){
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color:0xfff3d6, roughness:.85, flatShading:true });
    const rows = 9;
    for(let i=0;i<rows;i++){
      const yNorm = (i/(rows-1))*2-1;
      const widthFactor = Math.sqrt(Math.max(0, 1-yNorm*yNorm));
      if(widthFactor<=0.06) continue;
      const boxW = widthFactor*1.5, boxD = widthFactor*1.5, boxH = (2/rows)*1.25;
      const box = new THREE.Mesh(new THREE.BoxGeometry(boxW, boxH, boxD), mat);
      box.position.y = yNorm*1.15;
      g.add(box);
    }
    const spotMat = new THREE.MeshStandardMaterial({ color:0xffd98a, roughness:.85, flatShading:true });
    [[.4,.4,.7],[-.5,-.1,.6],[.1,-.6,.65]].forEach(p=>{
      const spot = new THREE.Mesh(new THREE.BoxGeometry(.16,.16,.1), spotMat);
      spot.position.set(p[0],p[1],p[2]);
      g.add(spot);
    });
    g.userData.baseScale = .55;
    return g;
  }

  function computeDefaultCamDist(){
    // calculo cuánto tengo que alejar la cámara para que quepa hasta la combinación más grande posible
    // (Suprema con alas o cuernos extendidos), según la proporción real de la pantalla — lo medí de verdad
    // con la caja de colisión de Three.js, no a ojo, porque en móvil vertical el ancho manda, no el alto
    const aspect = window.innerWidth / window.innerHeight;
    const halfV = Math.tan((42/2) * Math.PI/180);
    const maxHalfHeight = 2.9; // antes dejaba lo justo para que no se cortara, pero se veía demasiado grande y pegada a la pantalla — ahora dejo bastante más aire alrededor
    const maxHalfWidth = 2.3;
    const distForHeight = maxHalfHeight / halfV;
    const distForWidth = maxHalfWidth / (halfV*aspect);
    return Math.max(distForHeight, distForWidth, 5.5);
  }

  function initMainScene3D(){
    const canvasEl = document.getElementById('screen');
    const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    let camDist = computeDefaultCamDist();
    camera.position.set(0, 1.1, camDist);
    camera.lookAt(0, .3, 0);
    const hemi = new THREE.HemisphereLight(0xbfe8ff, 0x201030, .9);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(3,4,5);
    scene.add(dir);
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(6, 32),
      new THREE.MeshStandardMaterial({ color:0x2a6b4a, roughness:.9, flatShading:true })
    );
    ground.rotation.x = -Math.PI/2;
    ground.position.y = -1.15;
    scene.add(ground);
    const decor = new THREE.Group();
    scene.add(decor);
    const group = new THREE.Group();
    scene.add(group);

    mainScene3D = { renderer, scene, camera, group, ground, decor, camDist, raf:null, dragging:false, lastX:0, lastY:0, rotY:0.35, rotX:0, bobT:0, pinchDist:null };

    // ---- acariciar / regañar: distingo un gesto real de pasar el dedo sobre la mascota
    // de simplemente arrastrar para girar la cámara — depende de dónde empiece el toque ----
    const raycaster = new THREE.Raycaster();
    let tapState = { x:0, y:0, t:0, onPet:false, strokeDist:0, lastParticleAt:0 };
    let lastPetTime = 0, lastScoldTime = 0;
    const STROKE_THRESHOLD = 42; // píxeles que hay que recorrer sobre ella para que cuente como caricia de verdad
    function hitsPet(x,y){
      if(!mainScene3D.model) return false;
      if(document.getElementById('modalRoot').children.length>0) return false; // con un menú abierto no cuenta como tocar a la mascota
      // si el toque empieza dentro de la fila de botones de abajo (Alimentar/Jugar/.../Más), nunca cuenta
      // como toque sobre la mascota — así, aunque el dedo roce el lienzo justo ahí, no dispara nada
      const controls = document.querySelector('.controls');
      if(controls){
        const cRect = controls.getBoundingClientRect();
        if(y >= cRect.top - 12) return false;
      }
      const rect = canvasEl.getBoundingClientRect();
      const ndc = { x:((x-rect.left)/rect.width)*2-1, y:-((y-rect.top)/rect.height)*2+1 };
      raycaster.setFromCamera(ndc, camera);
      return raycaster.intersectObject(mainScene3D.group, true).length>0;
    }
    function tapDown(x,y){
      tapState = { x, y, t:performance.now(), onPet: hitsPet(x,y), strokeDist:0, lastParticleAt:0 };
    }
    function tapMove(x,y){
      if(!tapState.onPet) return;
      const dx=x-tapState.x, dy=y-tapState.y;
      tapState.strokeDist += Math.hypot(dx,dy);
      tapState.x=x; tapState.y=y;
      // mientras arrastro el dedo por encima le saco alguna chispita, para que se note el gesto en curso
      if(tapState.strokeDist - tapState.lastParticleAt > 22){
        tapState.lastParticleAt = tapState.strokeDist;
        spawnFloatingEmoji('✨');
      }
    }
    function tapUp(){
      if(pet.stage===0 || !pet.alive || !tapState.onPet) return;
      const heldMs = performance.now() - tapState.t;
      if(tapState.strokeDist >= STROKE_THRESHOLD) doPositiveInteraction();
      else if(heldMs >= 480) doNegativeInteraction();
      // un toque cortito sin arrastre real ya no cuenta como nada — quiero un gesto de verdad
    }
    function recentGood(){ return (pet.ticks - (pet.lastGoodTick!=null?pet.lastGoodTick:-999)) <= 15; }
    function recentMistake(){ return (pet.ticks - (pet.lastMistakeTick!=null?pet.lastMistakeTick:-999)) <= 15; }
    function anyModalOpen(){ return document.getElementById('modalRoot').children.length>0; }
    let petStreak = 0, lastPetStreakTime = 0;
    function doPositiveInteraction(){
      if(anyModalOpen()) return; // compruebo otra vez justo aquí, no solo al empezar el toque — por si el menú se abrió a mitad del gesto
      // el gesto de acariciar cambia de significado según lo que haya pasado de verdad hace poco
      const now = Date.now();
      if(now - lastPetTime < 2200) return;
      lastPetTime = now;
      petStreak = (now - lastPetStreakTime < 9000) ? petStreak+1 : 1;
      lastPetStreakTime = now;
      let gain, emoji, sound, msg, reactionKind;
      if(recentGood()){
        gain=5; emoji='🎉'; sound='win'; reactionKind='praise';
        msg = '¡Felicidades, '+pet.name+'! Estás orgulloso de ella 🎉';
      } else if(pet.sick || pet.sac<=25 || pet.happy<=30){
        gain=4; emoji='🤗'; sound='heal'; reactionKind='comfort';
        msg = 'Consuelas a '+pet.name+' — se siente un poco mejor 🤗';
      } else if(petStreak>=4){
        // varias caricias seguidas de verdad — reacciona con más ganas que una caricia suelta
        gain=3; emoji='💕'; sound='tap'; reactionKind='mimoso';
        msg = pet.name+' está encantada contigo — no para de contonearse 💕';
      } else {
        gain=3; emoji='💚'; sound='tap'; reactionKind='pet';
        msg = pet.name+' disfruta las caricias 💚';
      }
      pet.happy = clamp(pet.happy + gain);
      savePet();
      sfx(sound);
      spawnFloatingEmoji(emoji);
      if(reactionKind==='mimoso') setTimeout(()=>spawnFloatingEmoji('💗'), 180); // un segundo corazón, con un pelín de retraso
      showToast(msg);
      triggerReaction(reactionKind, reactionKind==='mimoso'?900:700);
    }
    let scoldStreak = 0;
    function doNegativeInteraction(){
      if(anyModalOpen()) return;
      // solo dejo regañar si de verdad ha hecho algo mal hace poco — si no, no tiene sentido y no hago nada al ánimo
      const now = Date.now();
      if(now - lastScoldTime < 2200) return;
      const gapSinceLast = now - lastScoldTime;
      lastScoldTime = now;
      if(recentMistake()){
        scoldStreak = gapSinceLast < 9000 ? scoldStreak+1 : 1; // si encadeno regaños seguidos, se acobarda más
        pet.happy = clamp(pet.happy - (scoldStreak>=2 ? 4 : 2));
        savePet();
        sfx('hit');
        spawnFloatingEmoji(scoldStreak>=2 ? '😨' : '💢');
        showToast(scoldStreak>=2 ? pet.name+' se encoge, ya sabe que se ha portado mal 😨' : pet.name+' entiende que algo estuvo mal 😟');
        triggerReaction(scoldStreak>=2 ? 'flinch' : 'scold');
      } else {
        scoldStreak = 0;
        sfx('tap');
        spawnFloatingEmoji('❓');
        showToast(pet.name+' no ha hecho nada malo ahora mismo');
        triggerReaction('noreason');
      }
    }

    function onDown(x,y){ mainScene3D.dragging=true; mainScene3D.lastX=x; mainScene3D.lastY=y; tapDown(x,y); }
    function onMove(x,y){
      if(!mainScene3D || !mainScene3D.dragging) return;
      if(tapState.onPet){
        // empecé el toque justo sobre ella: esto es una caricia, no giro la cámara mientras dure
        tapMove(x,y);
        return;
      }
      const dx=x-mainScene3D.lastX, dy=y-mainScene3D.lastY;
      mainScene3D.rotY += dx*0.008;
      mainScene3D.rotX = Math.max(-0.4, Math.min(0.4, mainScene3D.rotX + dy*0.008));
      mainScene3D.lastX=x; mainScene3D.lastY=y;
    }
    function onUp(x,y){
      if(!mainScene3D || !mainScene3D.dragging) return; // si el toque no empezó en el propio lienzo, no cuenta — esto es lo que hacía que un simple clic en un botón de un menú reactivara una caricia vieja
      mainScene3D.dragging = false;
      if(x!=null) tapUp();
    }
    function applyZoom(delta){
      // acerco o alejo la cámara sin dejar que atraviese a la mascota ni se vaya demasiado lejos
      mainScene3D.camDist = Math.max(4, Math.min(14, mainScene3D.camDist + delta));
      mainScene3D.userZoomed = true; // a partir de aquí, un cambio de tamaño de ventana ya no debe pisarme el zoom que elegí
    }
    canvasEl.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
    window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY));
    window.addEventListener('mouseup', e=>onUp(e.clientX,e.clientY));
    canvasEl.addEventListener('wheel', e=>{ e.preventDefault(); applyZoom(e.deltaY*0.003); }, {passive:false});
    canvasEl.addEventListener('touchstart', e=>{
      if(e.touches.length===2){
        mainScene3D.dragging=false;
        const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
        mainScene3D.pinchDist = Math.hypot(dx,dy);
      } else {
        const t=e.touches[0]; onDown(t.clientX,t.clientY);
      }
    }, {passive:true});
    canvasEl.addEventListener('touchmove', e=>{
      if(e.touches.length===2 && mainScene3D.pinchDist!=null){
        const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
        const newDist = Math.hypot(dx,dy);
        applyZoom((mainScene3D.pinchDist-newDist)*0.012);
        mainScene3D.pinchDist = newDist;
      } else if(e.touches.length===1){
        const t=e.touches[0]; onMove(t.clientX,t.clientY);
      }
    }, {passive:true});
    canvasEl.addEventListener('touchend', e=>{
      if(e.touches.length<2) mainScene3D.pinchDist=null;
      const t = e.changedTouches && e.changedTouches[0];
      onUp(t?t.clientX:null, t?t.clientY:null);
    });

    resizeMainScene3D();

    // ---- lo que hace sola cuando no la toco: cada poco elige una conducta nueva y la mantiene un rato ----
    const IDLE_POOL_ACTIVE = ['pasear','jugar','saltar','girar','bailar','pasear','estirarse','curiosidad','estornudar'];
    const IDLE_POOL_CALMA = ['quieta','estirarse','oler','quieta','pasear','bostezar','curiosidad'];
    const ARCHETYPE_SPECIAL_MOVE = { humanoide:'saludar', bestia:'cazar', fantasia:'planear', bicho:'corretear' };
    function pickIdleBehavior(mood, archetype){
      if(mood==='dormida') return 'dormir'; // dormida no se mueve de sitio, solo respira — antes podía tocarle pasear o jugar por error
      const pool = (mood==='triste'||mood==='cansada'||mood==='enferma') ? IDLE_POOL_CALMA.slice()
                 : (mood==='euforica'||mood==='feliz') ? IDLE_POOL_ACTIVE.slice()
                 : ['pasear','jugar','oler','estirarse','girar','quieta'];
      // a las formas nuevas les doy, además, su propio gesto característico, mezclado con el resto
      const special = ARCHETYPE_SPECIAL_MOVE[archetype];
      if(special && mood!=='triste' && mood!=='enferma'){ pool.push(special, special); }
      return pool[Math.floor(Math.random()*pool.length)];
    }
    function updateIdleBehavior(model, mood, now, archetype){
      if(!mainScene3D.idle){
        mainScene3D.idle = { behavior:'quieta', startAt:now, durMs:3000, walkFrom:{x:0,z:0}, walkTo:{x:0,z:0} };
      }
      const idle = mainScene3D.idle;
      const elapsed = now - idle.startAt;
      const mustSleepNow = mood==='dormida' && idle.behavior!=='dormir';
      const mustWakeNow = mood!=='dormida' && idle.behavior==='dormir';
      if(elapsed >= idle.durMs || mustSleepNow || mustWakeNow){
        idle.behavior = pickIdleBehavior(mood, archetype);
        idle.startAt = now;
        idle.durMs = mood==='dormida' ? 999999 : 3200 + Math.random()*4600; // dormida se queda así hasta que se despierte, no vuelvo a sortear
        if(idle.behavior==='pasear'){
          idle.walkFrom = { x: model.position.x, z: model.position.z };
          const angle = Math.random()*Math.PI*2, dist = .5+Math.random()*1.2;
          idle.walkTo = { x: Math.cos(angle)*dist, z: Math.sin(angle)*dist };
        }
        if(idle.behavior==='dormir'){ model.position.x = 0; model.position.z = 0; } // se queda quieta justo donde toca dormir
        // de vez en cuando, al quedarse quieta u oliendo el aire, le da por ladear la cabeza como si algo le llamara la atención
        if((idle.behavior==='quieta'||idle.behavior==='oler') && (mood==='neutral'||mood==='feliz'||mood==='aburrida') && Math.random()<.3){
          triggerReaction('curioso', 1400);
        }
      }
      let extraRotY=0, extraScale=1, bobBoost=1, extraTiltZ=0;
      const b = idle.behavior, el = now - idle.startAt;
      if(b==='pasear'){
        const walkT = Math.min(1, el/1700);
        model.position.x = idle.walkFrom.x + (idle.walkTo.x-idle.walkFrom.x)*walkT;
        model.position.z = idle.walkFrom.z + (idle.walkTo.z-idle.walkFrom.z)*walkT;
        if(walkT<1){
          const dx=idle.walkTo.x-idle.walkFrom.x, dz=idle.walkTo.z-idle.walkFrom.z;
          extraRotY = Math.atan2(dx,dz);
          bobBoost = 1.7;
        }
      } else if(b==='jugar'){
        bobBoost = 2.1;
        extraRotY = Math.sin(el*0.006)*.35;
      } else if(b==='saltar'){
        bobBoost = 1 + Math.max(0, Math.sin(el*0.006))*1.8;
      } else if(b==='girar'){
        extraRotY = (el/1100)*Math.PI*2;
      } else if(b==='bailar'){
        extraRotY = Math.sin(el*0.009)*.5;
        bobBoost = 1.9;
      } else if(b==='estirarse'){
        extraScale = 1 + Math.sin(el*0.0025)*.07;
      } else if(b==='oler'){
        model.rotation.x += Math.sin(el*0.007)*.07;
      } else if(b==='saludar'){
        // el humanoide se inclina de lado a lado, como saludando con todo el cuerpo
        extraTiltZ = Math.sin(el*0.007)*.22;
        bobBoost = .6;
      } else if(b==='cazar'){
        // la bestia se agazapa un momento y luego da un pequeño salto hacia delante, como al acecho
        const t = (el%1400)/1400;
        if(t<.55){ extraScale = 1 - (t/.55)*.1; }
        else { const jt=(t-.55)/.45; extraScale = .9 + jt*.1; bobBoost = 1+jt*2.4; }
      } else if(b==='planear'){
        // la fantasía inclina las alas y flota describiendo una curva suave, como planeando
        extraTiltZ = Math.sin(el*0.0035)*.28;
        extraRotY = Math.sin(el*0.0035)*.3;
        bobBoost = .5;
      } else if(b==='corretear'){
        // el bicho da pasitos rápidos y nerviosos de lado a lado, con paradas bruscas — nada de movimiento suave
        const step = Math.floor(el/180)%2;
        extraRotY = (step?1:-1)*.12;
        bobBoost = 3.2;
      } else if(b==='curiosidad'){
        // ladea la cabeza como si algo le hubiera llamado la atención, y se mantiene un rato así
        const t = Math.min(1, el/450);
        extraTiltZ = Math.sin(t*Math.PI/2)*.19;
        bobBoost = .5;
      } else if(b==='estornudar'){
        // un respingo hacia dentro y hacia fuera, como un estornudo, que se repite un par de veces
        const t = (el%850)/850;
        if(t<.16){ extraScale = 1 - (t/.16)*.09; }
        else if(t<.32){ const jt=(t-.16)/.16; extraScale = .91 + jt*.13; bobBoost = 1+jt*1.6; }
        else { extraScale = 1; }
      } else if(b==='bostezar'){
        // se estira hacia atrás un momento, como un bostezo largo, y vuelve despacio
        const t = Math.min(1, el/1300);
        const yawn = Math.sin(t*Math.PI);
        extraScale = 1 + yawn*.07;
        model.rotation.x += -yawn*.14;
        bobBoost = .4;
      } else if(b==='dormir'){
        // completamente quieta, ni gira ni se desplaza — solo la respiración lenta que ya le pone el ánimo "dormida"
        bobBoost = 1;
      }
      model.rotation.y = extraRotY;
      model.rotation.z += extraTiltZ;
      return { extraScale, bobBoost };
    }

    function computeMood(p){
      if(p.sleeping) return 'dormida';
      if(p.sick) return 'enferma';
      if(p.happy>=85 && p.sac>=55) return 'euforica';
      if(p.happy>=65 && p.sac>=45) return 'feliz';
      if(p.happy<=30 || p.sac<=25) return 'triste';
      if(p.energy<=25) return 'cansada';
      if(p.happy<=48 && p.energy<=55) return 'aburrida';
      return 'neutral';
    }
    function applyMoodPose(model, mood, t){
      let bobSpeed=0.03, bobAmp=0.06, eyeSquint=1, tiltZ=0, tiltX=0, wiggle=0, hop=0;
      let mouthCurve=0, browTilt=0, browLift=0; // curva de la boca (+sonríe/-frunce), inclinación y altura de cejas
      if(mood==='euforica'){
        bobSpeed=0.08; bobAmp=0.09; eyeSquint=.65;
        wiggle = Math.sin(t*3)*.06;
        hop = Math.max(0, Math.sin(t*0.9))*0.09; // le entran saltitos de la emoción
        mouthCurve=.045; browLift=.025;
      } else if(mood==='feliz'){
        bobSpeed=0.055; bobAmp=0.09; eyeSquint=.72;
        wiggle = Math.sin(t*1.6)*.02;
        mouthCurve=.032; browLift=.015;
      } else if(mood==='aburrida'){
        bobSpeed=0.018; bobAmp=0.035; eyeSquint=.85;
        wiggle = Math.sin(t*0.5)*.045; // se balancea despacio de lado a lado, como sin ganas
        mouthCurve=-.008;
      } else if(mood==='triste'){
        bobSpeed=0.014; bobAmp=0.022; eyeSquint=.5; tiltX=-.09;
        mouthCurve=-.038; browTilt=.16; browLift=-.01;
      } else if(mood==='cansada'){
        bobSpeed=0.011; bobAmp=0.018; eyeSquint=.32; tiltX=-.06;
        mouthCurve=-.018; browLift=-.015;
      } else if(mood==='enferma'){
        bobSpeed=0.02; bobAmp=0.028; tiltZ=Math.sin(t*1.7)*.05; eyeSquint=.6;
        mouthCurve=-.03; browTilt=.22;
      } else if(mood==='dormida'){
        bobSpeed=0.011; bobAmp=0.032; tiltX=-.16;
      }
      model.rotation.x = tiltX;
      model.rotation.z = tiltZ + wiggle;

      // parpadeo de verdad: cada pocos segundos (con algo de azar) cierra los ojos un instante y los abre
      const now = performance.now();
      if(mood!=='dormida'){
        if(!model.userData.nextBlinkAt || now > model.userData.nextBlinkAt){
          model.userData.blinkStart = now;
          model.userData.nextBlinkAt = now + 2200 + Math.random()*3600;
        }
        const blinkEl = now - (model.userData.blinkStart||-99999);
        model.userData.blinkAmt = (blinkEl>=0 && blinkEl<190) ? Math.sin((blinkEl/190)*Math.PI) : 0;
      } else {
        model.userData.blinkAmt = 0;
      }
      const blinkAmt = model.userData.blinkAmt||0;
      // la boca "respira" un poco, un ligero vaivén constante para que no se quede clavada
      const mouthBreath = Math.sin(now*0.0016)*.006;

      model.traverse(o=>{
        if(o.userData && o.userData.isEye && o.userData.baseScale && mood!=='dormida'){
          const squintNow = eyeSquint * (1 - blinkAmt*0.9); // el parpadeo casi cierra el ojo un instante
          o.scale.set(o.userData.baseScale.x, o.userData.baseScale.y*squintNow, o.userData.baseScale.z);
          // un ligero vistazo de un lado a otro, de vez en cuando, para que no se queden clavados mirando al frente
          if(o.userData.baseEyeX==null){ o.userData.baseEyeX = o.position.x; o.userData.baseEyeY = o.position.y; o.userData.lookSeed = Math.random()*10; }
          o.position.x = o.userData.baseEyeX + Math.sin(now*0.0004 + o.userData.lookSeed)*.012;
          o.position.y = o.userData.baseEyeY + Math.sin(now*0.00027 + o.userData.lookSeed)*.008;
        } else if(o.userData && o.userData.isMouthSeg){
          const idx = o.userData.segIndex;
          o.position.y = o.userData.baseY + mouthCurve*(idx*idx/4) - (idx===0?mouthCurve*.4:0) + mouthBreath;
        } else if(o.userData && o.userData.isBrow){
          o.rotation.z = -o.userData.side*browTilt;
          o.position.y = o.userData.baseY + browLift + blinkAmt*.012; // las cejas suben un pelín al parpadear, como algo natural
        }
      });
      return {bobSpeed, bobAmp, hop};
    }

    // ---- reacciones rápidas: un gesto que se nota al momento cuando la acaricias, la felicitas, la consuelas o la regañas ----
    function triggerReaction(kind, dur){
      if(!mainScene3D) return;
      mainScene3D.reaction = { kind, start: performance.now(), dur: dur||700 };
    }
    function applyReaction(model){
      if(!mainScene3D.reaction) return {y:0, scale:1};
      const elapsed = performance.now() - mainScene3D.reaction.start;
      const dur = mainScene3D.reaction.dur || 700;
      if(elapsed > dur){ mainScene3D.reaction = null; return {y:0, scale:1}; }
      const p = elapsed/dur, wave = Math.sin(p*Math.PI);
      const kind = mainScene3D.reaction.kind;
      let extraY=0, scale=1, extraRotZ=0, extraRotY=0;
      if(kind==='pet'){ scale = 1+wave*.07; extraRotZ = Math.sin(p*Math.PI*4)*.05; }
      else if(kind==='praise'){ extraY = wave*.32; scale = 1+wave*.1; }
      else if(kind==='comfort'){ extraY = wave*.12; scale = 1+wave*.04; }
      else if(kind==='scold'){ scale = 1-wave*.1; extraY = -wave*.07; }
      else if(kind==='flinch'){ scale = 1-wave*.18; extraY = -wave*.1; extraRotZ = Math.sin(p*Math.PI*10)*.08*wave; }
      else if(kind==='noreason'){ extraRotZ = Math.sin(p*Math.PI*3)*.09; }
      else if(kind==='mimoso'){ extraRotY = Math.sin(p*Math.PI*3)*.22*wave; scale = 1+wave*.08; extraY = wave*.06; } // se contonea de gusto, para las rachas de caricias seguidas
      else if(kind==='sorpresa'){ extraY = Math.sin(p*Math.PI*1.5)*.22; scale = 1+wave*.13; } // un saltito de sobresalto, mas alto y seco que "praise"
      else if(kind==='curioso'){ extraRotZ = wave*.16; } // ladea la cabeza, como examinando algo — se queda a medio camino, no vuelve rapido
      model.rotation.z += extraRotZ;
      model.rotation.y += extraRotY;
      return { y: extraY, scale };
    }

    function loop(){
      if(!mainScene3D) return;
      const modalOpen = document.getElementById('modalRoot').children.length>0;
      if(!modalOpen){
        const mood = computeMood(pet);
        const {bobSpeed, bobAmp, hop} = mainScene3D.model ? applyMoodPose(mainScene3D.model, mood, mainScene3D.bobT) : {bobSpeed:.03, bobAmp:.06, hop:0};
        let bobBoost = 1, idleScale = 1;
        if(mainScene3D.model && !mainScene3D.dragging){
          const idleOut = updateIdleBehavior(mainScene3D.model, mood, performance.now(), pet.archetype||'criatura');
          bobBoost = idleOut.bobBoost; idleScale = idleOut.extraScale;
        }
        const reaction = mainScene3D.model ? applyReaction(mainScene3D.model) : {y:0, scale:1};
        if(mainScene3D.model) mainScene3D.model.scale.setScalar((mainScene3D.model.userData.baseScale||1) * idleScale * reaction.scale);
        mainScene3D.bobT += bobSpeed;
        mainScene3D.group.rotation.y = mainScene3D.rotY; // ya no giro solo — únicamente cuando arrastras con el dedo
        mainScene3D.group.rotation.x = mainScene3D.rotX;
        mainScene3D.group.position.y = Math.sin(mainScene3D.bobT)*bobAmp*bobBoost + hop + reaction.y;
        // la cámara sigue a donde esté paseando la mascota, con suavizado, así se va viendo el entorno a su alrededor
        const targetX = mainScene3D.model ? mainScene3D.model.position.x : 0;
        const targetZ = mainScene3D.model ? mainScene3D.model.position.z : 0;
        if(mainScene3D.camFollowX==null){ mainScene3D.camFollowX = targetX; mainScene3D.camFollowZ = targetZ; mainScene3D.camDistSmoothed = mainScene3D.camDist; }
        mainScene3D.camFollowX += (targetX - mainScene3D.camFollowX) * 0.07;
        mainScene3D.camFollowZ += (targetZ - mainScene3D.camFollowZ) * 0.07;
        mainScene3D.camDistSmoothed += (mainScene3D.camDist - mainScene3D.camDistSmoothed) * 0.15; // el zoom sigue suavizado, no a saltos
        camera.position.x = mainScene3D.camFollowX;
        camera.position.z = mainScene3D.camFollowZ + mainScene3D.camDistSmoothed;
        camera.position.y += (1.1 - camera.position.y) * 0.15;
        camera.lookAt(mainScene3D.camFollowX, .3, mainScene3D.camFollowZ);
        renderer.render(scene, camera);
      }
      mainScene3D.raf = requestAnimationFrame(loop);
    }
    loop();
  }

  function resizeMainScene3D(){
    if(!mainScene3D) return;
    const canvasEl = document.getElementById('screen');
    const w = window.innerWidth, h = window.innerHeight;
    mainScene3D.renderer.setSize(w, h, false);
    mainScene3D.camera.aspect = w/h;
    mainScene3D.camera.updateProjectionMatrix();
    // antes calculaba la distancia de la cámara solo una vez al arrancar — si luego la ventana cambiaba de
    // forma (girar el móvil, abrir DevTools, redimensionar en escritorio) la distancia se quedaba vieja y
    // ya no encajaba con la pantalla nueva. La recalculo aquí también, salvo que ya hayas tocado el zoom tú mismo
    if(!mainScene3D.userZoomed){ mainScene3D.camDist = computeDefaultCamDist(); }
  }
  window.addEventListener('resize', ()=>{ clearTimeout(mainScene3D&&mainScene3D._rT); resizeMainScene3D(); });

  let usedThreeFallback = false;
  function render2DFallback(){
    // si el 3D no está disponible por lo que sea (sin conexión al CDN, WebGL no soportado...),
    // no dejo la pantalla en blanco: vuelvo al dibujo en pixel art de toda la vida, que no depende de nada externo
    if(!usedThreeFallback){
      usedThreeFallback = true;
      const aspect = window.innerHeight / window.innerWidth;
      screenCanvas.width = GRID * CELL_PX;
      screenCanvas.height = Math.max(screenCanvas.width, Math.round(GRID * CELL_PX * aspect));
      screenCanvas.style.imageRendering = 'pixelated';
    }
    useCanvas(screenCanvas);
    if(pet.stage===0) drawEgg(pet.frame, pet.bgSeed);
    else drawCreature(pet);
    useScreenCanvas();
  }
  let threeFailedOnce = false;
  function update3DMainScene(){
    if(typeof THREE === 'undefined'){ render2DFallback(); return; }
    if(!mainScene3D && !threeFailedOnce){
      try{ initMainScene3D(); }
      catch(e){ threeFailedOnce = true; console.error('No pude iniciar el visor 3D, uso el pixel art de siempre:', e); }
    }
    if(!mainScene3D){ render2DFallback(); return; }
    const sig = [pet.stage, pet.hue, pet.archetype, pet.bodyShape, pet.featureType, pet.eyeStyle, pet.pattern, pet.sick, pet.sleeping, pet.bgSeed].join('|');
    if(sig !== mainSceneSignature){
      mainSceneSignature = sig;
      while(mainScene3D.group.children.length){
        const old = mainScene3D.group.children[0];
        mainScene3D.group.remove(old);
        disposeObject3D(old);
      }
      const model = pet.stage===0 ? build3DEgg() : build3DCreature({...snapshotVisual(pet), sleeping: pet.sleeping});
      if(pet.sick){ model.traverse(o=>{ if(o.material && o.material.color){ o.material.color.multiplyScalar(.6); } }); }
      mainScene3D.group.add(model);
      mainScene3D.model = model;
      const theme = pickEnvTheme(pet.bgSeed);
      const colors = ENV_COLORS[theme];
      if(mainScene3D.ground.material.map) mainScene3D.ground.material.map.dispose();
      mainScene3D.ground.material.color.set(0xffffff);
      mainScene3D.ground.material.map = makeGroundTexture(colors.ground[0], colors.ground[1], colors.ground[2]);
      mainScene3D.ground.material.needsUpdate = true;
      const skyLight = pet.sleeping ? colors.sky[2]*.4 : colors.sky[2];
      if(mainScene3D.scene.background && mainScene3D.scene.background.dispose) mainScene3D.scene.background.dispose();
      mainScene3D.scene.background = makeSkyTexture(colors.sky[0], colors.sky[1], skyLight);
      mainScene3D.scene.fog = new THREE.Fog(new THREE.Color().setHSL(colors.sky[0]/360, colors.sky[1], skyLight).getHex(), 8, 20);
      if(mainScene3D.themeKey !== theme+'|'+pet.bgSeed){
        mainScene3D.themeKey = theme+'|'+pet.bgSeed;
        while(mainScene3D.decor.children.length){
          const old = mainScene3D.decor.children[0];
          mainScene3D.decor.remove(old);
          disposeObject3D(old);
        }
        mainScene3D.decor.add(buildEnvDecor(theme, pet.bgSeed));
      }
    }
  }

  loadPet().then(()=>{
    setInterval(()=>tick(true), TICK_MS);
    setInterval(()=>{ if(pet.alive && pet.stage>0){ render(); } }, 550); // idle animation refresh
  });
})();
</script>
<script>
  // registro mi service worker, así "Añadir a pantalla de inicio" crea un acceso directo de verdad
  // (con mi icono y sin barra del navegador), no solo un marcador cualquiera del navegador
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* si falla, la app sigue funcionando igual, solo sin caché offline */ });
    });
  }
</script>
